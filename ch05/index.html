'use strict';
const CHAPTER = { number: 5, title: 'Суперспирализация и топоизомеразы', minutes: 13, language: 'ru', next: '../ch06/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
const C2 = mix(COL.chalk, COL.board, .35);   // the second strand of the ring model
const nf = v => (v < 0 ? '−' : '') + String(Math.abs(v)).replace('.', ',');
// A dashed frame (rect) hidden until t0.
function frameR(p, x, y, w, h, color, t0, { dash = true, fill = 'none', o = 1 } = {}) {
  const e = mk('rect', { x, y, width: w, height: h, rx: 14, fill, stroke: color, 'stroke-width': 3, ...(dash ? { 'stroke-dasharray': '9 7' } : {}) }, p);
  put(e, { o: 0 }); if (t0 != null) tw(e, { o }, t0, .5);
  return e;
}
// A card: a filled frame with its title.
function card5(p, x, y, w, h, title, t0, color = PROT) {
  frameR(p, x, y, w, h, color, t0, { dash: false, fill: CARD });
  say(p, title, x + 26, y + 46, t0 + .2, { size: 30, fill: color, weight: 700, anchor: 'start' });
}
// An arc of radius R from angle a0 to a1 (degrees, clockwise positive, 0 = right), drawn as two halves so spans up to 360° work.
const arcD = (cx, cy, R, a0, a1) => {
  const pt = a => `${(cx + R * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(cy + R * Math.sin(a * Math.PI / 180)).toFixed(1)}`;
  const sw = a1 > a0 ? 1 : 0;
  return `M${pt(a0)}A${R} ${R} 0 0 ${sw} ${pt((a0 + a1) / 2)}A${R} ${R} 0 0 ${sw} ${pt(a1)}`;
};
// A small circular arrow around (x, y): an arc and its head; ccw turns it the other way.
function turnMark(p, x, y, r, color, t0, ccw = false) {
  const g = G(p, { x, y, o: 0 }), a0 = ccw ? 60 : -150, a1 = ccw ? -210 : 120, rad = a1 * Math.PI / 180;
  path(g, arcD(0, 0, r, a0, a1), { stroke: color, 'stroke-width': 4 });
  const hx = r * Math.cos(rad), hy = r * Math.sin(rad), tx = -Math.sin(rad) * (ccw ? -1 : 1), ty = Math.cos(rad) * (ccw ? -1 : 1);
  mk('path', { d: `M${hx + tx * 12} ${hy + ty * 12}L${hx - ty * 8 - tx * 4} ${hy + tx * 8 - ty * 4}L${hx + ty * 8 - tx * 4} ${hy - tx * 8 - ty * 4}Z`, fill: color }, g);
  if (t0 != null) show(g, t0);
  return g;
}
// A counter "L = 6": .to(v, t) switches the value with a flash, .count(v, t, dur) runs through the integers.
function ctr(p, label, x, y, v, t0, { size = 52, fill = COL.chalk } = {}) {
  const g = G(p, { x, y, o: 0 }), e = T(g, '', { size, fill, weight: 700 }), txt = n => `${label} = ${nf(n)}`;
  e.textContent = txt(v); g.v = v;
  const flash = t => { tw(e, { c_fill: DNA }, t, .2); tw(e, { c_fill: fill }, t + 1, .6); };
  g.to = (v2, t) => { const a = g.v; g.v = v2; prog(q => { e.textContent = txt(q > 0 ? v2 : a); }, t, .05, lin); flash(t); return g; };
  g.count = (v2, t, dur) => { const a = g.v; g.v = v2; prog(q => { e.textContent = txt(Math.round(a + (v2 - a) * q)); }, t, dur, lin); flash(t); return g; };
  if (t0 != null) show(g, t0);
  return g;
}
// Scissors, centred on (x, y).
function scissors(p, x, y, t0, c = PROT) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M-18 -10L30 14M-18 10L30 -14', { stroke: c, 'stroke-width': 5 });
  [-1, 1].forEach(s => mk('circle', { cx: -28, cy: 15 * s, r: 10, fill: 'none', stroke: c, 'stroke-width': 4 }, g));
  if (t0 != null) show(g, t0);
  return g;
}
// The fixed end of a DNA segment: a wall with hatching on the outer side (side −1: left).
function pinWall(p, x, y, t0, side = -1) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M0 -62V62', { stroke: COL.chalk, 'stroke-width': 6 });
  for (let k = -52; k <= 40; k += 22) path(g, `M0 ${k}l${side * 18} 18`, { stroke: COL.dim, 'stroke-width': 3 });
  show(g, t0);
  return g;
}
// A short duplex seen from above, (x1, y1) → (x2, y2): two strands with rungs, a board halo under it (so it covers what it
// crosses) and an arrowhead for its direction.
function dBar(p, x1, y1, x2, y2, c, { head = true, halo = true } = {}) {
  const g = G(p), dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, nx = -uy * 10, ny = ux * 10;
  if (halo) path(g, `M${x1} ${y1}L${x2} ${y2}`, { stroke: COL.board, 'stroke-width': 42, 'stroke-linecap': 'butt' });
  for (let s = 12; s < l - 6; s += 22) path(g, `M${x1 + ux * s + nx} ${y1 + uy * s + ny}L${x1 + ux * s - nx} ${y1 + uy * s - ny}`, { stroke: c, 'stroke-width': 3, opacity: .6 });
  [1, -1].forEach(k => path(g, `M${x1 + k * nx} ${y1 + k * ny}L${x2 + k * nx} ${y2 + k * ny}`, { stroke: c, 'stroke-width': 6 }));
  if (head) mk('path', { d: `M${x2 + ux * 30} ${y2 + uy * 30}L${x2 - uy * 18} ${y2 + ux * 18}L${x2 + uy * 18} ${y2 - ux * 18}Z`, fill: c }, g);
  return g;
}
// A T-segment seen end-on: a ringed disc with its letter.
function tSeg(p, x, y) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: 24, fill: mix(COL.board, DNA, .4), stroke: DNA, 'stroke-width': 4 }, g);
  T(g, 'T', { y: 9, size: 26, fill: DNA, weight: 700, anchor: 'middle' });
  return g;
}
// A tachometer, 0–6000 rpm; .to(v, t, dur) turns the needle and the readout.
function tacho(p, cx, cy, R, t0) {
  const g = G(p, { x: cx, y: cy, o: 0 }), a0 = 150, span = 240, max = 6000, ang = v => a0 + span * v / max;
  path(g, arcD(0, 0, R, a0, a0 + span), { stroke: COL.dim, 'stroke-width': 6 });
  for (let v = 0; v <= max; v += 1000) {
    const a = ang(v) * Math.PI / 180;
    path(g, `M${((R - 18) * Math.cos(a)).toFixed(1)} ${((R - 18) * Math.sin(a)).toFixed(1)}L${(R * Math.cos(a)).toFixed(1)} ${(R * Math.sin(a)).toFixed(1)}`, { stroke: COL.chalk, 'stroke-width': 4 });
    T(g, String(v / 1000), { x: (R - 42) * Math.cos(a), y: (R - 42) * Math.sin(a) + 8, size: 22, fill: COL.dim, weight: 700, anchor: 'middle' });
  }
  const val = T(g, '0', { y: R * .5, size: 36, weight: 700, anchor: 'middle' });
  T(g, 'об/мин', { y: R * .5 + 34, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  const nd = G(g, { r: a0 });
  path(nd, `M0 0L${R - 30} 0`, { stroke: DNA, 'stroke-width': 6 });
  mk('circle', { r: 11, fill: COL.chalk }, g);
  g.v = 0;
  g.to = (v, t, dur) => {
    const a = g.v; g.v = v;
    tw(nd, { r: ang(v) }, t, dur);
    prog(q => { val.textContent = '≈ ' + Math.round((a + (v - a) * io(q)) / 100) * 100; }, t, dur, lin);
    return g;
  };
  show(g, t0);
  return g;
}
// A hard disk seen from above.
function hdd(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -100, y: -125, width: 200, height: 250, rx: 16, fill: CARD, stroke: COL.dim, 'stroke-width': 3 }, g);
  mk('circle', { cx: 0, cy: -25, r: 78, fill: 'none', stroke: COL.chalk, 'stroke-width': 4 }, g);
  mk('circle', { cx: 0, cy: -25, r: 12, fill: COL.chalk }, g);
  path(g, 'M72 100L64 30L22 -6', { stroke: COL.dim, 'stroke-width': 7 });
  show(g, t0);
  return g;
}
// The gyrase as three pairs of gates (side view), centred on (x, y): N-gate lobes (GyrB) on top, the DNA-gate blocks in the
// middle, C-gate lobes (GyrA) at the bottom. .gate(k, open, t) opens or closes 'N', 'D' or 'C'.
function gyrBody(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 }), fB = mix(COL.board, PROT, .45), fA = mix(COL.board, PROT, .28), sk = { stroke: PROT, 'stroke-width': 3 };
  const lobe = (px, py, dx, dy, w, h, f) => {
    const e = G(g, { x: px, y: py });
    mk('rect', { x: dx - w / 2, y: dy - h / 2, width: w, height: h, rx: 44, fill: f, ...sk }, e);
    return e;
  };
  g.C = [lobe(-12, 95, -46, 55, 92, 118, fA), lobe(12, 95, 46, 55, 92, 118, fA)];
  g.N = [lobe(-12, -95, -50, -62, 100, 128, fB), lobe(12, -95, 50, -62, 100, 128, fB)];
  g.D = [G(g), G(g)];
  [0, 1].forEach(i => mk('rect', { x: i ? 6 : -150, y: -52, width: 144, height: 104, rx: 30, fill: fA, ...sk }, g.D[i]));
  g.gate = (k, open, t, dur = .8) => {
    if (k === 'D') g.D.forEach((e, i) => tw(e, { x: open ? (i ? 72 : -72) : 0 }, t, dur));
    else g[k].forEach((e, i) => tw(e, { r: open ? (k === 'N' ? 1 : -1) * (i ? 30 : -30) : 0 }, t, dur));
  };
  if (t0 != null) show(g, t0);
  return g;
}

    say(p, 'витки копятся впереди вилки', X, 500, m('jam'), { size: 28, weight: 600, anchor: 'start' });
    const [fx, fy, nx, ny] = ring.pt(ring.cur, .45), sg = nx * fx + ny * fy < 0 ? -1 : 1;
    yesNo(p, false, cx + fx + nx * sg * 52, cy + fy + ny * sg * 52, m('jam', 2.2));
    say(p, 'вилка встаёт', X, 545, m('jam', 2.2), { size: 28, fill: NO, weight: 700, anchor: 'start' });
    enzyme(p, 'топоизомераза', 990, 625, m('enz'), { w: 250, h: 76 });
    scissors(p, 1170, 625, m('enz', .5));
    say(p, 'разрезать → протащить цепь → зашить', X, 700, m('enz', 1.5), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });

    cT.to(4, m('t4', 1.4)); cW.to(2, m('t4', 2));
    loopMarks({ ...ring.cur }, m('t4', 2.6));
    nums({ ...ring.cur }, m('t4', 2.8));
    colorLine(p, [['T + W = 4 + 2 = '], ['6', DNA], [' = L']], X, 560, m('sum', 1), { size: 40, anchor: 'start' });
    colorLine(p, [['L', DNA], [' = '], ['T'], [' + '], ['W']], 800, 108, m('rule'), { size: 64 });
    say(p, 'витки и супервитки переходят друг в друга, сумма закреплена', 800, 160, m('rule', 3.7), { size: 26, fill: COL.dim, weight: 600 });
  }],
  ['relaxed', 'Релаксированное кольцо', (m) => {

    pill(p, 'релаксированная', COL.chalk, cx, cy + 80, m('relax'), 26);

  ['variants', 'Витки или супервитки', (m) => {
    const p = panel(0), X3 = [270, 800, 1330], cy = 310;
