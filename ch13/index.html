<script>
'use strict';
const CHAPTER = { number: 13, title: 'ДНК-полимеразы эукариот', minutes: 17, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — polymerase, enzyme, fork, dsIcon, betaRing, clampSide, strand, duplex) ---------- */
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });
const line = (p, str, x, y, t0, fill = COL.chalk, size = 28, anchor = 'start', weight = 600) => say(p, str, x, y, t0, { size, fill, anchor, weight });

// a small polymerase "hand" with a caption under it; the wrapper fades as a whole (o 0 until shown)
function pico(p, x, y, lab, s = .16, { dy = 30, size = 26, fill = COL.chalk } = {}) {
  const g = G(p, { x, y, o: 0 });
  g.pol = polymerase(g, 0, 0, null, { s });
  if (lab) g.cap = T(g, lab, { y: 202 * s + dy, size, fill, weight: 700, anchor: 'middle' });
  return g;
}
// a nucleotide bead
function bead(p, x, y, b, r = 20) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: BASE[b] }, g);
  T(g, b, { y: r * .4, size: r * 1.05, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const crossX = (p, x, y, k = 1, c = NO) => { const g = G(p, { x, y, s: k }); path(g, 'M-26 -26L26 26M26 -26L-26 26', { stroke: c, 'stroke-width': 8 }); return g; };
// the ubiquitin mark
function ubi(p, x, y, r = 17) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: COL.int }, g);
  T(g, 'Ub', { y: r * .36, size: r * 1.0, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const strip = (p, x, y, w, h, col, o = 1) => put(mk('rect', { x, y, width: w, height: h, rx: Math.min(10, h / 2), fill: col }, p), { o });
// a text that changes at time t (one element, text only)
const swap = (e, str, t) => prog(() => { e.textContent = str; }, t, .01, lin);

/* ---------- template + new strand with the PCNA clamp around them (signal, pass, gate) ---------- */
const TY = 525, NY = 481, RY = 503;
function pcnaStrand(p, { x0 = 160, tx1 = 1500, nx1 = 655, ringX = 500 } = {}) {
  const pb = G(p);
  const tpl = path(p, `M${x0} ${TY}H${tx1}`, { stroke: COL.chalk, 'stroke-width': 8 });
  const nw = path(p, `M${x0} ${NY}H${nx1}`, { stroke: DNA, 'stroke-width': 8 });
  const pf = G(p);
  const ring = clampSide(pb, pf, ringX, RY, null, { rx: 18, ry: 50, sw: 11 });
  return { tpl, nw, ring, ringX };
}

/* ---------- the five main polymerases: one card per row (five, q1) ---------- */
const FIVE = [['α', 'праймаза + короткий участок ДНК', false], ['δ', 'отстающая цепь', true], ['ε', 'лидирующая цепь', true], ['γ', 'митохондриальная ДНК', true], ['β', 'репарация: замена одного основания', false]];
const rowY = i => 130 + i * 100;
function fiveRows(p, t0, withTasks) {
  return FIVE.map(([g, task], i) => {
    const y = rowY(i), r = G(p, { o: 0 });
    mk('rect', { x: 100, y, width: 1400, height: 88, rx: 16, fill: CARD, stroke: COL.dim, 'stroke-width': 2.5 }, r);
    polymerase(r, 196, y + 44, null, { s: .16 });
    T(r, 'Pol ' + g, { x: 300, y: y + 56, size: 38, weight: 700 });
    show(r, t0 + i * .12);
    const t = T(p, task, { x: 470, y: y + 56, size: 32, fill: DNA, weight: 600, o: 0 });
    if (withTasks) show(t, t0 + .5);
    return { r, t, y };
  });
}
// pick several stage objects (like pickEls, but all of `rights` must be pressed)
const pickMulti = (items, rights, yes, no) => (body, api) => {
  const L = qlayer();
  let locked = false, cur = -1, got = 0;
  const hits = items.map((it, i) => {
    const [x, y, w, hh] = it.box, g = G(L);
    g.classList.add('hit'); g.setAttribute('tabindex', 0); g.setAttribute('role', 'button'); g.setAttribute('aria-label', it.label);
    mk('rect', { class: 'ring', x, y, width: w, height: hh, rx: 12 }, g);
    const act = () => {
      if (locked || g.classList.contains('good')) return;
      if (rights.includes(i)) { g.classList.add('good'); g.classList.remove('bad'); if (++got === rights.length) api.grade(true, yes); }
      else { g.classList.add('bad'); shakeFx(it.el); api.grade(false, no(i)); }
    };
    g.addEventListener('click', act);
    keyAct(g, act);
    return g;
  });
  return {
    reveal() { hits.forEach((g, i) => rights.includes(i) && g.classList.add('good')); return yes; },
    lock() { locked = true; },
    hint: [kbd('↑'), kbd('↓'), ' выбор, ', kbd('Enter'), ' нажать или щёлкните'],
    key(e) {
      const d = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
      if (!d || locked) return false;
      cur = cur < 0 ? (d > 0 ? 0 : hits.length - 1) : (cur + d + hits.length) % hits.length;
      hits[cur].focus();
      return true;
    },
  };
};

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'ДНК-полимеразы эукариот', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 3 «Эукариотическая вилка» · Глава 13', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'ДНК-полимеразы эукариот', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'пятнадцать ферментов, у каждого своя работа', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['count', 'Пятнадцать полимераз', (m) => {
    const p = panel(0), NAMES = ['α', 'δ', 'ε', 'γ', 'β', 'ζ', 'λ', 'μ', 'θ', 'ν', 'η', 'ι', 'κ', 'Rev1', 'TdT'];
    const row = NAMES.map((n, i) => { const g = pico(p, 100 + i * 100, 330, n, .15, { dy: 26, size: 24 }); put(g, { o: 0 }); tw(g, { o: .3 }, .3 + i * .06, .4); return g; });
    const ic = dsIcon(p, 800, 165, 'old', 'old', null, { w: 1300, gap: 28, sw: 9 }); put(ic, { o: 0 }); show(ic, m('genome'));
    line(p, 'геном ≈ 6,4·10⁹ п.н.', 800, 105, m('genome'), COL.chalk, 32, 'middle', 700);
    [0, 1, 2].forEach(i => { tw(row[i], { o: 1 }, m('genome', .6 + i * .3), .4); row[i].pol.light(row[i].pol.palm, m('genome', .6 + i * .3), 1.6); });
    hBracket(p, 390, 1510, 440, 'ремонт · обход повреждений · мтДНК', COL.dim, m('rest'), { up: false, size: 28 });
    line(p, 'кишечная палочка', 100, 560, m('ecoli'), COL.chalk, 28, 'start', 700);
    ['I', 'II', 'III', 'IV', 'V'].forEach((n, i) => {
      const g = pico(p, 400 + i * 140, 620, 'Pol ' + n, .15, { dy: 26, size: 24 }); show(g, m('ecoli', .2 + i * .15));
      if (i === 2) { pulse(g, m('ecoli', 1.6), 1.3); line(p, 'ведёт репликацию', 680, 740, m('ecoli', 1.6), DNA, 26, 'middle', 700); }
    });
    const L = pill(p, 'копирует точно и быстро', OK, 480, 830, m('why'), 28), R = pill(p, 'обходит повреждения', COL.int, 1120, 830, m('why', 1.6), 28);
    const br = G(p, { o: 0 });
    path(br, 'M690 830H780M820 830H910', { stroke: COL.dim, 'stroke-width': 5 });
    mk('path', { d: 'M910 830l-18 -12v24z', fill: COL.dim }, br); mk('path', { d: 'M690 830l18 -12v24z', fill: COL.dim }, br);
    crossX(br, 800, 830, .45);
    show(br, m('why', 3));
  }],

  ['five', 'Пять главных', (m) => {
    const p = panel(0), rows = fiveRows(p, .3, false);
    ['a', 'd', 'e', 'g', 'b'].forEach((k, i) => { show(rows[i].t, m(k)); pulse(rows[i].r, m(k), 1.03); });
    line(p, 'корректура', 1370, 108, m('proof'), COL.chalk, 28, 'middle', 700);
    FIVE.forEach(([, , pr], i) => yesNo(p, pr, 1370, rowY(i) + 46, m('proof', .5 + i * .3), 1.3));
  }],

  ['q1', 'Быстрая проверка', () => {
    const p = panel(0), rows = fiveRows(p, .2, true);
    S.picks = rows.map((r, i) => ({ el: r.r, box: [100, rowY(i), 1400, 88], label: 'Pol ' + FIVE[i][0] }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-nopf', prompt: ['У каких двух из пяти полимераз нет корректуры? Нажмите на обе.'],
    build: pickMulti(S.picks, [0, 4], 'У Pol α и Pol β экзонуклеазного центра нет.',
      i => `У Pol ${FIVE[i][0]} корректура есть: экзонуклеазный центр показан в колонке корректуры.`),
  }], done) }],

  ['work', 'Pol α и праймаза', (m) => {
    const p = panel(0), TYy = 545, NYy = 505;
    path(p, `M240 ${TYy}H1380`, { stroke: COL.chalk, 'stroke-width': 8 });
    endLab(p, '3′', 205, TYy + 11, .3); endLab(p, '5′', 1415, TYy + 11, .3); endLab(p, '5′', 205, NYy + 11, .3);
    const rna = path(p, `M290 ${NYy}H410`, { stroke: RNA, 'stroke-width': 11 }, { d: 0 });
    const dna = path(p, `M410 ${NYy}H650`, { stroke: DNA, 'stroke-width': 9 }, { d: 0 });
    const pr = enzyme(p, 'праймаза', 350, 390, .3, { w: 160, h: 58, size: 24 });
    const pa = pico(p, 460, 385, 'Pol α', .26, { dy: 30 }); show(pa, .3);
    draw(rna, m('prim'), 1.4); tw(pa, { x: 560 }, m('prim', 1.6), 1.8);
    draw(dna, m('prim', 1.6), 1.8); hide(pr, m('prim', 3.4), .5);
    line(p, 'РНК ≈ 10 нт', 350, 595, m('prim', 1), RNA, 24, 'middle', 700);
    line(p, 'ДНК ≈ 20 нт', 530, 595, m('prim', 3), DNA, 24, 'middle', 700);
    hBracket(p, 290, 650, 625, '≈ 30 нт', COL.chalk, m('prim', 3.4), { up: false, size: 26 });
    pill(p, '1 ошибка на 10⁴–10⁵ нт', NO, 1180, 385, m('err'), 28);
    pill(p, 'корректуры нет', NO, 1180, 450, m('err', 1.2), 28);
    const rfc = enzyme(p, 'RFC', 690, 385, m('switch'), { w: 110, h: 56, size: 26 });
    tw(pa, { x: 520, y: 270, o: 0 }, m('switch'), 1);
    const de = pico(p, 1010, 385, 'Pol δ / ε', .26, { dy: 30 }); show(de, m('switch', .5));
    tw(de, { x: 880 }, m('switch', .6), 1);
    pill(p, 'переключение', COL.int, 800, 290, m('switch', .3), 28);
    // what stays: 1,5 % of the genome
    strip(p, 250, 770, 1100, 34, COL.faint, 0); const gen = p.lastChild; show(gen, m('cut')); gen.setAttribute('fill-opacity', .35);
    const gr = strip(p, 250, 770, 16.5, 34, DNA, 0); show(gr, m('cut', .8));
    line(p, 'геном', 250, 752, m('cut'), COL.dim, 24, 'start', 600);
    line(p, '≈ 1,5 % генома — ДНК, которую синтезировала Pol α', 290, 840, m('cut', .8), DNA, 26, 'start', 700);
    tw(rna, { o: .3 }, m('cut'), .8); tw(dna, { o: .3 }, m('cut'), .8);
  }],

  ['split', 'Pol δ и Pol ε', (m) => {
    const p = panel(0), ga = G(p);
    const hand = (x, y, s, lab, kda) => {
      const g = G(ga, { o: 0 }), h = polymerase(g, x, y, null, { s, exo3: true });
      put(h.exo, { o: 0 });
      T(g, lab, { x, y: y - 202 * s - 56, size: 34, weight: 700, anchor: 'middle' });
      T(g, kda, { x, y: y - 202 * s - 18, size: 28, fill: COL.chalk, weight: 600, anchor: 'middle' });
      return { g, h };
    };
    const d = hand(330, 330, .28, 'Pol δ', '≈ 124 кДа'), e = hand(780, 330, .41, 'Pol ε', '≈ 262 кДа');
    show(d.g, .3); show(e.g, m('size'), .6);
    [d, e].forEach((o, i) => { show(o.h.exo, m('exo', .3 + i * .5), .5); pulse(o.h.exo, m("exo", .3 + i * .5), 1.2); });
    line(ga, 'экзонуклеаза — в той же белковой цепи', 555, 520, m('exo', .6), COL.chalk, 26, 'middle', 600);
    const e3 = G(ga, { o: 0 }); polymerase(e3, 1330, 330, null, { s: .28, exo3: false }); show(e3, m('exo', 3.5));
    T(e3, 'Pol III · кишечная палочка', { x: 1330, y: 215, size: 28, fill: COL.dim, weight: 700, anchor: 'middle' });
    const sb = enzyme(e3, 'ε', 1330, 450, null, { w: 80, h: 56, size: 28 }); put(sb, { o: 1 });
    T(e3, 'отдельная субъединица', { x: 1330, y: 505, size: 24, fill: PROT, weight: 600, anchor: 'middle' });
    // dependence
    const rg = betaRing(ga, 330, 650, null, { s: .26 }); put(rg, { o: 0 }); show(rg, m('dep'));
    line(ga, 'PCNA', 330, 745, m('dep'), PROT, 28, 'middle', 700);
    line(ga, 'процессивна только на PCNA', 330, 790, m('dep', .5), COL.chalk, 24, 'middle', 600);
    const cm = enzyme(ga, 'CMG', 780, 650, null, { w: 150, h: 70, size: 28 }); put(cm, { o: 0 }); show(cm, m('dep', 3));
    line(ga, 'ещё и на хеликазе CMG', 780, 745, m('dep', 3), COL.chalk, 24, 'middle', 600);
    // the fork
    tw(ga, { o: 0 }, m('div', -.4), .5);
    const q = G(p, { o: 0 });
    const fk = fork(q, 1000, 430, null, { xEnd: 1480, A: 30, P: 80, n: 4, back: 330, spread: 120, hel: 'CMG', lead: 330, fr: [[860, 640, 12], [620, 400, 12]] });
    show(q, m('div'), .6);
    const yT = fk.rail(-1, 880, 1000) - 17, yB = fk.rail(1, 700, 1000) + 17;
    const pe = pico(q, 900, yT - 62, null, .2); show(pe, m('div', .6)); line(q, 'Pol ε', 900, yT - 135, m('div', .6), COL.chalk, 26, 'middle', 700);
    const pd = pico(q, 700, yB + 62, null, .2); show(pd, m('div', 1.6));
    line(q, 'Pol δ', 700, yB + 150, m('div', 1.6), COL.chalk, 26, 'middle', 700);
    line(q, 'лидирующая цепь', 520, yT - 105, m('div', .6), DNA, 26, 'middle', 700);
    line(q, 'отстающая цепь', 480, yB + 125, m('div', 1.6), DNA, 26, 'middle', 700);
    endLab(q, '3′', 175, fk.rail(-1, 180, 1000) + 11, m('div')); endLab(q, '5′', 175, fk.rail(1, 180, 1000) + 11, m('div'));
    // error signatures
    [[420, 640, -1, -17], [420, 600, 1, 17]].forEach(([a, b, s, off], k) => {
      for (let j = 0; j < 5; j++) { const xx = a + 25 + j * 36 + k * 6, yy = fk.rail(s, xx, 1000) + off; const t = path(q, `M${xx} ${yy - 15}V${yy + 15}`, { stroke: NO, 'stroke-width': 5 }); put(t, { o: 0 }); show(t, m('sig', .3 + k * 1.4 + j * .12), .3); }
    });
    line(q, 'ошибки ε', 540, yT - 40, m('sig', .3), NO, 26, 'middle', 700);
    line(q, 'ошибки δ', 520, yB + 55, m('sig', 1.7), NO, 26, 'middle', 700);
    const ar = arrowTo(q, 740, yB - 25, 810, yT + 30, COL.int, m('debate'), true);
    pill(q, '?', COL.int, 800, (yB + yT) / 2 + 20, m('debate', .3), 34);
    line(q, 'δ участвует и в лидирующем синтезе?', 1140, 780, m('debate', .5), COL.int, 26, 'middle', 700);
  }],

  ['gamma', 'Pol γ', (m) => {
    const p = panel(0), cx = 380, cy = 450, R = 120;
    [R, R - 16].forEach((r, i) => mk('circle', { cx, cy, r, fill: 'none', stroke: i ? COL.chalk : DNA, 'stroke-width': 7 }, p));
    line(p, 'митохондриальная ДНК', cx, 640, .3, COL.chalk, 28, 'middle', 700);
    const pg = pico(p, cx, cy - R - 30, null, .3); show(pg, .3); line(p, 'Pol γ', cx, cy - R - 100, .3, COL.chalk, 32, 'middle', 700);
    const fam = pill(p, 'семейство A', PROT, 1130, 140, m('fam'), 34);
    const a = pico(p, 960, 290, 'Pol I · E. coli', .2, { dy: 26, size: 24 }), b = pico(p, 1300, 290, 'Pol γ', .2, { dy: 26, size: 24 });
    show(a, m('fam', .6)); show(b, m('fam', 1)); line(p, '≈', 1130, 308, m('fam', 1.2), PROT, 48, 'middle', 700);
    const pc = betaRing(p, 1130, 590, null, { s: .27 }); put(pc, { o: 0 }); show(pc, m('nopcna'));
    line(p, 'PCNA', 1130, 700, m('nopcna'), PROT, 28, 'middle', 700);
    const x = crossX(p, 1130, 590, 2.6); put(x, { o: 0 }); show(x, m('nopcna', 1.6));
    line(p, 'в митохондрию не попадает', 1130, 760, m('nopcna', 1.6), NO, 26, 'middle', 700);
    const s1 = enzyme(p, 'Pol γB', cx - 210, cy - R - 30, m('sub'), { w: 130, h: 54, size: 24 });
    const s2 = enzyme(p, 'Pol γB', cx + 210, cy - R - 30, m('sub', .6), { w: 130, h: 54, size: 24 });
    line(p, 'добавочные субъединицы', cx, 165, m('sub', 1.2), PROT, 26, 'middle', 700);
    tw(s1, { x: cx - 135 }, m('grip'), .8); tw(s2, { x: cx + 135 }, m('grip'), .8);
    pill(p, 'держат фермент на ДНК', DNA, cx, 720, m('grip', .8), 26);
  }],

  ['beta', 'Pol β и замена основания', (m) => {
    const p = panel(0), DY = 520, d = duplex(p, 'GATCAGT', 260, DY, .3, { dx: 110, gap: 190, t1: .3 });
    const u = d.top.units[3], bx = d.top.xAt(3), BY = DY + 70;
    // the damaged base sits on the top strand: glycosylase takes it out, the endonuclease cuts the backbone
    const gl = enzyme(p, 'гликозилаза', bx + 380, 250, m('gap'), { w: 190, h: 56, size: 24 });
    tw(gl, { x: bx + 40, y: 330 }, m('gap', .5), .8);
    const hl = put(mk('circle', { cx: bx, cy: BY, r: 34, fill: 'none', stroke: NO, 'stroke-width': 5 }, p), { o: 0 }); show(hl, m('gap', 1.3), .3);
    tw(u.bead, { y: -150, o: 0 }, m('gap', 2), .9); hide(hl, m('gap', 2.2), .3);
    hide(gl, m('gap', 2.4), .5);
    const en = enzyme(p, 'эндонуклеаза', bx + 380, 250, m('gap', 2.6), { w: 200, h: 56, size: 24 });
    tw(en, { x: bx + 70, y: 400 }, m('gap', 3), .7);
    const cut = path(p, `M${bx + 52} ${DY - 22}L${bx + 76} ${DY + 22}`, { stroke: NO, 'stroke-width': 5 }); put(cut, { o: 0 }); show(cut, m('gap', 3.7), .3);
    hide(en, m('gap', 4.4), .5);
    line(p, 'брешь в один нуклеотид', bx, 800, m('gap', 4.2), COL.chalk, 26, 'middle', 700);
    // Pol β puts a nucleotide in, the second domain removes the sugar-phosphate remnant
    const pb = pico(p, bx, 220, 'Pol β', .22, { dy: 26 }); show(pb, m('ins'));
    const nn = bead(p, bx, 330, 'C'); put(nn, { o: 0 }); tw(nn, { o: 1 }, m('ins', .5), .4); tw(nn, { y: BY }, m('ins', .9), .9);
    const rem = G(p, { x: bx + 64, y: DY + 24, o: 0 }); mk('rect', { x: -26, y: -13, width: 52, height: 26, rx: 13, fill: CARD, stroke: COL.dim, 'stroke-width': 3 }, rem);
    T(rem, 'dRP', { y: 8, size: 20, fill: COL.chalk, weight: 700, anchor: 'middle' });
    show(rem, m('drp', -.4)); tw(rem, { y: 600, x: bx + 120, o: 0 }, m('drp', .8), 1);
    line(p, 'второй домен снимает', 1180, 215, m('drp'), PROT, 26, 'middle', 600);
    line(p, 'сахаро-фосфатный остаток', 1180, 250, m('drp', .1), PROT, 26, 'middle', 600);
    pill(p, '1 нт за посадку', DNA, 1180, 380, m('one'), 34);
  }],

/* ---------- the signal scene shared by signal and pass ---------- */
function sigBase(p, { cmg = 930, rpa = false, ub = false }) {
  const { ring } = pcnaStrand(p);
  const ahead = G(p, { x: cmg });
  path(ahead, `M0 ${TY + 44}H700`, { stroke: COL.chalk, 'stroke-width': 8 });
  for (let x = 20; x < 700; x += 22) path(ahead, `M${x} ${TY + 4}V${TY + 40}`, { stroke: COL.dim, 'stroke-width': 2.5 });
  const hel = enzyme(p, 'CMG', cmg, TY + 22, null, { w: 84, h: 110, size: 22 }); put(hel, { o: 1 });
  // the template dimer
  path(p, `M840 ${TY}H880`, { stroke: COL.chalk, 'stroke-width': 14 });
  bead(p, 840, TY, 'T', 15); bead(p, 880, TY, 'T', 15);
  const dl = pico(p, 690, RY, 'Pol δ', .36, { dy: 34 }); put(dl, { o: 1 });
  const rp = [0, 1, 2, 3].map(i => { const r = enzyme(p, 'RPA', 950 + i * 70, TY, null, { w: 66, h: 34, size: 18 }); put(r, { o: rpa ? 1 : 0 }); return r; });
  const u = ubi(p, 500, 425, 20); put(u, { o: ub ? 1 : 0 });
  const k164 = T(p, 'K164', { x: 540, y: 432, size: 26, fill: COL.int, weight: 700, o: ub ? 1 : 0 });
  return { ahead, hel, rpa: rp, dl, ub: u, k164, ring };
}
