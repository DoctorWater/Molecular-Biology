'use strict';
const CHAPTER = { number: 3, title: 'Двойная спираль', minutes: 12, language: 'ru', next: '../ch04/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
// A composition bar: A, T, G, C in percent, w px = 100 %. Segments start hidden: {seg: {A: g…}, xs: {A: [x1, x2]…}}.
function compBar(p, x, y, w, comp, { h = 64 } = {}) {
  const out = { seg: {}, xs: {} };
  let cx = x;
  ['A', 'T', 'G', 'C'].forEach(b => {
    if (!comp[b]) return;
    const ww = w * comp[b] / 100, g = G(p, { o: 0 });
    mk('rect', { x: cx, y, width: ww - 4, height: h, rx: 10, fill: BASE[b] }, g);
    T(g, `${b} ${comp[b]} %`, { x: cx + ww / 2, y: y + h / 2 + 10, size: 28, fill: COL.board, weight: 700, anchor: 'middle' });
    out.seg[b] = g; out.xs[b] = [cx, cx + ww - 4]; cx += ww;
  });
  return out;
}
// A round chip with one letter (major-groove patterns: А, Д, М, H).
function chip(p, ch, x, y, t0, { r = 24, color = COL.chalk } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: CARD, stroke: color, 'stroke-width': 3 }, g);
  T(g, ch, { y: r * .38, size: r * 1.05, fill: color, weight: 700, anchor: 'middle' });
  if (t0 != null) show(g, t0, .3);
  return g;
}
const PENT = [0, 1, 2, 3, 4].map(k => `${(16 * Math.sin(k * 1.2566)).toFixed(1)} ${(-16 * Math.cos(k * 1.2566)).toFixed(1)}`).join('L');
const sugarDot = (p, x, y) => mk('path', { d: `M${PENT}Z`, fill: CARD, stroke: COL.dim, 'stroke-width': 4, transform: `translate(${x},${y})` }, p);

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Двойная спираль', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });

  ['chargaff', 'Правило Чаргаффа', (m) => {

    L([['60 / 40 = 1,5   →   '], ['AT-богатая ДНК', DNA]], 580, m('at'), 30);

    put(box, { o: 0 }); show(box, m('ss'));
    say(p, 'одна цепь: фаг φX174', 1260, 520, m('ss'), { size: 28, weight: 700 });

    row(570, 'ширина рисунка', 'диаметр ≈ 20 Å', m('width', .3));

    colorLine(p, [['A', BASE.A], [' — '], ['T', BASE.T], ['     '], ['G', BASE.G], [' — '], ['C', BASE.C]], 800, 520, m('pair', .4), { size: 40, weight: 700 });
    say(p, 'сколько A — столько напротив T: правило Чаргаффа', 800, 580, m('rule'), { size: 28, fill: DNA, weight: 600 });

    pill(p, 'разделить цепи и достроить каждую — глава 6', DNA, 1080, 784, m('copy', 1), 24);
  }],
  ['bform', 'Параметры B-формы', (m) => {
    const p = panel(0), x0 = 110, y0 = 430, P = 340;
    say(p, 'B-форма — основная форма ДНК в клетке', 800, 90, .2, { size: 30, weight: 600 });
    const h = helixSide(p, x0, y0, 2 * P, .3);

    // top view: one pair after another, each turned 36° further
    const cx = 1200, cy = 440, R = 150;
    const dial = mk('circle', { cx, cy, r: R, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '6 8' }, p);
    put(dial, { o: 0 }); show(dial, m('turn', -.3));
    say(p, 'вид вдоль оси', cx, cy - R - 26, m('turn', -.3), { size: 24, fill: COL.dim, weight: 600 });
    const deg = say(p, '', cx, cy + R + 60, m('turn'), { size: 32, fill: DNA, weight: 700 });
    const hgt = say(p, '', cx, cy + R + 108, m('rise'), { size: 30, weight: 600 });
    const t0 = m('turn', .4), dt = (m('full') - t0) / 10;
    for (let i = 0; i <= 10; i++) {   // the 11th pair lands on the first: a full turn
      const b = RUNG_SEQ[i % 10], g = G(p, { x: cx, y: cy, r: -90 + 36 * i, o: 0 });
      path(g, `M${-R + 20} 0H0`, { stroke: BASE[b], 'stroke-width': 9 });
      mk('circle', { cx: -R + 20, cy: 0, r: 9, fill: COL.chalk }, g);   // strand 1 side: the turn is visible
      path(g, `M0 0H${R - 20}`, { stroke: BASE[COMP[b]], 'stroke-width': 9 });
      show(g, t0 + i * dt, .3);
      if (i < 10) tw(g, { o: .35 }, t0 + (i + 1) * dt, .3);
      prog(() => { deg.textContent = i ? `36° × ${i} = ${36 * i}°` : '0°'; }, t0 + i * dt, 0);
      pulse(h.rungs[i + 1], t0 + i * dt, 1.3);
    }
    prog(() => { hgt.textContent = '3,4 Å × 10 = 34 Å — шаг'; }, m('pitch'), 0);
    // brackets on the side view

    hBracket(p, r1, r2, y0 + 150, '3,4 Å', COL.chalk, m('rise'), { up: false });
    hBracket(p, h.crest(0, 0), h.crest(1, 0), y0 - 130, 'шаг 34 Å · 10 пар', DNA, m('pitch'));
    vBracket(p, x0 + 2 * P + 30, y0 - 100, y0 + 100, '≈ 20 Å', COL.chalk, m('diam'));
    say(p, 'в растворе ≈ 10,5 пары на виток (глава 5)', 800, 820, m('sol', 1.5), { size: 26, fill: COL.dim, weight: 600 });

  ['length', 'Длина ДНК', (m) => {

    mk('rect', { x: 100, y: 230, width: 120, height: 60, rx: 30, fill: CARD, stroke: COL.chalk, 'stroke-width': 3 }, cell);
    show(cell, .2);
    say(p, 'кишечная палочка ≈ 2 мкм', 160, 330, m('cell'), { size: 24, weight: 600 });
    say(p, '4 600 000 пар оснований', 800, 110, m('ecoli'), { size: 32, weight: 700 });
    say(p, '× 3,4 Å ≈ 15 600 000 Å ≈ 1,6 мм', 800, 160, m('mul'), { size: 32, fill: DNA, weight: 700 });

    ys.forEach((y, i) => {
      const xa = i % 2 ? 1500 : 300, xb = i % 2 ? 300 : 1500;

      for (let x = xa, j = 0; i % 2 ? x > xb : x < xb; x += i % 2 ? -40 : 40, j++) d += `L${x + (i % 2 ? -40 : 40)} ${y + (j % 2 ? -10 : 10)}`;

    pill(p, 'ДНК почти в 800 раз длиннее клетки', DNA, 1100, 330, m('ratio'), 30);
    say(p, 'масштаб условный', 1480, 860, m('mul', 1), { size: 22, fill: COL.dim, anchor: 'end' });
    say(p, 'уплотнение — суперспирализация (глава 5)', 800, 470, m('pack'), { size: 28, weight: 600 });

    const p = panel(0), x = 560, R = 46, L = 110, rl = 440, rr = 800;

    const rails = G(p, { o: 0 });
    [rl, rr].forEach(xr => path(rails, `M${xr} 160V790`, { stroke: COL.dim, 'stroke-width': 6 }));

    const at = flatPair(p, 'A', 'T', x, 240, m('at'), { R, L });

    say(p, 'пурин + пиримидин: ширина одна', 900, 330, m('width', .5), { size: 26, fill: OK, weight: 600, anchor: 'start' });
