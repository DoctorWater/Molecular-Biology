<script>
'use strict';
const CHAPTER = { number: 15, title: 'Загрузка зажима и переключение полимераз', minutes: 17, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — pcna3, rfc5, onOff, ringLining, betaRing, clampSide, clampLoader, enzyme, dsIcon, hBracket) ---------- */
const NB = ' ';
const PIPC = COL.whole;
const PA = mix(PROT, COL.nat, .6), PD = PROT, PE = mix(PROT, COL.real, .85);   // Pol α, δ, ε: three pinks, the same in every scene
const line = (p, str, x, y, t0, fill = COL.chalk, size = 28, anchor = 'start', weight = 600) => say(p, str, x, y, t0, { size, fill, anchor, weight });
const crossX = (p, x, y, k = 1, c = NO) => { const g = G(p, { x, y, s: k }); path(g, 'M-26 -26L26 26M26 -26L-26 26', { stroke: c, 'stroke-width': 8 }); return g; };
const strip = (p, x, y, w, h, col, o = 1) => put(mk('rect', { x, y, width: w, height: h, rx: Math.min(10, h / 2), fill: col }, p), { o });
const swap = (e, str, t) => prog(() => { e.textContent = str; }, t, .01, lin);
const pulseS = (e, t, k = 1.25) => { const s0 = e._st.s; tw(e, { s: s0 * k }, t, .22, out); tw(e, { s: s0 }, t + .22, .4); };
const cues = id => TIMINGS[id].cues.map(c => c[0]);
// a polymerase / protein block: rounded body in its own pink, .r (body), .lit(t, on) — highlight
function pol(p, label, x, y, col, { w = 200, h = 80, size = 30 } = {}) {
  const g = G(p, { x, y, o: 0 });
  g.r = mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: Math.min(26, h / 2), fill: mix(COL.board, col, .4), stroke: col, 'stroke-width': 3 }, g);
  T(g, label, { y: size * .36, size, fill: COL.chalk, weight: 700, anchor: 'middle' });
  g.lit = (t, on = true) => tw(g.r, { c_stroke: on ? COL.int : col, c_fill: on ? mix(COL.board, COL.int, .3) : mix(COL.board, col, .4) }, t, .4);
  return g;
}
// a row of n beads (r 9) at x0 + i·dx, appearing one after another from t0
function beads(p, n, x0, y, col, t0, step, { dx = 22, r = 9, i0 = 0 } = {}) {
  return Array.from({ length: n }, (_, i) => {
    const g = G(p, { x: x0 + (i0 + i) * dx, y, o: 0 });
    mk('circle', { r, fill: col }, g);
    show(g, t0 + i * step, .25);
    return g;
  });
}
// primer–template junction: template chalk x0…x1, primer (RNA part rl px, then DNA) from x0 to the 3′-tip xj, ends labelled
function jn(p, x0, xj, x1, y, { rl = 0, tip = true } = {}) {
  const g = G(p), bb = { 'stroke-width': 8 };
  path(g, `M${x0} ${y}H${x1}`, { stroke: COL.chalk, ...bb });
  for (let x = x0 + 10; x < xj; x += 15) path(g, `M${x} ${y - 14}V${y - 4}`, { stroke: COL.dim, 'stroke-width': 2.5 });
  if (rl) path(g, `M${x0} ${y - 18}H${x0 + rl}`, { stroke: RNA, ...bb });
  path(g, `M${x0 + rl} ${y - 18}H${xj}`, { stroke: DNA, ...bb });
  const lab = (s, x, yy, c) => T(g, s, { x, y: yy, size: 26, fill: c, weight: 700, anchor: 'middle' });
  lab('3′', x0 - 30, y + 12, COL.chalk); lab('5′', x1 + 30, y + 12, COL.chalk); lab('5′', x0 - 30, y - 20, DNA);
  if (tip) lab('3′', xj + 4, y - 34, DNA);
  return g;
}
// the clamp seen from the side on a strand: back half on bk, front half on fr (hidden until .show(t))
const ringOn = (bk, fr, x, y, o = {}) => { const c = clampSide(bk, fr, x, y, null, { rx: 20, ry: 46, sw: 12, ...o }); put(c.bk, { o: 0 }); put(c.fr, { o: 0 }); return c; };
// five-step bar: chip k is lit (k = −1: none)
const STEPS = ['АТФ и захват PCNA', 'ДНК входит', 'стык: гидролиз', 'PCNA замыкается', 'RFC уходит'];
const SWSTEPS = ['RFC садится', 'PCNA на стык', 'Pol α уходит', 'Pol δ на PCNA', 'синтез идёт'];
function stepBar(p, k, t0, L = STEPS) {
  const g = G(p, { o: 0 });
  L.forEach((s, i) => {
    const x = 160 + i * 320, on = i === k;
    mk('rect', { x: x - 150, y: 62, width: 300, height: 48, rx: 24, fill: on ? mix(COL.board, COL.int, .3) : CARD, stroke: on ? COL.int : COL.faint, 'stroke-width': on ? 3 : 2 }, g);
    T(g, `${i + 1}  ${s}`, { x, y: 95, size: 24, fill: on ? COL.int : COL.dim, weight: 700, anchor: 'middle' });
  });
  if (t0 != null) show(g, t0);
  return g;
}
// a chip with a caption (order beat)
function chip(p, str, x, y, w, col, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -w / 2, y: -34, width: w, height: 68, rx: 22, fill: CARD, stroke: col, 'stroke-width': 3 }, g);
  T(g, str, { y: 9, size: 25, fill: col === COL.dim ? COL.chalk : col, weight: 700, anchor: 'middle' });
  g.box = g.firstChild;
  show(g, t0);
  return g;
}
const lockAt = (p, x, y, t0) => {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -22, y: -4, width: 44, height: 34, rx: 7, fill: COL.board, stroke: OK, 'stroke-width': 4 }, g);
  path(g, 'M-12 -4V-14A12 12 0 0 1 12 -14V-4', { stroke: OK, 'stroke-width': 4 });
  show(g, t0, .5);
  return g;
};
// four blocks of Pol α/primase: Pri1, Pri2, Pol1, Pol12
const ALPHA = [['Pri1', 330], ['Pri2', 640], ['Pol1', 960], ['Pol12', 1270]];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Загрузка зажима и переключение полимераз', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 3 «Эукариотическая вилка» · Глава 15', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Загрузка зажима', { x: 800, y: 430, size: 70, weight: 600, anchor: 'middle' });
    T(g, 'и переключение полимераз', { x: 800, y: 510, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'Pol α → RFC + PCNA → Pol δ', 800, 610, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['err', 'Первый фермент на цепи', (m) => {
    const p = panel(0), Y = 430, X0 = 300, DX = 22, bk = G(p);
    path(p, `M${X0 - 60} ${Y + 32}H1480`, { stroke: COL.chalk, 'stroke-width': 8 });
    line(p, '3′', X0 - 90, Y + 44, .4, COL.chalk, 26, 'middle', 700); line(p, '5′', 1510, Y + 44, .4, COL.chalk, 26, 'middle', 700);
    line(p, '5′', X0 - 44, Y + 8, .4, DNA, 26, 'middle', 700);
    const pl = pol(p, 'Pol α + праймаза', X0, Y - 100, PA, { w: 320 });
    show(pl, m('pr'));
    tw(pl, { x: X0 + 10 * DX }, m('rna', .2), 3.2, lin); tw(pl, { x: X0 + 30 * DX }, m('dna'), 2.8, lin);
    beads(p, 10, X0, Y, RNA, m('rna', .2), .3);
    beads(p, 20, X0, Y, DNA, m('dna', .1), .13, { i0: 10 });
    line(p, 'РНК', X0 + 110, Y + 70, m('rna', 1.5), RNA, 28, 'middle', 700);
    line(p, 'ДНК', X0 + 10 * DX + 220, Y + 70, m('dna', 1.5), DNA, 28, 'middle', 700);
    const fr = G(p);
    const no = pill(p, 'без корректуры', NO, X0 + 30 * DX, Y - 195, m('no'), 30); pulse(no, m('no', .8), 1.12);
    colorLine(p, [['6,4·10⁹ × 10⁻⁴ ≈ '], [`640${NB}000`, NO]], 800, 690, m('no', 1.9), { size: 52 });
    line(p, 'лишних замен на геном, если бы она копировала всё', 800, 740, m('no', 2.3), COL.dim, 28, 'middle', 600);
    // switch: Pol α leaves, PCNA sits on the junction, δ/ε wait
    tw(pl, { o: .3 }, m('sw'), .6);
    const rg = ringOn(bk, fr, X0 + 30 * DX + 5, Y + 12);
    rg.show(m('sw', 1.4)); line(p, 'PCNA', X0 + 30 * DX + 5, Y + 125, m('sw', 1.6), PROT, 28, 'middle', 700);
    const d = pol(p, 'Pol δ', 1260, Y - 100, PD, { w: 140 }), e = pol(p, 'Pol ε', 1450, Y - 100, PE, { w: 140 });
    show(d, m('sw', 2.4)); show(e, m('sw', 2.8));
    line(p, 'или', 1355, Y - 90, m('sw', 2.8), COL.dim, 26, 'middle', 600);
    hide(no, m('sw', -.2), .4);
  }],

  ['alpha', 'Pol α: четыре субъединицы', (m) => {
    const p = panel(0), Y = 390, B = ALPHA.map(([n, x]) => pol(p, n, x, Y, PA, { w: 270, h: 110, size: 40 }));
    B.forEach((b, i) => show(b, .5 + i * .25));
    hBracket(p, 165, 800, Y + 85, 'праймаза', RNA, 2.2, { up: false });
    hBracket(p, 825, 1435, Y + 85, 'полимераза α', DNA, 3, { up: false });
    const caps = [['строит РНК', RNA, 'pri1'], ['держит 5′-конец РНК', RNA, 'pri2'], ['удлиняет ДНК', DNA, 'pol1'], ['структурная', COL.chalk, 'pol12']];
    caps.forEach(([s, c, k], i) => {
      line(p, s, ALPHA[i][1], 620, m(k), c, 30, 'middle', 700);
      B[i].lit(m(k)); if (i < 3) B[i].lit(m(caps[i + 1][2], -.1), false); else B[i].lit(m('pol12', 4.6), false);
      pulse(B[i], m(k), 1.06);
    });
    // Pol12 ties Pol1 to the rest
    const br = path(p, `M1270 ${Y - 62}V${Y - 98}H640V${Y - 62}`, { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, { o: 0 });
    show(br, m('pol12', .3), .5);
    line(p, 'связывает Pol1 с остальным комплексом', 955, Y - 112, m('pol12', .4), COL.dim, 26, 'middle', 600);
    line(p, 'имена дрожжевые', 800, 790, cues('alpha')[5], COL.dim, 28, 'middle', 600);
  }],

  ['primer', 'Праймер: РНК и ДНК', (m) => {
    const p = panel(0), Y = 450, X0 = 330, DX = 24, Pn = (n) => X0 + n * DX;
    path(p, `M${X0 - 70} ${Y + 32}H1500`, { stroke: COL.chalk, 'stroke-width': 8 });
    line(p, '3′', X0 - 100, Y + 44, .4, COL.chalk, 26, 'middle', 700); line(p, '5′', 1530, Y + 44, .4, COL.chalk, 26, 'middle', 700);
    const pr = pol(p, 'Pri1', Pn(0), Y - 110, PA, { w: 130 }); show(pr, m('denovo'));
    tw(pr, { x: Pn(10) }, m('denovo', 3.7), 5.2, lin);
    const t1 = line(p, 'де ново: готовый конец не нужен', 800, 270, m('denovo', .2), COL.chalk, 32, 'middle', 700);
    const rb = beads(p, 10, X0, Y, RNA, m('denovo', 3.7), .52, { dx: DX });
    const n1 = line(p, '7–12 нт, обычно ≈ 10', Pn(5), Y + 80, m('denovo', 5), RNA, 28, 'middle', 700);
    // hand-over to Pol1
    hide(pr, m('hand'), .4); hide(t1, m('hand'), .4);
    const p1 = pol(p, 'Pol1', Pn(10), Y - 110, PA, { w: 130 }); show(p1, m('hand', .2));
    tw(p1, { x: Pn(30) }, m('hand', .6), 5.2, lin);
    const t2 = line(p, 'Pol1 достраивает ДНК', 1050, 270, m('hand', .4), COL.chalk, 32, 'middle', 700);
    beads(p, 20, X0, Y, DNA, m('hand', .6), .26, { dx: DX, i0: 10 });
    line(p, '≈ 20 нт', Pn(20), Y + 80, m('hand', 4), DNA, 28, 'middle', 700);
    hide(t2, m('hyb'), .4);
    hBracket(p, Pn(0) - 12, Pn(30) - 12, Y - 28, 'гибрид РНК + ДНК: ≈ 30–35 нт', COL.chalk, m('hyb'), { up: true, size: 30 });
    // Pol1 steps off
    tw(p1, { x: Pn(30) + 190, y: Y - 190, o: .3 }, m('stop'), 1.2);
    line(p, 'низкая процессивность: слабо держится', 1240, 340, m('stop', .6), COL.dim, 26, 'middle', 600);
    line(p, 'за ДНК и скоро сходит', 1240, 374, m('stop', .8), COL.dim, 26, 'middle', 600);
    // no proofreading
    const pk = G(p, { x: 400, y: 660, o: 0 });
    mk('circle', { r: 30, fill: 'none', stroke: PROT, 'stroke-width': 4, 'stroke-dasharray': '9 7' }, pk);
    show(pk, m('nofix'), .5);
    const cx = crossX(p, 400, 660, .9); put(cx, { o: 0 }); show(cx, m('nofix', .8));
    line(p, 'нет экзонуклеазы — нет корректуры', 460, 672, m('nofix', .3), NO, 30, 'start', 700);
    colorLine(p, [['10⁻⁴–10⁻⁵ у α', DNA], ['   ·   на 2–3 порядка меньше у δ и ε', COL.chalk]], 800, 780, m('nofix', 3.6), { size: 32 });
  }],

  ['q1', 'Быстрая проверка', () => {
    const p = panel(0), B = ALPHA.map(([n, x]) => pol(p, n, x, 330, PA, { w: 270, h: 110, size: 40 }));
    B.forEach((b, i) => show(b, .3 + i * .1));
    S.picks = B.map((b, i) => ({ el: b, box: [ALPHA[i][1] - 135, 275, 270, 110], label: ALPHA[i][0] }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-pri1', prompt: ['Какая субъединица комплекса строит РНК? Нажмите на неё.'],
    build: pickEls(S.picks, 0, 'Pri1 — каталитическая субъединица праймазы: она строит РНК-часть праймера.',
      i => ['', 'Pri2 держит 5′-конец праймера, но не строит.', 'Pol1 удлиняет ДНК, а РНК не строит.', 'Pol12 структурная: она связывает Pol1 с комплексом.'][i]),
  }], done) }],

  ['count', 'Сколько ошибок остаётся', (m) => {
    const p = panel(0), G1 = G(p), G2 = G(p), X0 = 350, Y = 240;
    pill(G1, 'фрагмент Оказаки ≈ 150 нт', DNA, 800, 130, .4, 30);
    const rest = strip(G1, X0, Y - 18, 900, 36, mix(COL.board, COL.whole, .5), 0); show(rest, 1.2);
    line(G1, '150 нт', X0 + 900 + 20, Y + 9, 1.4, COL.dim, 26, 'start', 600);
    const rna = strip(G1, X0, Y - 18, 60, 36, RNA, 0), dna = strip(G1, X0 + 60, Y - 18, 120, 36, DNA, 0);
    show(rna, m('share', -1.6)); show(dna, m('share', -1.4));
    hBracket(G1, X0, X0 + 180, Y - 30, 'праймер: 30 нт', DNA, m('share', -1.2), { up: true });
    colorLine(G1, [['30 / 150 = '], ['20%', DNA]], 800, 400, m('share'), { size: 64 });
    line(G1, 'фрагмента сделано без корректуры', 800, 450, m('share', .6), COL.dim, 30, 'middle', 600);
    hide(G1, m('genome', -.2), .5);
    colorLine(G2, [['6,4·10⁹ / 150 ≈ '], [`4,3·10⁷`, DNA], [' фрагментов']], 800, 200, m('genome'), { size: 50 });
    colorLine(G2, [['20 · 10⁻⁴ = '], ['0,002', DNA], [' ошибки на фрагмент']], 800, 290, m('genome', 3), { size: 46 });
    colorLine(G2, [['4,3·10⁷ × 0,002 ≈ '], [`86${NB}000`, NO]], 800, 450, m('tot'), { size: 58 });
    line(G2, `при 10⁻⁵ ≈ 8${NB}600`, 800, 515, m('tot', 4.6), COL.dim, 36, 'middle', 600);
    colorLine(G2, [['6,4·10⁹ × (10⁻¹⁰…10⁻⁹) ≈ '], ['0,6…6', OK]], 800, 650, m('real'), { size: 48 });
    line(G2, 'настоящие новые замены у человека на геном', 800, 700, m('real', .5), COL.dim, 28, 'middle', 600);
    line(G2, 'срезается с флэпом (глава 16) · корректура Pol δ и MMR', 800, 800, m('gone'), COL.chalk, 32, 'middle', 700);
  }],

  ['where', 'Где садится зажим', (m) => {
    const p = panel(0), A = G(p), c2 = cues('where')[2];
    const pc = pcna3(A, 400, 290, null, { s: .55 }); put(pc, { o: 0 }); pc.shade(null); show(pc, 1.6, .6);
    lockAt(A, 400, 290 - 183 * .55, 2.4);
    line(A, 'замкнутое кольцо:', 400, 470, 2.4, OK, 30, 'middle', 700); line(A, 'само на ДНК не садится', 400, 510, 2.6, COL.dim, 28, 'middle', 600);
    const rf = rfc5(A, 1170, 300, null, { s: .85, pose: 'helix' }); put(rf, { o: 0 }); show(rf, c2 - .2, .6); rf.nm.forEach((n, i) => show(n, c2 + .3 + i * .15, .3));
    line(A, 'RFC — загрузчик из пяти разных субъединиц', 1170, 470, c2, COL.chalk, 28, 'middle', 700);
    const d = pol(A, 'Pol δ', 400, 650, PD, { w: 170 }), e = pol(A, 'Pol ε', 1170, 650, PE, { w: 170 });
    show(d, m('pol')); show(e, m('pol', 3.4));
    line(A, 'держится на PCNA', 400, 725, m('pol', .4), COL.chalk, 28, 'middle', 700);
    line(A, 'на PCNA и на хеликазе CMG (глава 17)', 1170, 725, m('pol', 3.8), COL.chalk, 28, 'middle', 700);
    hide(A, m('junc', -.3), .5);
    const J = jn(p, 300, 800, 1400, 430, { rl: 70 }); put(J, { o: 0 }); show(J, m('junc'), .6);
    const ring = G(p, { x: 800, y: 420, o: 0 }); mk('ellipse', { rx: 52, ry: 62, fill: 'none', stroke: COL.int, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, ring);
    show(ring, m('junc', .6), .5); pulse(ring, m('junc', .6), 1.1);
    pill(p, 'стык праймер — матрица', COL.int, 800, 300, m('junc', .3), 32);
    hBracket(p, 300, 800, 475, 'двойная спираль', DNA, m('junc', 4.1), { up: false });
    hBracket(p, 800, 1400, 475, 'одиночная матрица', COL.chalk, m('junc', 6.2), { up: false });
    line(p, 'спираль кончается 3′-концом праймера', 800, 700, m('junc', 4.6), COL.chalk, 30, 'middle', 700);
  }],

  ['collar', 'Воротник и вход', (m) => {
    const p = panel(0), CX = 560, CY = 430, K = 1.2, gy = CY + 6 * K + 8;
    // DNA behind the loader: a plain duplex (wall) and the junction (ss)
    const wall = G(p, { o: 0 }), ss = G(p, { o: 0 });
    path(wall, `M${CX - 7} 830V376`, { stroke: COL.chalk, 'stroke-width': 7 }); path(wall, `M${CX + 7} 830V376`, { stroke: COL.chalk, 'stroke-width': 7 });
    path(ss, `M${CX + 7} 830V250Q${CX + 7} 180 ${CX + 200} 165`, { stroke: COL.chalk, 'stroke-width': 7 });
    path(ss, `M${CX - 7} 830V${CY - 48 * K + 4}`, { stroke: DNA, 'stroke-width': 7 });
    const r = rfc5(p, CX, CY, .3, { s: K, pose: 'helix' });
    r.nm.forEach((n, i) => show(n, .6 + i * .1, .3));
    line(p, 'правая спираль и канал внутри', 1000, 250, .8, COL.chalk, 30, 'start', 700);
    show(r.gate, m('gate', 4.4), .5); r.gateOpen(true, m('gate', 4.4), .8); pulse(r.gate, m('gate', 4.7), 1.04);
    line(p, 'A-gate — вход сбоку, в слое AAA+', 1000, 330, m('gate', 4.4), COL.int, 30, 'start', 700);
    arrowTo(p, 90, gy, 270, gy, COL.chalk, m('gate', 4.8)); line(p, 'ДНК входит сбоку', 180, gy - 24, m('gate', 4.8), COL.chalk, 26, 'middle', 700);
    show(r.col, m('col'), .5); show(r.ap, m('col'), .5); pulse(r.ap, m('col'), 1.03);
    line(p, 'воротник: A′-домен RFC1,', 1000, 430, m('col'), OK, 30, 'start', 700); line(p, 'пристёгнутый к RFC5', 1000, 470, m('col', .3), OK, 30, 'start', 700);
    show(wall, m('wall'), .5);
