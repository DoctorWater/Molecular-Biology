<script>
'use strict';
const CHAPTER = { number: 2, title: 'Из чего собрана нуклеиновая кислота', minutes: 11, language: 'ru', next: '../ch03/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
const BOND = { stroke: COL.chalk, 'stroke-width': 4 };
function phosC(p, x, y, { o = 1, fill = CARD } = {}) {
  const g = G(p, { x, y, o });
  g.c = mk('circle', { r: 26, fill, stroke: COL.dim, 'stroke-width': 3 }, g);
  T(g, 'P', { y: 10, size: 28, weight: 700, anchor: 'middle' });
  return g;
}
// Furanose ring, skeletal: ring O on top, carbons 1′–4′ clockwise from the right, 5′ outside, up-left of 4′.
const SC = { O: [0, -62], 1: [70, -18], 2: [44, 60], 3: [-44, 60], 4: [-70, -18], 5: [-112, -80] };
const NUM = { 1: [86, 20, 'start'], 2: [58, 94, 'start'], 3: [-58, 94, 'end'], 4: [-86, 20, 'end'], 5: [-112, -98, 'middle'] };
const sc = k => SC[k].join(' ');
// A sugar: 2′ carries OH (ribose) or H (deoxy; both made, .oh2/.h2 swap them), 3′ an OH (.oh3, o3: false leaves the bond
// for a linking O). free: OH at 1′ and 5′ too (.oh1, .oh5). nums: carbon numbers (.num[k]); .dot[k] carbon dots.
function sugar(p, x, y, t0, { s = 1, deoxy = false, nums = true, free = false, o3 = true } = {}) {
  const g = G(p, { x, y, s, o: t0 == null ? 1 : 0 });
  path(g, `M${sc('O')}L${sc(1)}L${sc(2)}L${sc(3)}L${sc(4)}ZM${sc(4)}L${sc(5)}M${sc(3)}V108M${sc(2)}V108`, BOND);
  atom(g, 'O', ...SC.O);
  const lab = (str, x, y, o = 1, anchor = 'middle') => T(g, str, { x, y, size: 28, weight: 700, anchor, o });
  if (o3) g.oh3 = lab('OH', -44, 140);
  g.oh2 = lab('OH', 44, 140, deoxy ? 0 : 1);
  g.h2 = lab('H', 44, 140, deoxy ? 1 : 0);
  if (free) {
    path(g, `M${sc(1)}H122M${sc(5)}H-150`, BOND);
    g.oh1 = lab('OH', 128, -8, 1, 'start');
    g.oh5 = lab('OH', -156, -70, 1, 'end');
  }
  g.dot = {}; g.num = {};
  [1, 2, 3, 4, 5].forEach(k => {
    g.dot[k] = mk('circle', { cx: SC[k][0], cy: SC[k][1], r: 7, fill: COL.chalk }, g);
    if (nums) { const [nx, ny, a] = NUM[k]; g.num[k] = T(g, k + '′', { x: nx, y: ny, size: 28, fill: COL.dim, weight: 700, anchor: a }); }
  });
  if (t0 != null) show(g, t0);
  return g;
}
// A nucleoside/nucleotide around its sugar: base b on 1′ (.base, .gly — the N-glycosidic bond), 5′-OH (.oh5) or up to three
// phosphates (.ph[k] — α, β, γ; groups beyond nph start hidden), Greek labels .gr[k] (hidden).
function nucleo(p, x, y, t0, { b = 'A', s = 1, deoxy = false, nph = 0, nums = false } = {}) {
  const g = G(p, { x, y, s, o: t0 == null ? 1 : 0 });
  g.sug = sugar(g, 0, 0, null, { deoxy, nums });
  g.gly = path(g, `M${sc(1)}H128`, BOND);
  const [ax, ay] = anchorOf(b);
  g.base = baseRings(g, b, 128 - ax, -18 - ay, null);
  path(g, `M${sc(5)}H-150`, BOND);
  g.oh5 = T(g, 'OH', { x: -156, y: -70, size: 28, weight: 700, anchor: 'end', o: nph ? 0 : 1 });
  g.ph = []; g.gr = [];
  for (let k = 0; k < 3; k++) {
    const px = -200 - 100 * k, q = G(g, { o: k < nph ? 1 : 0 });
    path(q, `M${k ? px + 100 : -112} -80H${px}`, BOND);
    atom(q, 'O', px + 50, -80);
    q.p = phosC(q, px, -80);
    g.ph.push(q);
    g.gr.push(T(g, 'αβγ'[k], { x: px, y: -122, size: 32, weight: 700, anchor: 'middle', o: 0 }));
  }
  if (t0 != null) show(g, t0);
  return g;
}
// Two linked sugars of a chain, drawn vertically 5′ (top) → 3′: top sugar A (.a), 3′-O (.o3), phosphate (.p), the bonds
// O3–P (.l3) and P–O5 (.l5); the lower nucleotide with its 5′-O is one group (.lower, sugar .b). Bases bs[0], bs[1].
function pair2(p, x, y, { s = 1, deoxy = false, bs = 'GC', R = 30 } = {}) {
  const g = G(p, { x, y, s });
  const dash = { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '6 9' };
  path(g, `M${sc(5)}V-150`, dash);
  const base = (q, b, y0) => { path(q, `M70 ${y0 - 18}H118`, BOND); const [ax, ay] = anchorOf(b, R); baseRings(q, b, 118 - ax, y0 - 18 - ay, null, { R }); };
  g.a = sugar(g, 0, 0, null, { deoxy, nums: false, o3: false });
  base(g, bs[0], 0);
  g.l3 = path(g, 'M-44 128L-90 205', BOND);
  g.l5 = path(g, 'M-90 205L-112 268', BOND);
  g.o3 = atom(g, 'O', -44, 128);
  g.lower = G(g);
  path(g.lower, 'M-112 268V300', BOND);
  g.b = sugar(g.lower, 0, 380, null, { deoxy, nums: false, o3: false });
  base(g.lower, bs[1], 380);
  path(g.lower, 'M-44 508V560', dash);
  atom(g.lower, 'O', -44, 508);
  g.o5 = atom(g.lower, 'O', -112, 268);
  g.p = phosC(g, -90, 205);
  return g;
}
const arrowHead = (p, x, y, ang, color) => mk('path', { d: 'M0 0L-22 -11L-22 11Z', fill: color, transform: `translate(${x},${y}) rotate(${ang * 180 / Math.PI})` }, p);
// A curved arrow (quadratic, control point cx, cy) drawn on at t0.
function curveArrow(p, x1, y1, cx, cy, x2, y2, color, t0, dur = .7) {
  const g = G(p);
  draw(path(g, `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`, { stroke: color, 'stroke-width': 4.5 }, { d: 0 }), t0, dur);
  const h = G(g, { o: 0 });
  arrowHead(h, x2, y2, Math.atan2(y2 - cy, x2 - cx), color);
  show(h, t0 + dur - .15, .2);
  return g;
}
const strike = (p, x1, y1, x2, y2, t0) => draw(path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: NO, 'stroke-width': 5 }, { d: 0 }), t0, .35);
const swap = (a, b, t0, dur = .5) => { hide(a, t0, dur); show(b, t0, dur); };
const ring = (p, x, y, r, color, t0) => { const e = mk('circle', { cx: x, cy: y, r, fill: 'none', stroke: color, 'stroke-width': 4 }, p); put(e, { o: 0 }); show(e, t0); return e; };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Из чего собрана нуклеиновая кислота', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 1 «Открытие и строение ДНК» · Глава 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Из чего собрана нуклеиновая кислота', { x: 800, y: 440, size: 74, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'основание, сахар, фосфат — и цепь', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['alkali', 'Опыт со щёлочью', (m) => {
    const p = panel(0), xs = [520, 1080], kinds = [['РНК', RNA, 'rna'], ['ДНК', DNA, 'dna']];
    say(p, 'две пробирки', 800, 110, .2, { size: 30, fill: COL.dim, weight: 600 });
    kinds.forEach(([lab, c, mark], k) => {
      const x = xs[k], t0 = m(mark), t = tube(p, x, 190, t0, { w: 140, h: 380 });
      say(p, lab, x, 630, t0, { size: 40, fill: c, weight: 700 });
      t.fill(70, 380, COL.chalk, m('koh', .3 + k * .2), .16);
      const ch = G(p, { o: 0 }), beads = [];
      const pts = [...Array(8)].map((_, i) => [x + (i % 2 ? 22 : -22), 270 + i * 36]);
      const links = pts.slice(1).map(([bx, by], i) => path(ch, `M${pts[i][0]} ${pts[i][1]}L${bx} ${by}`, { stroke: c, 'stroke-width': 5 }));
      pts.forEach(([bx, by]) => beads.push(mk('circle', { cx: bx, cy: by, r: 13, fill: c }, ch)));
      show(ch, t0 + .3);
      if (k === 0) {   // RNA falls apart into single nucleotides
        links.forEach((l, i) => hide(l, m('night', i * .08), .3));
        const spot = [[-40, 300], [30, 330], [-10, 380], [44, 420], [-46, 450], [12, 470], [-20, 520], [40, 510]];
        beads.forEach((b, i) => tw(b, { x: spot[i][0] - (pts[i][0] - x), y: spot[i][1] - pts[i][1] }, m('night', .3 + i * .06), .9));
        say(p, 'отдельные нуклеотиды', x, 690, m('night', 1), { size: 28, fill: RNA, weight: 600 });
      } else {
        yesNo(p, true, x - 80, 682, m('intact'));
        say(p, 'цепи целы', x - 50, 690, m('intact'), { size: 28, fill: DNA, weight: 600, anchor: 'start' });
      }
    });
    say(p, 'разбавленная щёлочь: 0,3 М KOH, 37 °C, ночь', 800, 160, m('koh'), { size: 28, weight: 600 });
    pill(p, 'разница — один атом кислорода в сахаре каждого звена', DNA, 800, 800, m('atom', .4), 32);
  }],
  ['steps', 'Четыре ступени', (m) => {
    const p = panel(0), x0 = 90;
    const rows = [['основание', 'аденин', 'base'], ['нуклеозид', 'основание + сахар', 'sugar'], ['нуклеотид', 'нуклеозид + фосфат', 'phos'], ['полинуклеотид', 'цепь нуклеотидов', 'chain']];
    rows.forEach(([name, sub, mark], i) => {
      const y = 230 + i * 150, g = G(p, { o: 0 });
      mk('circle', { cx: x0 + 22, cy: y - 12, r: 22, fill: DNA }, g);
      T(g, String(i + 1), { x: x0 + 22, y: -2 + y, size: 26, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, name, { x: x0 + 62, y, size: 36, weight: 700 });
      T(g, sub, { x: x0 + 62, y: y + 40, size: 24, fill: COL.dim });
      show(g, m(mark));
    });
    const n = nucleo(p, 960, 420, .2, { b: 'A', s: 1.15 });
    put(n.sug, { o: 0, x: -260 }); put(n.gly, { o: 0 }); put(n.oh5, { o: 0 });
    tw(n.sug, { o: 1, x: 0 }, m('sugar'), .8, out); show(n.gly, m('sugar', .6)); show(n.oh5, m('sugar', .6));
    const a = put(G(n.ph[0]), { o: 0 });
    hide(n.oh5, m('phos')); tw(n.ph[0], { o: 1 }, m('phos', .2), .6);
    const cap = [['аденин', BASE.A, 'base'], ['аденозин', COL.chalk, 'sugar'], ['аденозинмонофосфат, АМФ', COL.chalk, 'phos']];
    const caps = cap.map(([s, c, mark]) => say(p, s, 960, 700, m(mark, .4), { size: 40, fill: c, weight: 700 }));
    hide(caps[0], m('sugar', .2), .3); hide(caps[1], m('phos', .2), .3);
    // stage 4: the molecule gives way to a chain of nucleotides
    hide(n, m('chain'), .4); hide(caps[2], m('chain'), .4);
    strand(p, 'ATGCCTAG', 660, 470, m('chain', .4), { dx: 100, step: .12 });
    say(p, 'цепь ДНК или РНК', 1010, 620, m('chain', 1.6), { size: 34, weight: 600 });
  }],
  ['q1', 'Быстрая проверка', () => {
    const p = panel(0);
    S.m1 = nucleo(p, 300, 300, .2, { b: 'A', s: .72 });
    S.m2 = baseRings(p, 'G', 820, 290, .3, { R: 48 });
    S.m3 = nucleo(p, 1300, 300, .4, { b: 'C', s: .72, nph: 1 });
  }, { ask: done => quiz({ x: 200, y: 560, w: 1200, cls: 'side', maxH: 320 }, [
    { id: 'c-stage1', prompt: ['Щёлкните нуклеозид.'],
      build: pickEls([{ el: S.m1, box: [170, 180, 340, 240], label: 'основание и сахар' }, { el: S.m2, box: [680, 220, 210, 140], label: 'одно основание' }, { el: S.m3, box: [1110, 180, 340, 240], label: 'основание, сахар и фосфат' }], 0,
        'Нуклеозид — основание + сахар, без фосфата.',
        i => i === 1 ? 'Это одно основание (гуанин): сахара нет.' : 'Здесь есть фосфат у 5′-углерода — это уже нуклеотид.') },
    { id: 'c-stage2', prompt: ['А теперь щёлкните нуклеотид.'],
      build: pickEls([{ el: S.m1, box: [170, 180, 340, 240], label: 'основание и сахар' }, { el: S.m2, box: [680, 220, 210, 140], label: 'одно основание' }, { el: S.m3, box: [1110, 180, 340, 240], label: 'основание, сахар и фосфат' }], 2,
        'Нуклеотид — нуклеозид + фосфат: здесь фосфат у 5′-углерода.',
        i => i === 1 ? 'Это одно основание: нет ни сахара, ни фосфата.' : 'Здесь основание и сахар, а фосфата нет — это нуклеозид.') },
  ], done) }],
  ['bases', 'Пурины и пиримидины', (m) => {
    const p = panel(0), y = 340, R = 54;
    say(p, 'пять оснований, две группы', 800, 90, .2, { size: 30, fill: COL.dim, weight: 600 });
    const B = {};
    say(p, 'пурины · 2 кольца', 470, 190, m('pur'), { size: 32, weight: 700 });
    [['A', 400], ['G', 680]].forEach(([b, x], i) => {
      B[b] = baseRings(p, b, x, y, m('pur', i * .4), { R });
      say(p, BNAME[b], x - 40, y + 100, m('pur', i * .4), { size: 28, fill: BASE[b], weight: 700 });
    });
    ['A', 'G'].forEach(b => { tw(B[b].ring6, { 'a_stroke-width': 9 }, m('six'), .3); tw(B[b].ring6, { 'a_stroke-width': 4 }, m('six', .6), .4); });
    ['A', 'G'].forEach(b => { tw(B[b].ring5, { c_fill: mix(COL.board, BASE[b], .55) }, m('five'), .5); });
    say(p, 'пиримидины · 1 кольцо', 1200, 190, m('pyr'), { size: 32, weight: 700 });
    [['C', 1000], ['T', 1200], ['U', 1400]].forEach(([b, x], i) => {
      B[b] = baseRings(p, b, x, y, m('pyr', .3 + i * .35), { R });
      say(p, BNAME[b], x, y + 100, m('pyr', .3 + i * .35), { size: 28, fill: BASE[b], weight: 700 });
    });
    // which bases go into DNA and RNA
    const row = (lab, c, yy, t0) => say(p, lab, 560, yy + 12, t0, { size: 34, fill: c, weight: 700, anchor: 'end' });
    row('ДНК', DNA, 590, m('both')); row('РНК', RNA, 690, m('both'));
    const chipB = (b, x, yy, t0) => { const g = G(p, { x, y: yy, o: 0 }); mk('circle', { r: 30, fill: BASE[b] }, g); T(g, b, { y: 11, size: 32, fill: COL.board, weight: 700, anchor: 'middle' }); show(g, t0); return g; };
    ['A', 'G', 'C'].forEach((b, i) => { chipB(b, 640 + i * 90, 590, m('both', .3 + i * .2)); chipB(b, 640 + i * 90, 690, m('both', .3 + i * .2)); });
    chipB('T', 910, 590, m('t'));
    chipB('U', 910, 690, m('u'));
    tw(B.T.me, { s: 1.4 }, m('methyl'), .3); tw(B.T.me, { s: 1 }, m('methyl', .4), .4);
    colorLine(p, [['T', BASE.T], [' = '], ['U', BASE.U], [' + метильная группа CH₃']], 1240, 600, m('methyl', .3), { size: 30 });
    say(p, 'исключение: в транспортных РНК бывает и T', 1240, 700, m('trna'), { size: 26, fill: COL.dim });
    pill(p, 'глава 3: в двойной спирали пурин — напротив пиримидина', DNA, 800, 820, m('pair'), 28);
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-rings', prompt: ['Пурин или пиримидин?'],
    build: grid(Q_RINGS, [['pu', 'Пурин · 2 кольца'], ['py', 'Пиримидин · 1 кольцо']], { multi: false, text: true }),
  }], done) }],
  ['tautomer', 'Таутомеры и ошибки', (m) => {
    const p = panel(0), R = 70, gx = 380, cy = 400, px = 790, ys = [cy - 50, cy, cy + 50];
    say(p, 'таутомеры: атом H перескакивает на другое место', 800, 90, .2, { size: 30, fill: COL.dim, weight: 600 });
    baseRings(p, 'G', gx, cy, .3, { R });
    const gr = G(p);
    // the face of G: ring atoms O, N, N (x 470), hydrogens of donors at x 505
    ['O', 'N', 'N'].forEach((a, i) => { path(gr, `M${gx + 60} ${Math.max(cy - 35, Math.min(cy + 35, ys[i]))}L${gx + 76} ${ys[i]}`, { stroke: BASE.G, 'stroke-width': 4 }); atom(gr, a, gx + 90, ys[i], { size: 26 }); });
    const hTop = atom(gr, 'H', gx + 124, ys[1], { size: 26 });   // the H that hops: on N1 (keto), then on O6 (enol)
    atom(gr, 'H', gx + 124, ys[2], { size: 26 });
    const formK = say(p, 'гуанин · кето-аминная форма', gx - 40, 540, .5, { size: 28, fill: BASE.G, weight: 700 });
    const formE = say(p, 'гуанин · енольная форма', gx - 40, 540, 99, { size: 28, fill: BASE.G, weight: 700 });
    // partner: C (H on top, N, O) or T (O, H on N, O)
    const partner = (b, face, t0) => {
      const g = G(p, { o: 0 });
      baseRings(g, b, px, cy, null, { R });
      face.forEach((a, i) => {
        path(g, `M${px - 60} ${Math.max(cy - 35, Math.min(cy + 35, ys[i]))}L${px - 76} ${ys[i]}`, { stroke: BASE[b], 'stroke-width': 4 });
        if (a === 'H') { atom(g, 'N', px - 90, ys[i], { size: 26 }); atom(g, 'H', px - 124, ys[i], { size: 26 }); }
        else atom(g, a, px - 90, ys[i], { size: 26 });
      });
      say(g, BNAME[b], px, 540, null, { size: 28, fill: BASE[b], weight: 700 });
      if (t0 != null) show(g, t0);
      return g;
    };
    const hb = (col, y1, x1, x2) => path(p, `M${x1} ${y1}H${x2}`, { stroke: col, 'stroke-width': 3.5, 'stroke-dasharray': '8 7' }, { o: 0 });
    // keto G – C: O···H–N, N–H···N, N–H···O
    const c = partner('C', ['H', 'N', 'O'], m('keto'));
    const kb = [hb(COL.chalk, ys[0], gx + 108, px - 140), hb(COL.chalk, ys[1], gx + 140, px - 108), hb(COL.chalk, ys[2], gx + 140, px - 108)];
    kb.forEach((l, i) => show(l, m('keto', .6 + i * .15), .3));
    // the hop
    kb.forEach(l => hide(l, m('hop'), .3));
    tw(hTop, { y: ys[0] }, m('hop', .3), .8, back);
    swap(formK, formE, m('hop', .6));
    // with C the faces clash: H against H, N against N
    const sx = G(p);
    [ys[0], ys[1]].forEach(y => { const x = (gx + 124 + px - 124) / 2; strike(sx, x - 16, y - 16, x + 16, y + 16, m('clash', .4)); strike(sx, x + 16, y - 16, x - 16, y + 16, m('clash', .5)); });
    hide(sx, m('thy'), .3);
    tw(c, { o: 0, y: 140 }, m('thy', -.2), .6);
    const t = partner('T', ['O', 'H', 'O'], null);
    put(t, { y: -140 }); tw(t, { o: 1, y: 0 }, m('thy', .2), .7, out);
    [hb(COL.chalk, ys[0], gx + 140, px - 108), hb(COL.chalk, ys[1], gx + 108, px - 140), hb(COL.chalk, ys[2], gx + 140, px - 108)].forEach((l, i) => show(l, m('thy', .9 + i * .15), .3));
    say(p, 'неправильная пара G · T', (gx + px) / 2, 650, m('thy', 1.3), { size: 28, fill: NO, weight: 700 });
    // two rounds of copying: G–C → G·T → A–T
    const X = 1300, pr = (parts, y, t0) => colorLine(p, parts, X, y, t0, { size: 44, weight: 700 });
    say(p, 'копирование ДНК', X, 190, m('copy', -.3), { size: 28, fill: COL.dim, weight: 600 });

  ['stable', 'Почему в ДНК дезоксирибоза', (m) => {

    const p = panel(0), base = 820, k = 20;   // 20 px per ångström

      for (let i = 0; i < 11; i++) {
        const yy = base - i * rise * k, e = G(p, { o: 0 });
        path(e, `M${x - w / 2} ${yy}H${x + w / 2}`, { stroke: c, 'stroke-width': 6 });
        mk('circle', { cx: x - w / 2, cy: yy, r: 7, fill: COL.dim }, e); mk('circle', { cx: x + w / 2, cy: yy, r: 7, fill: COL.dim }, e);
        show(e, t0 + i * .08, .3);
      }
    };
    say(p, 'по 11 пар; высота в масштабе', 800, 60, .2, { size: 24, fill: COL.dim });

    draw(path(p, `M150 ${base}V${base - 200}`, { stroke: COL.chalk, 'stroke-width': 4 }, { d: 0 }), .3, .4);

    say(p, '≈ 11 пар на виток', ax, base - 10 * 2.6 * k - 22, m('a'), { size: 24, fill: RNA });
    const br = (x, rise, c, t0, str) => {
      const y1 = base, y2 = base - rise * k;
      draw(path(p, `M${x} ${y1}H${x + 14}V${y2}H${x}`, { stroke: c, 'stroke-width': 3 }, { d: 0 }), t0, .4);

    br(ax + 170, 2.6, RNA, m('b', 1.5), '≈ 2,6 Å');
    say(p, 'ДНК: B-форма', bx, base - 10 * 3.4 * k - 40, m('b'), { size: 32, fill: DNA, weight: 700 });
