<script>
'use strict';
const CHAPTER = { number: 8, title: 'ДНК-полимеразы кишечной палочки', minutes: 12, language: 'ru', next: '../ch09/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js; the polymerase hand is `polymerase`) ---------- */
const NB = ' ';
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
const seg1 = (p, x1, y1, x2, y2, c = COL.dim, w = 4) => path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: c, 'stroke-width': w });
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });
const cross = (p, x, y, t0, k = 1, c = NO) => {
  const g = G(p, { x, y, o: 0, s: k });
  path(g, 'M-26 -26L26 26M26 -26L-26 26', { stroke: c, 'stroke-width': 8 });
  if (t0 != null) show(g, t0, .3);
  return g;
};
function scissors(p, x, y, t0, c = PROT) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M-18 -10L30 14M-18 10L30 -14', { stroke: c, 'stroke-width': 5 });
  [-1, 1].forEach(s => mk('circle', { cx: -28, cy: 15 * s, r: 10, fill: 'none', stroke: c, 'stroke-width': 4 }, g));
  if (t0 != null) show(g, t0);
  return g;
}
function pDot(p, x, y, c = COL.dim, lab = 'P', r = 22) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: CARD, stroke: c, 'stroke-width': 4 }, g);
  if (lab) T(g, lab, { y: r * .4, size: r * 1.1, fill: c, weight: 700, anchor: 'middle' });
  return g;
}
// A nucleotide bead (base letter in its colour) with a backbone link of length `link` to the left, drawn in the class colour col.
function nuc(p, x, y, b, col = DNA, link = 0, r = 20) {
  const g = G(p, { x, y });
  g.link = link ? path(g, `M${-link + r} 0H${-r}`, { stroke: col, 'stroke-width': 6 }) : null;
  mk('circle', { r, fill: BASE[b] }, g);
  T(g, b, { y: r * .4, size: r * 1.05, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const ring = (p, x, y, r = 30, c = NO) => put(mk('circle', { cx: x, cy: y, r, fill: 'none', stroke: c, 'stroke-width': 5 }, p), { o: 0 });
// A big number that counts up (text element; the caller sets textContent) with a unit label.
function counterAt(p, x, y, t0, unit, { size = 110, fill = DNA } = {}) {
  const e = T(p, '0', { x, y, size, fill, weight: 700, anchor: 'end', o: 0 });
  show(e, t0);
  say(p, unit, x + 24, y, t0, { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
  return e;
}
const ytag = (p, year, names, y, t0) => {
  say(p, year, 90, y, t0, { size: 58, fill: DNA, weight: 700, anchor: 'start' });
  say(p, names, 90 + uiW(year, 58) * 1.12 + 30, y - 6, t0 + .3, { size: 30, fill: COL.dim, weight: 600, anchor: 'start' });
};

// The hand scenes: polymerase at (HX, HY), the DNA drawn over it with column pitch PL; column c sits at HX − 36 + PL·c
// (c = 0 is the 3′ end of the new strand, c = 1 the template base at the active site).
const HX = 600, HY = 470, PL = 56;
const hcx = (c, X = HX) => X - 36 + PL * c;
// DNA in the channel: new strand newSeq (5′→3′, ends at c = 0), its template tmpl (same length), template bases ahead.
function handDna(p, newSeq, tmpl, ahead, X = HX, Y = HY) {
  const n = newSeq.length;
  const top = [...newSeq].map((b, i) => nuc(p, hcx(i - n + 1, X), Y - 24, b, DNA, i ? PL : 0));
  const bot = [...tmpl].map((b, i) => nuc(p, hcx(i - n + 1, X), Y + 24, b, COL.chalk, i ? PL : 0));
  const ah = [...ahead].map((b, i) => nuc(p, hcx(i + 1, X), Y + 24, b, COL.chalk, PL));
  const xl = hcx(1 - n, X) - 46;
  endLab(p, '5′', xl, Y - 14, 0, DNA); endLab(p, '3′', xl, Y + 34, 0, COL.chalk);
  endLab(p, '5′', hcx(ahead.length, X) + 48, Y + 34, 0, COL.chalk);
  return { top, bot, ah };
}
// An incoming dNTP above the active site: bead b at (x, y) with a triphosphate chain going up; starts 150 px higher, hidden.
function dntp(p, x, y, b, link = PL) {
  const g = G(p, { x, y: y - 150, o: 0 });
  g.ph = G(g);
  seg1(g.ph, 0, -22, 0, -144, COL.int, 4);
  [-56, -100, -144].forEach((yy, i) => pDot(g.ph, 0, yy, i ? COL.int : COL.dim, 'P', 18));
  g.lk = put(path(g, `M${-link + 20} 0H-20`, { stroke: DNA, 'stroke-width': 6 }), { o: 0 });
  nuc(g, 0, 0, b, DNA, 0);
  g.drop = (t, dur = 1.1) => { show(g, t, .3); tw(g, { y }, t, dur); };
  return g;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'ДНК-полимеразы кишечной палочки', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 8', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'ДНК-полимеразы кишечной палочки', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'кто строит новые цепи', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['quest', 'Кто копирует хромосому', (m) => {
    const p = panel(0);
    ytag(p, '1956', 'Артур Корнберг', 140, .4);
    const pol = enzyme(p, 'Pol I', 1000, 300, null, { w: 300, h: 110, size: 46 });
    put(pol, { o: 0 }); show(pol, m('name'));
    say(p, 'строит ДНК по матрице', 1000, 400, m('name', .8), { size: 28, fill: COL.dim, weight: 600 });
    pill(p, 'считали: копирует хромосому', DNA, 1000, 480, m('all'), 30);
    ytag(p, '1969', 'Паула Де Лючия и Джон Кэрнс', 640, m('cairns'));
    say(p, 'мутант без полимеразной активности Pol I', 90, 700, m('cairns', 2.2), { size: 28, fill: COL.chalk, weight: 600, anchor: 'start' });
    cross(p, 1000, 300, m('lives', -.6), 2.2);
    pill(p, 'клетка жива, делится, копирует ДНК', OK, 1050, 640, m('lives'), 30);
    const q = say(p, 'кто же?', 1000, 790, m('who'), { size: 64, fill: DNA, weight: 700 });
    pulse(q, m('who'), 1.2);
  }],
  ['five', 'Пять полимераз', (m) => {
    const p = panel(0), cx = j => 530 + 220 * j, X0 = 90, X1 = 1520;
    const names = [['Pol I', 'A'], ['Pol II', 'B'], ['Pol III', 'C'], ['Pol IV', 'Y'], ['Pol V', 'Y']];
    names.forEach(([n, f], j) => {
      say(p, n, cx(j), 130, .3 + j * .15, { size: 34, fill: PROT, weight: 700 });
      say(p, `семейство ${f}`, cx(j), 162, .5 + j * .15, { size: 20, fill: COL.dim, weight: 600 });
    });
    const sep = (y, t) => { const l = path(p, `M${X0} ${y}H${X1}`, { stroke: COL.faint, 'stroke-width': 2 }, { o: 0 }); show(l, t); };
    const row = (y, lab, cells, t) => {
      sep(y - 50, t);
      [].concat(lab).forEach((s, i, a) => say(p, s, X0, y + (i - (a.length - 1) / 2) * 30 + 8, t, { size: 24, fill: COL.chalk, weight: 600, anchor: 'start' }));
      cells.forEach((c, j) => {
        const t2 = t + .25 + j * .12;
        if (c === true || c === false) yesNo(p, c, cx(j), y, t2, .8);
        else if (c && c.ok !== undefined) { yesNo(p, c.ok, cx(j), y - 14, t2, .8); say(p, c.note, cx(j), y + 36, t2, { size: 20, fill: COL.dim, weight: 600 }); }
        else [].concat(c).forEach((s, i, a) => say(p, s, cx(j), y + (i - (a.length - 1) / 2) * 28 + 8, t2, { size: 24, fill: j === 2 ? DNA : COL.chalk, weight: j === 2 ? 700 : 500 }));
      });
    };
    row(255, ['молекул', 'на клетку'], ['≈ 400', '≈ 50', '≈ 10–20', '≈ 300', ['≈ 15', '(после SOS)']], m('num'));
    row(365, ['экзонуклеаза 3′→5′', '(корректура)'], [true, true, { ok: true, note: 'субъединица ε' }, false, false], m('exo3'));
    row(470, ['экзонуклеаза', '5′→3′'], [true, false, false, false, false], m('exo5'));
    row(580, ['процессивность'], [['≈ 20 нт'], ['≈ 100 нт'], ['≈ 10 нт сама', '> 50 000 с β'], ['единицы нт', '≈ 300 с β'], ['единицы–десятки', 'нт']], m('proc'));
    row(695, ['работа'], [['праймеры,', 'бреши, репарация'], 'репарация', ['копирует', 'хромосому'], ['обход', 'повреждений'], ['обход', 'повреждений (SOS)']], m('work'));
  }],
  ['exo', 'Две экзонуклеазы', (m) => {
    const p = panel(0), xs = i => 300 + 70 * i, y1 = 290, y2 = 640;
    // top: the error at the 3′ end is erased
    const R1 = G(p, { o: 0 }), R2 = G(p, { o: 0 });
    show(R1, .3);
    const seq1 = 'GATCGAG', top = [...seq1].map((b, i) => nuc(R1, xs(i), y1, b, DNA, i ? 70 : 0, 26));
    const bad = ring(p, xs(6), y1, 36);
    endLab(R1, '5′', xs(0) - 56, y1 + 10, 0, DNA); const e3 = endLab(R1, '3′', xs(6) + 54, y1 + 10, 0, DNA);
    say(p, 'экзонуклеаза 3′→5′: стирает свою ошибку', 90, 160, m('e3'), { size: 32, fill: COL.chalk, weight: 700, anchor: 'start' });
    show(bad, m('e3', 1.2));
    arrowTo(p, xs(6) + 30, y1 - 70, xs(6) - 170, y1 - 70, COL.int, m('e3', 2));
    say(p, '3′→5′', xs(6) - 70, y1 - 90, m('e3', 2), { size: 28, fill: COL.int, weight: 700 });
    tw(top[6], { y: y1 - 70, o: 0 }, m('e3', 5.2), .8); hide(bad, m('e3', 5.2), .3); tw(e3, { x: xs(5) + 54 }, m('e3', 5.6), .5);
    yesNo(p, true, 1000, y1, m('e3', 6), 1.4);
    // bottom: the primer ahead is eaten
    const seq2 = 'GATCGAUCTGC';
    show(R2, m('e5', -.3));
    const bot = [...seq2].map((b, i) => nuc(R2, xs(i), y2, b, i > 4 && i < 8 ? RNA : DNA, i ? 70 : 0, 26));
    endLab(R2, '5′', xs(0) - 56, y2 + 10, 0, DNA); endLab(R2, '3′', xs(4) + 8, y2 + 66, 0, DNA);
    say(p, 'экзонуклеаза 5′→3′: съедает цепь впереди', 90, 510, m('e5'), { size: 32, fill: COL.chalk, weight: 700, anchor: 'start' });
    arrowTo(p, xs(5) - 30, y2 - 70, xs(8) + 20, y2 - 70, COL.int, m('e5', 1.5));
    say(p, '5′→3′', xs(6.5), y2 - 90, m('e5', 1.5), { size: 28, fill: COL.int, weight: 700 });
    say(p, 'праймер', xs(6), y2 + 66, m('e5', 1.2), { size: 24, fill: RNA, weight: 700 });
    [5, 6, 7].forEach((i, k) => tw(bot[i], { y: y2 - 60, o: 0 }, m('e5', 3 + k * .9), .6));
    yesNo(p, true, 1180, y2, m('e5', 6.5), 1.4);
  }],
  ['q1', 'Быстрая проверка', () => {
    const p = panel(0), xs = i => 380 + 70 * i, y = 480;
    const seq = 'GATCGAUCTGC';
    [...seq].forEach((b, i) => nuc(p, xs(i), y, b, i > 4 && i < 8 ? RNA : DNA, i ? 70 : 0, 26));
    ring(p, xs(4), y, 36); put(p.lastChild, { o: 1 });
    say(p, 'праймер', xs(6), y + 66, .3, { size: 24, fill: RNA, weight: 700 });
    say(p, 'ошибка', xs(4), y + 66, .3, { size: 24, fill: NO, weight: 700 });
    const a1 = G(p), a2 = G(p);
    arrowTo(a1, xs(4) + 14, y - 70, xs(4) - 170, y - 70, COL.int, .3);
    say(a1, '3′→5′', xs(4) - 78, y - 94, .3, { size: 28, fill: COL.int, weight: 700 });
    arrowTo(a2, xs(5) + 30, y - 70, xs(7) + 70, y - 70, COL.int, .3);
    say(a2, '5′→3′', xs(6) + 50, y - 94, .3, { size: 28, fill: COL.int, weight: 700 });
    S.picks = [{ el: a1, box: [xs(4) - 200, y - 130, 240, 100], label: 'стрелка 3′→5′' }, { el: a2, box: [xs(5) + 10, y - 130, 250, 100], label: 'стрелка 5′→3′' }];
  }, { ask: done => quiz(BAND, [{
    id: 'c-exo', prompt: ['Какая стрелка убирает праймер впереди полимеразы? Нажмите на неё.'],
    build: pickEls(S.picks, 1, 'Экзонуклеаза 5′→3′ съедает цепь впереди полимеразы, так убирают РНК-праймер.',
      () => 'Экзонуклеаза 3′→5′ работает на конце, который полимераза только что нарастила, и стирает ошибку, а не праймер впереди.'),
  }], done) }],
  ['gap', 'Pol I в бреши', (m) => {
    const p = panel(0), Y = 520, xg = i => 330 + 56 * i, X = xg(5) - 20;
    const pol = polymerase(p, X, Y, .3, { exo5: true, exo3: true, label: 'Pol I' });
    const L = G(p, { o: 0 });
    const top = 'GATCG' + 'AUC' + 'TGCAT', tm = 'CTAGC' + 'TAG' + 'ACGTA';
    const t = [...top].map((b, i) => nuc(L, xg(i), Y - 24, b, i > 4 && i < 8 ? RNA : DNA, i ? 56 : 0));
    [...tm].forEach((b, i) => nuc(L, xg(i), Y + 24, b, COL.chalk, i ? 56 : 0));
    show(L, .4);
    say(p, '3′-OH', X - 5, Y - 84, m('sit'), { size: 24, fill: COL.int, weight: 700 });
    pol.light(pol.palm, m('sit', .6), 1.4);
    const lab1 = say(p, 'экзонуклеаза 5′→3′ съедает праймер', 1290, 260, m('eat'), { size: 26, fill: RNA, weight: 700 });
    pol.light(pol.nuc5, m('eat'), 4.2);
    [5, 6, 7].forEach((i, k) => tw(t[i], { y: Y - 90, o: 0 }, m('eat', 1.2 + k * 1.1), .6));
    say(p, 'и тут же полимераза достраивает ДНК', 1290, 660, m('fill'), { size: 26, fill: DNA, weight: 700 });
    'ATC'.split('').forEach((b, k) => {
      const n = nuc(L, xg(5 + k), Y - 24, b, DNA, 56); put(n, { o: 0, y: Y - 60 });
      tw(n, { o: 1, y: Y - 24 }, m('fill', .8 + k * 1.1), .5);
      tw(pol, { x: X + 56 * (k + 1) }, m('fill', 1.2 + k * 1.1), .5);
    });
  }],
  ['klenow', 'Фрагмент Кленова', (m) => {
    const p = panel(0), X = 520, Y = 560, k = .9, pol = polymerase(p, X, Y, .3, { s: k, exo5: true, exo3: true, label: 'Pol I · 103 кДа' });
    const cutY = Y - 208 * k, cutL = path(p, `M${X + 36 * k} ${cutY}H${X + 270 * k}`, { stroke: NO, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, { o: 0 });
    show(cutL, m('cut', -1.6));
    const sc = scissors(p, X + 300 * k, cutY, m('cut', -1.6));
    tw(sc, { x: X + 40 * k }, m('cut', -1.4), 1.3);
    hide(sc, m('cut', .2), .4); hide(cutL, m('cut', .2), .4);
    tw(pol.nuc5, { x: 190, y: -70 }, m('cut', .2), 1.2);
    hBracket(p, X - 300 * k, X + 300 * k, Y + 215 * k, 'большой фрагмент (Кленова)', PROT, m('big'), { up: false, size: 28 });
    [['строит цепь', true], ['исправляет ошибки', true], ['съедает цепь впереди', false]].forEach(([s, ok], i) => {
      const t = m('big', 7.2 + i * 1.1);
      yesNo(p, ok, 1030, 500 + i * 60, t, .8);
      say(p, s, 1070, 510 + i * 60, t, { size: 28, fill: ok ? COL.chalk : NO, weight: 600, anchor: 'start' });
    });
    say(p, 'малый фрагмент', 1150, 190, m('small'), { size: 30, fill: PROT, weight: 700 });
    say(p, 'одна экзонуклеаза 5′→3′', 1150, 230, m('small', .4), { size: 26, fill: COL.dim, weight: 600 });
    pill(p, 'им достраивали ДНК, не боясь разрушить соседей', DNA, 800, 856, m('lab'), 26);
  }],
  ['many', 'Сколько посадок', (m) => {
    const p = panel(0), x0 = 200, W = 1200, y = 330;
    say(p, 'хромосома: 4 600 000 пар нуклеотидов'.replace(/ (?=\d{3})/g, NB), 800, 220, .3, { size: 30, weight: 600 });
    mk('rect', { x: x0, y: y - 18, width: W, height: 36, rx: 8, fill: COL.chalk, 'fill-opacity': .85 }, p);
    put(p.lastChild, { o: 0 }); show(p.lastChild, .3);
    pill(p, 'Pol I: ≈ 400 молекул на клетку', PROT, 800, 140, m('many'), 30);
    say(p, 'за одну посадку ≈ 20 нт', x0 + 12, y - 62, m('slow'), { size: 26, fill: DNA, weight: 700, anchor: 'start' });
    for (let i = 0; i < 46; i++) {
      const r = mk('rect', { x: x0 + i * 26 + 1, y: y - 18, width: 24, height: 36, rx: 4, fill: DNA }, p);
      put(r, { o: 0 }); show(r, m('slow', .5 + i * .07), .15);
    }
    colorLine(p, [[`4${NB}600${NB}000 / 20 = `], [`230${NB}000`, DNA]], 800, 500, m('calc'), { size: 40 });
    const c = counterAt(p, 1000, 660, m('calc', 1.5), 'посадок', { size: 100 });
    prog(q => { c.textContent = fmt(Math.round(230000 * q)); }, m('calc', 1.5), 4, lin);
  }],
  ['mutants', 'Два мутанта', (m) => {
    const p = panel(0), xa = 640, W = 760, y1 = 330, y2 = 560;
    const lane = (y, name, note, t) => {
      say(p, name, 100, y - 10, t, { size: 34, weight: 700, anchor: 'start' });
      say(p, note, 100, y + 26, t + .3, { size: 22, fill: COL.dim, weight: 600, anchor: 'start' });
      mk('rect', { x: xa, y: y - 14, width: W, height: 28, rx: 14, fill: CARD, stroke: COL.dim, 'stroke-width': 2 }, p);
      const f = mk('rect', { x: xa, y: y - 14, width: 0, height: 28, rx: 14, fill: DNA }, p);
      return f;
    };
    const f1 = lane(y1, 'polA1', 'нет полимеразной активности Pol I', m('a')), f2 = lane(y2, 'ts-dnaE', 'ts-мутация α-субъединицы Pol III', m('ts'));
    [f1, f2].forEach((f, i) => put(f.previousSibling, { o: 0 }));
    show(f1.previousSibling, m('a')); show(f2.previousSibling, m('ts'));
    const grow = (f, a, b, t, d) => prog(q => f.setAttribute('width', Math.max(0, W * (a + (b - a) * q))), t, d, lin);
    // the temperature
    say(p, 'температура', 800, 140, m('ts', 8), { size: 24, fill: COL.dim, weight: 600 });
    const tt = T(p, '30 °C', { x: 800, y: 205, size: 64, weight: 700, anchor: 'middle', fill: COL.whole, o: 0 });
    show(tt, m('ts', 8));
    prog(q => { tt.textContent = `${Math.round(30 + 12 * q)} °C`; tt.setAttribute('fill', mix(COL.whole, NO, q)); }, m('heat'), 1.6, lin);
    grow(f1, 0, .45, m('ts', 9), 3.5); grow(f2, 0, .45, m('ts', 9), 3.5);
    grow(f2, .45, .58, m('heat'), 1.6);
    grow(f1, .45, 1, m('a2'), 4.5);
    cross(p, xa + W * .58, y2, m('b2'), 1.1);
    say(p, 'при 42 °C репликация встала', xa + W * .58, y2 + 74, m('b2'), { size: 26, fill: NO, weight: 700 });
    say(p, 'идёт при любой температуре', xa + W - 10, y1 + 56, m('a2', 3), { size: 26, fill: OK, weight: 700, anchor: 'end' });
  }],
