<script>
'use strict';
const CHAPTER = { number: 7, title: 'Репликативная вилка', minutes: 13, language: 'ru' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
const rad = a => a * Math.PI / 180;
// A point on a circle: angles in degrees, clockwise from the top.
const ringPt = (cx, cy, r, a) => [cx + r * Math.sin(rad(a)), cy - r * Math.cos(rad(a))];
// Polyline along a ring from angle a0 to a1; the radius may depend on the angle (rf).
function arcD(cx, cy, a0, a1, rf) {
  const k = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 3));
  let d = '';
  for (let i = 0; i <= k; i++) {
    const a = a0 + (a1 - a0) * i / k, [x, y] = ringPt(cx, cy, rf(a), a);
    d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d;
}
// Piecewise-linear value of t over [[t, v], …].
function pw(t, pts) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0] || 1);
  return pts[pts.length - 1][1];
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const strike = (p, x1, x2, y, t0) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: NO, 'stroke-width': 5 }, { d: 0 }), t0, .4);
const NB = ' ';
const RC = [520, 490], RR = 200;   // centre and radius of the ring scenes
// A subscripted label: ori + sub.
function oriText(p, sub, x, y, t0, { fill = COL.int, size = 28, anchor = 'middle' } = {}) {
  const e = T(p, 'ori', { x, y, size, fill, weight: 700, anchor, o: 0 });
  const s = mk('tspan', { 'font-size': size * .72, dy: size * .22 }, e);
  s.textContent = sub;
  show(e, t0);
  return e;
}
// A big number that counts up with a unit label.
function counterAt(p, x, y, t0, unit, { size = 110, fill = DNA } = {}) {
  const e = T(p, '0', { x, y, size, fill, weight: 700, anchor: 'end', o: 0 });
  show(e, t0);
  say(p, unit, x + 24, y, t0, { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
  return e;
}
// A circular chromosome with a replication bubble. phi (degrees, from the origin at the top) is how far each fork has gone;
// two: both ways (θ) or one (the eye of a single fork). .set(phi) redraws. Parental strands chalk, new strands amber,
// forks yellow dots.
function bubble(p, cx, cy, R, t0, { two = true, sep = 22, gap = 5 } = {}) {
  const g = G(p, { o: t0 == null ? 1 : 0 }), L = G(g), F = G(g);
  const seg = (a0, a1, rf, c) => path(L, arcD(cx, cy, a0, a1, rf), { stroke: c, 'stroke-width': 7, 'stroke-linejoin': 'round' });
  g.set = phi => {
    L.replaceChildren(); F.replaceChildren();
    const ramp = Math.max(1, Math.min(22, phi / 2)), env = a => clamp01(Math.min(a / ramp, (phi - a) / ramp));
    const u1 = two ? 360 - phi : 360;
    if (u1 - phi > 1) [-gap, gap].forEach(s => seg(phi, u1, () => R + s, COL.chalk));
    if (phi >= 1) [1, -1].slice(0, two ? 2 : 1).forEach(sd => {
      const rf = k => a => R + k * sep * env(Math.abs(a));
      seg(0, sd * phi, a => rf(1)(a) + gap, COL.chalk); seg(0, sd * phi, a => rf(1)(a) - gap, DNA);
      seg(0, sd * phi, a => rf(-1)(a) + gap, DNA); seg(0, sd * phi, a => rf(-1)(a) - gap, COL.chalk);
      const [x, y] = ringPt(cx, cy, R, sd * phi);
      mk('circle', { cx: x, cy: y, r: 11, fill: COL.int, stroke: COL.board, 'stroke-width': 3 }, F);
    });
  };
  g.set(0);
  if (t0 != null) show(g, t0);
  return g;
}
// The origin mark above a ring.
function oriMark(p, cx, cy, R, t0, str) {
  const [x, y] = ringPt(cx, cy, R, 0);
  const d = G(p, { o: 0 });
  mk('circle', { cx: x, cy: y, r: 9, fill: COL.int }, d);
  T(d, str, { x, y: y - 36, size: 28, fill: COL.int, weight: 700, anchor: 'middle' });
  show(d, t0);
  return d;
}
function dblRing(p, x, y, r, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: r + 5, fill: 'none', stroke: COL.chalk, 'stroke-width': 6 }, g);
  mk('circle', { r: r - 5, fill: 'none', stroke: DNA, 'stroke-width': 6 }, g);
  show(g, t0);
  return g;
}
function scissors(p, x, y, t0, c = PROT) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M-18 -10L30 14M-18 10L30 -14', { stroke: c, 'stroke-width': 5 });
  [-1, 1].forEach(s => mk('circle', { cx: -28, cy: 15 * s, r: 10, fill: 'none', stroke: c, 'stroke-width': 4 }, g));
  if (t0 != null) show(g, t0);
  return g;
}
// A text label that stays at one place and is replaced by the next (captions of a step list).
function caption(p, str, x, y, t0, t1, opt = {}) {
  const e = say(p, str, x, y, t0, { size: 30, weight: 600, ...opt });
  if (t1 != null) hide(e, t1, .4);
  return e;
}
// Nucleotide pieces for the energy and proofreading scenes.
const PENT = [0, 1, 2, 3, 4].map(k => `${(30 * Math.sin(k * 1.2566)).toFixed(1)} ${(-30 * Math.cos(k * 1.2566)).toFixed(1)}`).join('L');
function sugarAt(p, x, y, c = COL.dim) {
  const g = G(p, { x, y });
  mk('path', { d: `M${PENT}Z`, fill: CARD, stroke: c, 'stroke-width': 4 }, g);
  return g;
}
function pDot(p, x, y, c = COL.dim, lab = 'P', r = 22) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: CARD, stroke: c, 'stroke-width': 4 }, g);
  if (lab) T(g, lab, { y: r * .4, size: r * 1.1, fill: c, weight: 700, anchor: 'middle' });
  return g;
}
function beadAt(p, x, y, b, r = 28) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: BASE[b] }, g);
  T(g, b, { y: r * .4, size: r * 1.05, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const seg1 = (p, x1, y1, x2, y2, c = COL.dim, w = 4) => path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: c, 'stroke-width': w });
// A short phrase with subscripted chain ends on the stage: 5′ / 3′ labels.
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });

// The fork scene shared by several beats: parental strands to x = 110, the helix ahead to 1500 (hel: none).
const FK = { xEnd: 1500, A: 40, P: 100, n: 6, back: 330, spread: 130, hel: null, tail: 110 };
const FR_R = [330, 520, 710, 900];          // 5′ ends of the Okazaki fragments (the primers sit there)
const PRIM = 36;                            // primer length on the stage, px
// Lagging fragments 0..k complete (k ≥ 0), as the state of fork.
const fragsTo = k => FR_R.slice(0, k + 1).map((r, j) => [r, j ? FR_R[j - 1] : 150, PRIM]);
const fragRail = (fk, x, fx) => fk.rail(1, x, fx) + 17;

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Репликативная вилка', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 7', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Репликативная вилка', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'как строятся новые цепи', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['slow', 'Одна вилка: 76 минут', (m) => {
    const p = panel(0), [cx, cy] = RC, b = bubble(p, cx, cy, RR, .3, { two: false });
    oriMark(p, cx, cy, RR, .5, 'ориджин');
    say(p, 'кольцо: 4600000 пар нуклеотидов'.replace('4600000', `4${NB}600${NB}000`), 1260, 250, .6, { size: 28 });
    say(p, 'полимераза: около 1000 нт/с', 1260, 320, m('pol'), { size: 28, fill: PROT, weight: 600 });
    colorLine(p, [[`4${NB}600${NB}000 / 1000 = `], ['4600 с', DNA]], 1260, 410, m('calc'), { size: 34 });
    const num = counterAt(p, 1170, 560, m('calc'), 'минут');
    const t0 = m('calc', 2.2);
    prog(q => { b.set(360 * q); num.textContent = Math.floor(76.7 * q); }, t0, 8, lin);
    strike(p, 920, 1370, 540, m('real'));
    pill(p, 'на деле около 40 минут', OK, 1260, 680, m('real'), 32);
  }],
  ['fast', 'Две вилки: 38 минут', (m) => {
    const p = panel(0), [cx, cy] = RC, b = bubble(p, cx, cy, RR, .3);
    oriMark(p, cx, cy, RR, .5, 'ориджин');
    pill(p, 'двунаправленная репликация', DNA, 1260, 240, m('bi'), 30);
    say(p, 'на вилку:', 1260, 320, m('half'), { size: 26, fill: COL.dim, weight: 600 });
    colorLine(p, [[`4${NB}600${NB}000 / 2 = `], [`2${NB}300${NB}000 пар`, DNA]], 1260, 364, m('half', .4), { size: 32 });
    colorLine(p, [[`2${NB}300${NB}000 / 1000 = `], ['2300 с', DNA]], 1260, 430, m('calc'), { size: 32 });
    const num = counterAt(p, 1170, 600, m('ori', 2), 'минут');
    const t0 = m('ori', 2);
    prog(q => { b.set(180 * q); num.textContent = Math.floor(38.4 * q); }, t0, m('meet', 1.8) - t0, lin);
    const [x, y] = ringPt(cx, cy, RR, 180);
    const ter = G(p, { o: 0 });
    mk('circle', { cx: x, cy: y + 4, r: 9, fill: COL.bad }, ter);
    T(ter, 'ter', { x, y: y + 50, size: 28, fill: COL.bad, weight: 700, anchor: 'middle' });
    show(ter, m('meet'));
    pill(p, 'вилки встретились', OK, 1260, 700, m('meet', 1.5), 30);
  }],
  ['fork', 'Что такое вилка', (m) => {
    const p = panel(0);
    const fk = fork(p, 700, 450, .3, { ...FK, lead: 690, fr: [[880, 880, 0]] });
    const lab = (s, x, y, t, fill = COL.chalk, anchor = 'middle') => say(p, s, x, y, t, { size: 28, fill, weight: 600, anchor });
    lab('двойная спираль ещё цела', 1230, 360, m('y'));
    arrowTo(p, 1230, 372, 1230, 405, COL.dim, m('y', .5));
    lab('ручка Y', 1230, 560, m('y', .8), COL.dim);
    lab('родительские цепи', 400, 450, m('arms'));
    lab('разошлись: рожки', 400, 486, m('arms', .3), COL.dim);
    fk.go({ x: 900, fr: [[880, 690, 0]] }, m('new'), 2.4);
    lab('новая цепь', 640, fk.rail(-1, 640, 900) - 17 - 34, m('new', 1.2), DNA);
    lab('новая цепь', 640, fk.rail(1, 640, 900) + 17 + 48, m('new', 1.6), DNA);
    arrowTo(p, 1160, 640, 935, 480, COL.int, m('name'));
    pill(p, 'репликативная вилка', COL.int, 1250, 660, m('name'), 32);
  }],
  ['theta', 'θ-структура', (m) => {
    const p = panel(0), [cx, cy] = RC, b = bubble(p, cx, cy, RR, .3);
    oriMark(p, cx, cy, RR, m('bubble'), 'oriC');
    pill(p, 'θ-структура', DNA, 1260, 230, m('theta'), 34);
    say(p, 'хромосома E. coli · плазмиды', 1260, 300, m('theta', 1.5), { size: 26, fill: COL.dim, weight: 600 });
    prog(q => b.set(180 * q), m('bubble', 1.5), 9, lin);
    say(p, 'между вилками растёт пузырь:', 1260, 390, m('bubble', 2.5), { size: 26 });
    say(p, 'два дочерних дуплекса', 1260, 426, m('bubble', 3), { size: 26 });
    const [x, y] = ringPt(cx, cy, RR, 180), ter = G(p, { o: 0 });
    mk('circle', { cx: x, cy: y + 4, r: 9, fill: COL.bad }, ter);
    T(ter, 'ter + Tus', { x, y: y + 50, size: 28, fill: COL.bad, weight: 700, anchor: 'middle' });
    show(ter, m('ter'));
    say(p, 'вилку пропускает только с одной стороны', 1260, 520, m('ter', 3), { size: 24, fill: COL.dim, weight: 600 });
    dblRing(p, 1130, 650, 52, m('two'));
    dblRing(p, 1390, 650, 52, m('two', .3));
    arrowTo(p, 1190, 650, 1330, 650, COL.dim, m('two', .6));
  }],
  ['roll', 'Катящееся кольцо', (m) => {
    const p = panel(0), cx = 330, cy = 470, R = 140, tY = cy - R, U = 330;
    pill(p, 'катящееся кольцо', DNA, 800, 90, .3, 32);
    mk('circle', { cx, cy, r: R, fill: 'none', stroke: COL.chalk, 'stroke-width': 7 }, p);
    const rot = G(p, { x: cx, y: cy });
    [0, 90, 180, 270].forEach(a => { const [x, y] = ringPt(0, 0, R + 24, a); mk('circle', { cx: x, cy: y, r: 5, fill: COL.dim }, rot); });
    const arcNew = path(p, '', { stroke: DNA, 'stroke-width': 7 }), tailA = path(p, '', { stroke: COL.chalk, 'stroke-width': 7 }),
      tailB = path(p, '', { stroke: DNA, 'stroke-width': 7 }), sec = path(p, '', { stroke: DNA, 'stroke-width': 5, 'stroke-dasharray': '76 6' });
    const lab3 = T(p, '3′', { size: 28, weight: 700, anchor: 'middle', o: 0 }), lab5 = T(p, '5′', { x: cx + 26, y: tY - 14, size: 28, weight: 700, anchor: 'middle', o: 0 });
    const cut = scissors(p, cx, tY - 56, m('cut'));
    hide(cut, m('end'), .4);
    const cutLab = say(p, 'разрез', cx + 70, tY - 62, m('cut', .3), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    hide(cutLab, m('turn'), .4);
    show(lab3, m('end')); show(lab5, m('end'));
    const freeLab = say(p, 'свободный 3′-конец', 660, 250, m('end'), { size: 26, fill: DNA, weight: 600, anchor: 'start' });
    const freeArr = arrowTo(p, 655, 255, cx + 14, tY - 8, DNA, m('end', .3));
    hide(freeLab, m('turn'), .4); hide(freeArr, m('turn'), .4);
    const tTurn = m('turn'), tSec = m('second'), tCon = m('concat'), tCut = m('cutting');
    const alpha = t => pw(t, [[tTurn, 0], [tSec, 450], [tCon, 640], [tCut - .3, 1080]]);
    const dur = tCut - .3 - tTurn;
    prog(q => {
      const t = tTurn + q * dur, a = alpha(t), len = U * a / 360, e2 = Math.min(len, clamp01((t - tSec) / 3) * U);
      arcNew.setAttribute('d', a > 0 ? arcD(cx, cy, 0, Math.min(a, 360), () => R - 16) : '');
      tailA.setAttribute('d', len > 0 ? `M${cx} ${tY}H${cx + Math.min(len, U)}` : '');
      tailB.setAttribute('d', len > U ? `M${cx + U} ${tY}H${cx + len}` : '');
      sec.setAttribute('d', e2 > 1 ? `M${cx} ${tY + 17}H${cx + e2}` : '');
      put(rot, { r: a });
      const [lx, ly] = ringPt(cx, cy, R - 44, Math.min(a, 360));
      put(lab3, { x: lx, y: ly + 10 });
      put(lab5, { x: cx + len + 30, y: tY - 14 });
    }, tTurn, dur, lin);
    hide(say(p, 'вытесненная цепь', 900, 300, m('turn', 3), { size: 26, fill: COL.chalk, weight: 600 }), tSec, .4);
    hide(say(p, 'вторая цепь', 560, tY + 56, tSec + 1, { size: 26, fill: DNA, weight: 600 }), tCon, .4);
    // concatemer: three genome copies, cut apart
    const bars = [0, 1, 2].map(k => {
      const b = G(p, { o: 0 });
      mk('rect', { x: cx + k * U + 4, y: tY - 7, width: U - 8, height: 14, rx: 7, fill: k ? DNA : COL.chalk }, b);
      T(b, `геном ${k + 1}`, { x: cx + k * U + U / 2, y: tY - 20, size: 24, fill: COL.dim, weight: 600, anchor: 'middle' });
      return b;
    });
    const brace = G(p, { o: 0 });
    path(brace, `M${cx} ${tY - 88}V${tY - 100}H${cx + 3 * U}V${tY - 88}`, { stroke: COL.int, 'stroke-width': 4 });
    T(brace, 'конкатемер', { x: cx + 1.5 * U, y: tY - 114, size: 28, fill: COL.int, weight: 700, anchor: 'middle' });
    show(brace, tCon + 1.5); hide(brace, tCut + 1, .4);
    [tailA, tailB, sec, lab5].forEach(e => hide(e, tCut, .3));
    bars.forEach((b, k) => { show(b, tCut, .3); tw(b, { y: k * 70 }, tCut + 1.3, 1.2); });
    [1, 2].forEach(k => {
      const ln = path(p, `M${cx + k * U} ${tY - 40}V${tY + 40}`, { stroke: NO, 'stroke-width': 4, 'stroke-dasharray': '8 6' }, { o: 0 });
      show(ln, tCut, .3); hide(ln, tCut + 1.3, .3);
    });
    scissors(p, cx + U, tY + 70, tCut);
    say(p, 'плазмиды · фаги', 1100, 760, m('who'), { size: 28, weight: 600 });
    say(p, 'фаг λ: поздняя стадия — катящееся кольцо, ранняя — θ', 1100, 804, m('who', 1.2), { size: 24, fill: COL.dim, weight: 600 });
  }],
  ['dloop', 'D-петля', (m) => {
    const p = panel(0), cx = 520, cy = 500, R = 175, aH = -35, aL = 205, B = 50;
    pill(p, 'D-петля: митохондрии млекопитающих', DNA, 800, 90, .3, 32);
    mk('circle', { cx, cy, r: R - 8, fill: 'none', stroke: COL.chalk, 'stroke-width': 7 }, p);
    const outer = path(p, arcD(cx, cy, aH, aH + 360, () => R + 8), { stroke: COL.chalk, 'stroke-width': 7 }),
      loop = path(p, '', { stroke: COL.chalk, 'stroke-width': 7, 'stroke-linejoin': 'round' }),
      newH = path(p, '', { stroke: DNA, 'stroke-width': 7 }), newL = path(p, '', { stroke: DNA, 'stroke-width': 7, 'stroke-linejoin': 'round' });
    say(p, 'H', cx + R + 30, cy + 6, .5, { size: 26, fill: COL.dim, weight: 700, anchor: 'start' });
    say(p, 'L', cx + R - 52, cy + 6, .5, { size: 26, fill: COL.dim, weight: 700, anchor: 'end' });
    // origins
    const [hx, hy] = ringPt(cx, cy, R, aH), [lx, ly] = ringPt(cx, cy, R, aL);
    const hMark = G(p, { o: 0 }), lMark = G(p, { o: 0 });
    mk('circle', { cx: hx, cy: hy, r: 10, fill: COL.int }, hMark);
    oriText(hMark, 'H', ringPt(cx, cy, R + 78, aH)[0], ringPt(cx, cy, R + 78, aH)[1], 0);
    const lDot = mk('circle', { cx: 0, cy: 0, r: 10, fill: COL.int }, lMark);
    put(lDot, { x: lx, y: ly });
    oriText(lMark, 'L', ringPt(cx, cy, R + 90, aL)[0], ringPt(cx, cy, R + 90, aL)[1] + 16, 0);
    show(hMark, m('hl')); show(lMark, m('hl', 1.2));
    const tS = m('start'), tG = m('grow'), tO = m('ol'), tB = m('back');
    const eAt = t => pw(t, [[tS, aH], [tS + 2.2, aH + 45], [tG, aH + 45], [tO - .4, aL + 8]]);
    const bAt = t => pw(t, [[tB, 0], [tB + 3.5, 75]]);
    const dist = (e, a) => { const ramp = Math.max(1, Math.min(22, (e - aH) / 2)), v = clamp01(Math.min((a - aH) / ramp, (e - a) / ramp)); return B * v * v * (3 - 2 * v); };
    const t1 = tB + 3.6;
    prog(q => {
      const t = tS + q * (t1 - tS), e = eAt(t), b = bAt(t);
      if (e > aH + 1) {
        outer.setAttribute('d', arcD(cx, cy, e, aH + 360, () => R + 8));
        loop.setAttribute('d', arcD(cx, cy, aH, e, a => R + 8 + dist(e, a)));
        newH.setAttribute('d', arcD(cx, cy, aH, e, () => R - 19));
      }
      const a0 = aL - 6;
      newL.setAttribute('d', b > 1 ? arcD(cx, cy, a0, a0 - b, a => R + 8 + dist(e, a) - 14) : '');
      const [x, y] = ringPt(cx, cy, R + (e > aL - 4 ? 8 + dist(e, aL - 4) : 0), aL - 4);
      put(lDot, { x, y });
    }, tS, t1 - tS, lin);

// A short line sample with its meaning (legend).
function legendBar(p, x, y, c, str, t0) {
  const g = G(p, { o: 0 });
  path(g, `M${x} ${y}h50`, { stroke: c, 'stroke-width': 8, 'stroke-linecap': 'butt' });
  T(g, str, { x: x + 68, y: y + 8, size: 24, fill: c, weight: 600 });
  show(g, t0);
  return g;
}
