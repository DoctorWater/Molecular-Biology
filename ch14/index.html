<script>
'use strict';
const CHAPTER = { number: 14, title: 'PCNA и RFC', minutes: 18, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — pcna3, rfc5, onOff, ringLining, betaRing, clampLoader, dnaBRing, enzyme, dsIcon) ---------- */
const NB = ' ';
const PIPC = COL.whole;
const line = (p, str, x, y, t0, fill = COL.chalk, size = 28, anchor = 'start', weight = 600) => say(p, str, x, y, t0, { size, fill, anchor, weight });
const crossX = (p, x, y, k = 1, c = NO) => { const g = G(p, { x, y, s: k }); path(g, 'M-26 -26L26 26M26 -26L-26 26', { stroke: c, 'stroke-width': 8 }); return g; };
const strip = (p, x, y, w, h, col, o = 1) => put(mk('rect', { x, y, width: w, height: h, rx: Math.min(10, h / 2), fill: col }, p), { o });
const swap = (e, str, t) => prog(() => { e.textContent = str; }, t, .01, lin);
const cues = id => TIMINGS[id].cues.map(c => c[0]);
// ubiquitin mark
function ubi(p, x, y, r = 17) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: COL.int }, g);
  T(g, 'Ub', { y: r * .36, size: r * 1.0, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const SH = [mix(PROT, COL.nat, .7), PROT, mix(PROT, COL.chalk, .55), mix(PROT, COL.real, .5), mix(PROT, COL.real, .95)].map(c => mix(COL.board, c, .5));
// a ring of subunit circles on six places (place 0 on top); n = 5 leaves the sixth empty (dashed)
function slotRing(p, x, y, R, r, t0, n = 6) {
  const g = G(p, { x, y, o: 0 });
  for (let i = 0; i < 6; i++) {
    const a = (-90 + 60 * i) * Math.PI / 180, cx = R * Math.cos(a), cy = R * Math.sin(a);
    if (i < n) mk('circle', { cx, cy, r, fill: n === 6 ? SH[1 + i % 2] : SH[i], stroke: PROT, 'stroke-width': 3 }, g);
    else g.empty = mk('circle', { cx, cy, r, fill: 'none', stroke: COL.int, 'stroke-width': 4, 'stroke-dasharray': '9 7' }, g);
  }
  if (t0 != null) show(g, t0);
  return g;
}
// flash the domain paths of a ring one after another (a bright fill and back)
function flashDoms(doms, t0, step = .22) {
  doms.forEach((d, i) => {
    const c0 = d.getAttribute('fill'), c1 = mix(c0, COL.chalk, .5);
    tw(d, { c_fill: c1 }, t0 + i * step, .2); tw(d, { c_fill: c0 }, t0 + i * step + .25, .3);
  });
}
const betaBd = g => (g.bd = [-1, 1].map(s => path(g, `M0 ${s * (g.R1 - 8)}L0 ${s * (g.R2 + 8)}`, { stroke: COL.int, 'stroke-width': 7 }, { o: 0 })));
const betaDoms = g => [...g.m1.querySelectorAll('path'), ...g.m2.querySelectorAll('path')];
// the five-step bar (atp … junction): chip k is lit
const STEPS = ['АТФ', 'захват и раскрытие', 'вход A-gate', 'стык и гидролиз', 'уход'];
function stepBar(p, k, t0) {
  const g = G(p, { o: 0 });
  STEPS.forEach((s, i) => {
    const x = 160 + i * 320, on = i === k;
    mk('rect', { x: x - 150, y: 62, width: 300, height: 48, rx: 24, fill: on ? mix(COL.board, COL.int, .3) : CARD, stroke: on ? COL.int : COL.faint, 'stroke-width': on ? 3 : 2 }, g);
    T(g, `${i + 1}  ${s}`, { x, y: 95, size: 24, fill: on ? COL.int : COL.dim, weight: 700, anchor: 'middle' });
  });
  show(g, t0);
  return g;
}
// partner pill on a pocket of a ring: a line from the pocket to a pill centred at (x, y)
function partner(p, ring, k, label, x, y, t0, { w = 170, col = PIPC, sw = 8, dash = false, s = ring._st.s } = {}) {
  const [px, py] = [ring._st.x + s * ring.pkPt[k][0], ring._st.y + s * ring.pkPt[k][1]];
  const lk = path(p, `M${px} ${py}L${x} ${y}`, { stroke: col, 'stroke-width': sw, ...(dash ? { 'stroke-dasharray': '12 9' } : {}) }, { o: 0 });
  const e = enzyme(p, label, x, y, null, { w, h: 56, size: 26 }); put(e, { o: 0 });
  show(lk, t0); show(e, t0);
  return { e, lk };
}
// a bare duplex line pair going from x0 to x1 at height y (template chalk, primer amber)
const duoLines = (p, x0, x1, y) => [path(p, `M${x0} ${y}H${x1}`, { stroke: COL.chalk, 'stroke-width': 7 }), path(p, `M${x0} ${y - 14}H${x1}`, { stroke: DNA, 'stroke-width': 7 })];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'PCNA и RFC', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 3 «Эукариотическая вилка» · Глава 14', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'PCNA и RFC', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'зажим и загрузчик эукариот', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['count', 'Сорок миллионов колец', (m) => {
    const p = panel(0), G1 = G(p), G2 = G(p);
    pill(G1, 'фрагмент Оказаки ≈ 150 нт', DNA, 800, 130, .4, 30);
    const fr = dsIcon(G1, 800, 215, 'new', 'old', null, { w: 220, gap: 34, sw: 9 }); put(fr, { o: 0 }); show(fr, .8);
    pill(G1, 'геном ≈ 6,4·10⁹ п.н.', COL.chalk, 800, 335, m('genome'), 30);
    const gn = dsIcon(G1, 800, 410, 'old', 'old', null, { w: 1300, gap: 30, sw: 9 }); put(gn, { o: 0 }); show(gn, m('genome'));
    colorLine(G1, [['6,4·10⁹ / 150 ≈ '], ['4,3·10⁷', DNA], [' фрагментов']], 800, 540, m('genome', 3.6), { size: 46 });
    hide(G1, m('ring', -.2), .5);
    const c = T(G2, '0,0·10⁷', { x: 800, y: 480, size: 120, fill: DNA, weight: 700, anchor: 'middle', o: 0 });
    show(c, m('ring', .2));
    prog(q => { c.textContent = `${(q * 4.3).toFixed(1).replace('.', ',')}·10⁷`; }, m('ring', .3), 5, out);
    const cl = line(G2, 'колец PCNA надо надеть за одну S-фазу', 800, 545, m('ring', .6), COL.dim, 30, 'middle');
    tw(c, { y: 270 }, m('ecoli', -.4), .7); tw(cl, { y: 335 }, m('ecoli', -.4), .7);
    const bar = (y, w, col, lab, val, t) => {
      line(G2, lab, 250, y + 8, t, COL.chalk, 28, 'end', 700);
      const b = strip(G2, 280, y - 14, w, 28, col, 0); show(b, t);
      line(G2, val, 280 + w + 20, y + 8, t, col, 28, 'start', 700);
    };
    bar(520, 1000, DNA, 'человек', '≈ 4,3·10⁷', m('ecoli'));
    bar(600, 3, PROT, 'E. coli', '≈ 2300: на этой шкале почти точка', m('ecoli', 1.4));
    hide(G2, m('euk', -.3), .5);
    pill(p, 'бактерии', COL.chalk, 430, 130, m('euk'), 30); pill(p, 'эукариоты', COL.chalk, 1170, 130, m('euk', 3.4), 30);
    const ld = clampLoader(p, 430, 350, null, { s: .85 }); put(ld, { o: 0 }); show(ld, m('euk'));
    const br = betaRing(p, 430, 600, null, { s: .32 }); put(br, { o: 0 }); show(br, m('euk', .4));
    line(p, 'β₂ + загрузчик τ₃δδ′', 430, 735, m('euk', .8), PROT, 30, 'middle', 700);
    const rf = rfc5(p, 1170, 330, null, { s: .75 }); put(rf, { o: 0 }); show(rf, m('euk', 3.6));
    const pc = pcna3(p, 1170, 600, null, { s: .32 }); put(pc, { o: 0 }); pc.shade(null); show(pc, m('euk', 4));
    line(p, 'PCNA + RFC', 1170, 735, m('euk', 4.4), PROT, 30, 'middle', 700);
  }],

  ['pcna', 'Кольцо PCNA', (m) => {
    const p = panel(0), g = pcna3(p, 500, 470, .3, { s: 1.2 }), x0 = 900;
    pill(p, 'скользящий зажим эукариот', PROT, 1200, 170, .8, 30);
    line(p, 'proliferating cell nuclear antigen', x0, 280, m('name'), COL.chalk, 32, 'start', 700);
    line(p, 'антиген делящихся клеток — название историческое', x0, 326, m('name', .5), COL.dim, 26, 'start', 600);
    g.shade(m('three'), .8);
    line(p, 'три одинаковые молекулы — гомотример', x0, 430, m('three'), COL.chalk, 30, 'start', 700);
    line(p, 'оттенки только помогают различить их', x0, 474, m('three', .4), COL.dim, 26, 'start', 600);
    g.loop.forEach((l, i) => show(l, m('dom', .4 + i * .4), .4));
    flashDoms(g.dom.slice(0, 2), m('dom'), .4);
    line(p, 'в каждой молекуле два похожих домена', x0, 580, m('dom'), COL.chalk, 30, 'start', 700);
    line(p, 'соединены длинной петлёй; ≈ 29 кДа', x0, 624, m('dom', .4), COL.dim, 26, 'start', 600);
    show(g.arr, m('ht'), .6);
    line(p, 'голова к хвосту, как у β-кольца', x0, 740, m('ht'), COL.chalk, 30, 'start', 700);
  }],

  ['compare', 'β₂ и PCNA: шесть доменов', (m) => {
    const p = panel(0), b = betaRing(p, 410, 430, .3, { s: .85 }), c = pcna3(p, 1190, 430, .3, { s: .85 });
    c.shade(null); betaBd(b);
    pill(p, 'β₂ · кишечная палочка', PROT, 410, 160, .5, 28); pill(p, 'PCNA · эукариоты', PROT, 1190, 160, .5, 28);
    line(p, '2 × 3 = 6 доменов', 410, 690, m('b'), COL.chalk, 32, 'middle', 700);
    flashDoms(betaDoms(b), m('b', .6));
    line(p, '3 × 2 = 6 доменов', 1190, 690, m('p'), COL.chalk, 32, 'middle', 700);
    flashDoms(c.dom, m('p', .6));
    line(p, '≈ 41 → ≈ 82 кДа', 410, 736, m('mass'), COL.dim, 28, 'middle', 600);
    line(p, '≈ 29 → ≈ 87 кДа', 1190, 736, m('mass', 1.6), COL.dim, 28, 'middle', 600);
    b.bd.forEach((l, i) => show(l, m('border', .2 + i * .5), .4));
    c.bd.forEach((l, i) => show(l, m('border', 1.6 + i * .5), .4));
    line(p, 'границ: 2', 410, 782, m('border', .2), COL.int, 32, 'middle', 700);
    line(p, 'границ: 3', 1190, 782, m('border', 1.6), COL.int, 32, 'middle', 700);
    ringLining(b);
    show(b.hel, m('inside'), .6); show(c.hel, m('inside'), .6);
    show(b.sheet, m('inside', 3), .6); show(c.sheet, m('inside', 3), .6);
    line(p, '6 × 2 = 12 α-спиралей', 800, 430, m('inside'), COL.chalk, 30, 'middle', 700);
    line(p, 'внутри', 800, 468, m('inside', .2), COL.dim, 26, 'middle', 600);
    line(p, 'сплошной слой β-листов', 800, 530, m('inside', 3), COL.chalk, 28, 'middle', 700);
    line(p, 'снаружи', 800, 566, m('inside', 3.2), COL.dim, 26, 'middle', 600);
    pill(p, 'складка та же, текст другой', COL.int, 800, 845, m('inside', 7), 28);
  }],

  ['q1', 'Быстрая проверка', () => {
    const p = panel(0), b = betaRing(p, 420, 340, .3, { s: .8 }), c = pcna3(p, 1180, 340, .3, { s: .8 });
    c.shade(null);
    S.picks = [{ el: b, box: [240, 160, 360, 360], label: 'кольцо β₂' }, { el: c, box: [1000, 160, 360, 360], label: 'кольцо PCNA' }];
  }, { ask: done => quiz(BAND, [{
    id: 'c-three', prompt: ['У какого кольца три границы между субъединицами? Нажмите на него.'],
    build: pickEls(S.picks, 1, 'У PCNA три субъединицы, значит, три границы между ними.',
      () => 'У β₂ две субъединицы, значит, две границы.'),
  }], done) }],

  ['gap', 'Зазор между кольцом и ДНК', (m) => {
    const p = panel(0), X = 500, Y = 460, K = 1.15, g = pcna3(p, X, Y, .3, { s: K }), x0 = 930;
    g.shade(null);
    const dna = G(p, { x: X, y: Y, o: 0 });
    mk('circle', { r: 90 * K, fill: mix(COL.board, DNA, .3), stroke: DNA, 'stroke-width': 4 }, dna);
    T(dna, 'ДНК', { y: -2, size: 36, fill: DNA, weight: 700, anchor: 'middle' });
    T(dna, '≈ 20 Å', { y: 40, size: 28, fill: COL.chalk, weight: 600, anchor: 'middle' });
    show(dna, m('dna'), .6);
    line(p, 'спираль B-формы ≈ 20 Å', x0, 200, m('dna'), DNA, 30, 'start', 700);
    hBracket(p, X - 157 * K, X + 157 * K, Y + 253 * K - 14, 'отверстие ≈ 35 Å', COL.chalk, m('hole'), { up: false });
    line(p, 'отверстие PCNA ≈ 35 Å', x0, 250, m('hole'), COL.chalk, 30, 'start', 700);
    const band = path(p, `M${-157 * K} 0a${157 * K} ${157 * K} 0 1 0 ${314 * K} 0a${157 * K} ${157 * K} 0 1 0 ${-314 * K} 0ZM${-90 * K} 0a${90 * K} ${90 * K} 0 1 0 ${180 * K} 0a${90 * K} ${90 * K} 0 1 0 ${-180 * K} 0Z`,
      { fill: COL.int, 'fill-opacity': .5, 'fill-rule': 'evenodd', stroke: 'none' }, { x: X, y: Y, o: 0 });
    show(band, m('gap'), .5); pulse(band, m('gap'), 1.03);
    [-1, 1].forEach(s => say(p, '7,5', X + s * 129 * K, Y + 8, m('gap', .5), { size: 26, fill: COL.board, weight: 700 }));
    colorLine(p, [['(35 − 20) / 2 = '], ['7,5 Å', COL.int]], x0, 345, m('gap', 1), { size: 42, anchor: 'start' });
    line(p, 'зазор с каждой стороны', x0, 390, m('gap', 1.4), COL.dim, 26, 'start', 600);
    // water in the gap and the charges lining the hole
    for (let i = 0; i < 20; i++) {
      const a = (i * 18 + (i % 2) * 7) * Math.PI / 180, r = (i % 2 ? 123 : 140) * K, w = mk('circle', { cx: X + r * Math.cos(a), cy: Y + r * Math.sin(a), r: 5, fill: mix(COL.board, COL.whole, .75) }, p);
      put(w, { o: 0 }); show(w, m('water', .3 + i * .05), .3);
    }
    show(g.plus, m('water', 1.5), .6);
    line(p, 'в зазоре слой воды', x0, 480, m('water'), COL.chalk, 30, 'start', 700);
    line(p, '«+» выстилки притягивают остов,', x0, 524, m('water', 1.6), COL.dim, 26, 'start', 600);
    line(p, 'но не держат: PCNA скользит', x0, 560, m('water', 1.8), COL.dim, 26, 'start', 600);
    hBracket(p, X - 209 * K, X + 209 * K, Y - 209 * K - 18, 'снаружи ≈ 80 Å', COL.chalk, m('out'), { up: true });
    const lock = G(p, { x: X, y: Y - 183 * K, o: 0 });
    mk('rect', { x: -22, y: -4, width: 44, height: 34, rx: 7, fill: COL.board, stroke: OK, 'stroke-width': 4 }, lock);
    path(lock, 'M-12 -4V-14A12 12 0 0 1 12 -14V-4', { stroke: OK, 'stroke-width': 4 });
    show(lock, m('closed'), .5); pulse(lock, m('closed'), 1.3);
    line(p, 'замкнутое кольцо: на ДНК не садится', x0, 700, m('closed'), OK, 30, 'start', 700);
    line(p, 'как и β, ждёт загрузчика', x0, 744, m('closed', 1.6), COL.dim, 26, 'start', 600);
  }],

  ['pip', 'PIP-бокс', (m) => {
    const p = panel(0), R0 = pcna3(p, 300, 520, .3, { s: .7 }), CX = i => 610 + 110 * i;
    R0.shade(null);
    const LET = ['Q', 'x', 'x', 'L/I/M', 'x', 'x', 'F/Y', 'F/Y'], KEY = [0, 3, 6, 7], P21 = ['Q', 'T', 'S', 'M', 'T', 'D', 'F', 'Y'];
    const cell = (i, y, str, hi, t, col) => {
      const g = G(p, { x: CX(i), y, o: 0 });
      mk('rect', { x: -50, y: -32, width: 100, height: 64, rx: 14, fill: hi ? mix(COL.board, col, .3) : CARD, stroke: hi ? col : COL.faint, 'stroke-width': hi ? 3.5 : 2.5 }, g);
      T(g, str, { y: 10, size: str.length > 1 ? 26 : 34, fill: hi ? col : COL.dim, weight: 700, anchor: 'middle' });
      show(g, t); return g;
    };
    line(p, 'любой белок с коротким мотивом', 1010, 110, .5, COL.chalk, 30, 'middle', 700);
    for (let i = 0; i < 8; i++) { const g = G(p, { x: CX(i), y: 192, o: 0 }); mk('rect', { x: -50, y: -32, width: 100, height: 64, rx: 14, fill: CARD, stroke: COL.faint, 'stroke-width': 2.5 }, g); T(g, String(i + 1), { y: 10, size: 28, fill: COL.faint, weight: 700, anchor: 'middle' }); show(g, 1 + i * .1); }
    pill(p, 'PIP-бокс', PIPC, 300, 192, m('name'), 34);
    const row = LET.map((l, i) => cell(i, 192, l, KEY.includes(i), m('rule', .3 + i * .5), PIPC));
    row.forEach((g, i) => { if (KEY.includes(i)) pulse(g, m('rule', .3 + i * .5), 1.15); });
    line(p, 'остальные позиции — любые (x)', 1010, 290, m('rule', 4.5), COL.dim, 26, 'middle', 600);
    line(p, 'p21', 540, 446, m('p21'), COL.chalk, 32, 'end', 700);
    P21.forEach((l, i) => cell(i, 435, l, KEY.includes(i), m('p21', .2 + i * .15), PIPC));
    const d = path(p, `M${CX(3)} 310V402`, { stroke: PIPC, 'stroke-width': 4, 'stroke-dasharray': '8 8' }); put(d, { o: 0 }); show(d, m('p21', 2.8), .4);
    line(p, 'позиция 4: M — подходит', 1010, 520, m('p21', 3.2), PIPC, 28, 'middle', 700);
    // the pocket in close-up
    const Z = G(p, { o: 0 });
    mk('rect', { x: 890, y: 590, width: 340, height: 150, rx: 44, fill: 'none', stroke: PROT, 'stroke-width': 4, 'stroke-dasharray': '12 8' }, Z);
    mk('rect', { x: 780, y: 620, width: 100, height: 76, rx: 26, fill: 'none', stroke: PROT, 'stroke-width': 4, 'stroke-dasharray': '12 8' }, Z);
    [[830, 658, 'Q'], [950, 640, 'M'], [1060, 676, 'F'], [1160, 640, 'Y']].forEach(([x, y, l]) => {
      mk('circle', { cx: x, cy: y, r: 27, fill: PIPC }, Z);
      T(Z, l, { x, y: y + 10, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
    });
    T(Z, 'гидрофобный карман', { x: 1060, y: 575, size: 26, fill: PROT, weight: 700, anchor: 'middle' });
    T(Z, 'боковой', { x: 830, y: 725, size: 22, fill: PROT, weight: 700, anchor: 'middle' });
    show(Z, m('hold'), .6);
    arrowTo(p, 440, 450, 770, 630, PIPC, m('hold'), true);
    show(R0.pk[0], m('hold'), .4);
    line(p, 'M, F, Y — в гидрофобном кармане, Q — в боковом', 1010, 800, m('hold', 1.6), COL.dim, 26, 'middle', 600);
    R0.pk.forEach((e, i) => { show(e, m('pocket', .3 + i * .5), .4); pulse(e, m('pocket', .3 + i * .5), 1.25); });
    R0.loop.forEach(l => show(l, m('pocket'), .4));
    line(p, 'лицевая сторона, у петли:', 300, 730, m('pocket'), COL.chalk, 26, 'middle', 700);
    line(p, 'три кармана, по одному на субъединицу', 300, 770, m('pocket', .6), COL.dim, 24, 'middle', 600);
  }],

  ['partners', 'Партнёры PCNA', (m) => {
    const p = panel(0), X = 1170, Y = 450, K = .85, g = pcna3(p, X, Y, .3, { s: K });
    g.shade(null); g.pk.forEach(e => show(e, .8, .4));
    const card = (i, t, name, note, { dash = false, w = 5, qm = false, name2 } = {}) => {
      const y = 170 + i * 150, c = G(p, { o: 0 });
      mk('rect', { x: 100, y: y - 52, width: 560, height: 104, rx: 22, fill: CARD, stroke: dash ? COL.dim : PROT, 'stroke-width': 3, ...(dash ? { 'stroke-dasharray': '12 9' } : {}) }, c);
