<script>
'use strict';
const CHAPTER = { number: 6, title: 'Как копируется ДНК: три модели и один опыт', minutes: 10, language: 'ru' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
const o = 'old', n = 'new', O4 = [o, o, o, o], N4 = [n, n, n, n];
// The experiment layout: three model columns, an optional experiment tube, molecule rows, gradient tubes (rim TR, TH deep).
const X3 = [330, 760, 1190], XE = 1460, MY = [200, 290], TR = 370, TH = 300;
const KEYS = ['cons', 'semi', 'disp'], MODELS = ['консервативная', 'полуконсервативная', 'дисперсная'];
// Densities, g/cm³: T heavy ¹⁵N, P hybrid, L light ¹⁴N, Q the dispersive molecule of generation 2 (¼ ¹⁵N).
const RHO = { T: 1.724, P: 1.717, L: 1.710, Q: 1.7135 };
const LET = { T: 'Т', P: 'П', L: 'Л' };
const fmt = v => v.toFixed(3).replace('.', ',');
const BANDCOL = { T: COL.chalk, P: mix(COL.chalk, DNA, .5), L: DNA, Q: mix(DNA, COL.chalk, .25) };
// Density → depth below the rim of a TH-deep tube, linear: 1,710 at 110, 1,724 at 230 (the gradient stretched).
const depthOf = rho => 110 + (rho - 1.710) / .014 * 120;
// Molecules of each model by generation: [dx from the column centre, row, top strand, bottom strand].
const MOLS = {
  cons: [[[0, 0, O4, O4]], [[-90, 0, O4, O4], [90, 0, N4, N4]], [[-90, 0, O4, O4], [90, 0, N4, N4], [-90, 1, N4, N4], [90, 1, N4, N4]]],
  semi: [[[0, 0, O4, O4]], [[-90, 0, O4, N4], [90, 0, N4, O4]], [[-90, 0, O4, N4], [90, 0, N4, O4], [-90, 1, N4, N4], [90, 1, N4, N4]]],
  disp: [[[0, 0, O4, O4]], [[-90, 0, [o, n, o, n], [n, o, n, o]], [90, 0, [n, o, n, o], [o, n, o, n]]],
    [[-90, 0, [o, n, n, n], [n, n, o, n]], [90, 0, [n, n, o, n], [n, o, n, n]], [-90, 1, [n, o, n, n], [n, n, n, o]], [90, 1, [n, n, n, o], [o, n, n, n]]]],
};
// Bands by generation: [kind, fraction of the molecules]; the band thickness follows the fraction.
const BANDS = {
  cons: [[['T', 1]], [['T', .5], ['L', .5]], [['T', .25], ['L', .75]]],
  semi: [[['T', 1]], [['P', 1]], [['P', .5], ['L', .5]]],
  disp: [[['T', 1]], [['P', 1]], [['Q', 1]]],
};
const EXP = BANDS.semi;
const strike = (p, x1, x2, y, t0) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: NO, 'stroke-width': 5 }, { d: 0 }), t0, .4);
// Gradient in a tube: n layers from the liquid surface (depth top) down, denser (more opaque) towards the bottom.
function grad(t, at, h, { top = 40, n = 7, k0 = .04, k1 = .34, r = 45 } = {}) {
  const lo = h - r, L = [];
  for (let k = 0; k < n; k++) {
    const y1 = top + k * (lo - top) / (n - 1), y2 = k < n - 1 ? top + (k + 1) * (lo - top) / (n - 1) : h;
    L.push(t.fill(y1, y2, COL.dim, at, k0 + k * (k1 - k0) / (n - 1)));
  }
  return L;
}
// A band of kind T/P/L/Q at its depth; thickness 6 + 14·fraction. A hybrid band is two-tone: half old, half new.
function bandOf(t, kind, f, at, dep = depthOf) {
  const d = dep(RHO[kind]), th = 6 + 14 * f;
  if (kind === 'P') return [t.band(d - th / 4, COL.chalk, at, th / 2), t.band(d + th / 4, DNA, at, th / 2)];
  return [t.band(d, BANDCOL[kind], at, th)];
}
function genPill(p, k, t) { return pill(p, `поколение ${k}`, COL.chalk, 800, 48, t, 26); }
// The density scale on the left with dashed level guides across to xEnd.
function expBase(p, t0, xEnd = 1250) {
  const g = G(p, { o: 0 }), y = k => TR + depthOf(RHO[k]);
  ['L', 'P', 'T'].forEach(k => {
    path(g, `M190 ${y(k)}H${xEnd}`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 8' });
    path(g, `M175 ${y(k)}H190`, { stroke: COL.dim, 'stroke-width': 3 });
    T(g, fmt(RHO[k]), { x: 164, y: y(k) + 8, size: 22, fill: COL.dim, weight: 600, anchor: 'end' });
    T(g, LET[k], { x: 202, y: y(k) - 8, size: 22, fill: BANDCOL[k], weight: 700 });
  });
  path(g, `M175 ${y('L') - 40}V${y('T') + 40}`, { stroke: COL.dim, 'stroke-width': 3 });
  T(g, 'г/см³', { x: 175, y: y('L') - 54, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  T(g, 'масштаб', { x: 110, y: TR + 4, size: 20, fill: COL.dim, anchor: 'middle' });
  T(g, 'растянут', { x: 110, y: TR + 28, size: 20, fill: COL.dim, anchor: 'middle' });
  show(g, t0);
  return g;
}
// One model column: title, molecules (.mols), a gradient tube with bands (.setBands); .out(t) dims and crosses it, .ok(t) frames it.
function modelCol(p, i, t0, { out = false } = {}) {
  const x = X3[i], g = G(p, { o: 0 }), c = { g, x, key: KEYS[i], pairs: [], bands: [] };
  T(g, MODELS[i], { x, y: 118, size: 30, weight: 700, anchor: 'middle' });
  c.tube = tube(g, x, TR, t0, { w: 90, h: TH });
  grad(c.tube, t0, TH);
  tw(g, { o: out ? .3 : 1 }, t0, .5);
  const cross = G(p, { o: 0 });
  path(cross, `M${x - 170} 150L${x + 170} 680M${x + 170} 150L${x - 170} 680`, { stroke: NO, 'stroke-width': 6 });
  if (out) show(cross, t0);
  c.mols = (gen, t) => { c.pairs = MOLS[c.key][gen].map(([dx, row, top, bot]) => dsIcon(g, x + dx, MY[row], top, bot, t)); return c.pairs; };
  c.setBands = (list, t) => {
    c.bands.forEach(arr => arr.forEach(e => hide(e, t, .4)));
    c.bands = list.map(([k, f]) => bandOf(c.tube, k, f, t + .2));
  };
  c.out = t => { tw(g, { o: .3 }, t, .6); show(cross, t + .3, .4); };
  c.ok = t => {
    const e = mk('rect', { x: x - 205, y: 80, width: 410, height: 610, rx: 22, fill: 'none', stroke: OK, 'stroke-width': 4 }, p);
    put(e, { o: 0 }); show(e, t);
    pill(p, 'совпадает во всех поколениях', OK, x, 716, t + .4, 24);
  };
  return c;
}
// The experiment tube on the right with its bands.
function expTube(p, t0, list, tb = t0) {
  const g = G(p);
  say(g, 'опыт', XE, 118, t0, { size: 30, fill: DNA, weight: 700 });
  const t = tube(g, XE, TR, t0, { w: 90, h: TH });
  grad(t, t0, TH);
  g.tube = t;
  g.bands = list.map(([k, f]) => bandOf(t, k, f, tb));
  return g;
}
// The whole layout of one generation, drawn at t0.
function expScene(p, gen, t0, { out = [], exp = null } = {}) {
  expBase(p, t0, exp == null ? 1250 : 1520);
  const cols = [0, 1, 2].map(i => {
    const c = modelCol(p, i, t0, { out: out.includes(i) });
    c.mols(gen, null);
    c.setBands(BANDS[c.key][gen], t0 - .2);
    return c;
  });
  if (exp != null) cols.exp = expTube(p, t0, EXP[exp]);
  return cols;
}
// Dispersive copying: the old pieces of the source molecules spread apart (cut), fly into the old slots of the new molecules
// (mixed across them), and the new molecules fade in around them. src: dsIcon groups at fixed places; dst: [{x, y, top, bot}].
function scatter(p, src, dst, t, { w = 140, gap = 22, cut = .5 } = {}) {
  const pw = w / 4, slots = [];
  const outs = dst.map(d => {
    const q = dsIcon(p, d.x, d.y, d.top, d.bot, null, { w, gap });
    put(q, { o: 0 });
    q.pieces.forEach((line, li) => line.forEach((e, k) => {
      if (e.kind === o) { put(e, { o: 0 }); slots.push([d.x - w / 2 + k * pw, d.y + (li ? 1 : -1) * gap / 2]); }
    }));
    return q;
  });
  let s = 0;
  const N = slots.length;
  src.forEach(g => {
    hide(g.rungs, t, .3);
    g.pieces.forEach((line, li) => line.forEach((e, k) => {
      if (e.kind !== o) { hide(e, t, .3); return; }
      const [sx, sy] = slots[(s * 3) % N], x0 = -w / 2 + k * pw;
      tw(e, { x: x0 + (k - 1.5) * 9 }, t, cut);
      tw(e, { x: sx - g.px, y: sy - g.py - (li ? 1 : -1) * gap / 2 }, t + cut + .2 + s * .06, 1.2);
      s++;
    }));
  });
  outs.forEach(q => show(q, t + cut + 1.9, .5));
  return outs;
}
// Transitions of a model column between generations (pairs drawn by c.mols at fixed places).
function cons01(c, t1, t2) {
  tw(c.pairs[0], { x: c.x - 90 }, t1, 1);
  dsIcon(c.g, c.x + 90, MY[0], N4, N4, t2);
}
function cons12(c, t) { [-90, 90].forEach((dx, k) => dsIcon(c.g, c.x + dx, MY[1], N4, N4, t + k * .4)); }
// Hidden parts of a new pair: lines already covered by moved strands; the rest appears at t.
function partner(c, dx, row, top, bot, keep, t) {
  const q = dsIcon(c.g, c.x + dx, MY[row], top, bot, null);
  [q.top, q.bot, q.rungs].forEach(e => put(e, { o: 0 }));
  const nw = keep === 'top' ? q.bot : q.top;
  show(nw, t, .6); show(q.rungs, t + .3, .4);
  return q;
}
function semi01(c, t1, t2) {
  const s = c.pairs[0];
  hide(s.rungs, t1, .3);
  tw(s.top, { x: -90 }, t1 + .2, 1.2); tw(s.bot, { x: 90 }, t1 + .2, 1.2);
  partner(c, -90, 0, O4, N4, 'top', t2);
  partner(c, 90, 0, N4, O4, 'bot', t2 + .3);
}
function semi12(c, t1, t2, t3) {
  const [a, b] = c.pairs;
  hide(a.rungs, t1, .3); hide(b.rungs, t1, .3);
  tw(a.bot, { y: 11 + 90 }, t1 + .2, 1.2); tw(b.top, { y: -11 + 90 }, t1 + .2, 1.2);
  partner(c, -90, 0, O4, N4, 'top', t2); partner(c, 90, 0, N4, O4, 'bot', t2 + .3);
  partner(c, -90, 1, N4, N4, 'bot', t3); partner(c, 90, 1, N4, N4, 'top', t3 + .3);
}
const dstOf = (c, gen) => MOLS.disp[gen].map(([dx, row, top, bot]) => ({ x: c.x + dx, y: MY[row], top, bot }));
const disp01 = (c, t) => scatter(c.g, c.pairs, dstOf(c, 1), t);
const disp12 = (c, t) => scatter(c.g, c.pairs, dstOf(c, 2), t);

// Small pictures: the radioactivity sign, a balance, a nucleus, a flask, a centrifuge rotor, a flame.
function trefoil(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 }), pt = (a, r) => `${(r * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(r * Math.sin(a * Math.PI / 180)).toFixed(1)}`;
  mk('circle', { r: 58, fill: CARD, stroke: COL.int, 'stroke-width': 3 }, g);
  [-90, 30, 150].forEach(a => mk('path', { d: `M${pt(a - 30, 13)}L${pt(a - 30, 46)}A46 46 0 0 1 ${pt(a + 30, 46)}L${pt(a + 30, 13)}A13 13 0 0 0 ${pt(a - 30, 13)}Z`, fill: COL.int }, g));
  mk('circle', { r: 8, fill: COL.int }, g);
  show(g, t0);
  return g;
}
function scales(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 }), ln = { stroke: COL.chalk, 'stroke-width': 4 };
  path(g, 'M0 -60V44M-40 44H40', ln);
  const beam = G(g, { y: -52, r: -8 });
  path(beam, 'M-80 0H80', ln);
  [[-80, COL.chalk, 26], [80, DNA, 18]].forEach(([px, c, s]) => {
    const pan = G(beam, { x: px, r: 8 });
    path(pan, 'M0 0L-28 46M0 0L28 46M-34 46H34', { stroke: COL.dim, 'stroke-width': 3 });
    mk('rect', { x: -s / 2, y: 46 - s, width: s, height: s, rx: 3, fill: c }, pan);
  });
  show(g, t0);
  return g;
}
// A nucleus of np protons and nn neutrons packed in a spiral; .extra — the last neutron (the 15th particle of ¹⁵N).
function nucleus(p, x, y, np, nn, t0) {
  const g = G(p, { x, y, o: 0 }), tot = np + nn, kinds = [];
  for (let k = 0; k < tot; k++) kinds.push(k < 2 * Math.min(np, nn) ? (k % 2 ? 'n' : 'p') : (np > nn ? 'p' : 'n'));
  const balls = [];
  for (let k = tot - 1; k >= 0; k--) {
    const r = 12 * Math.sqrt(k + .5), a = k * 2.39996, b = G(g, { x: r * Math.cos(a), y: r * Math.sin(a) });
    mk('circle', { r: 14, fill: kinds[k] === 'p' ? COL.nat : COL.dim, stroke: COL.board, 'stroke-width': 2.5 }, b);
    balls[k] = b;
  }
  g.extra = balls[tot - 1];
  show(g, t0);
  return g;
}
function flask(p, x, y, t0, label, liq) {
  const g = G(p, { x, y, o: 0 });
  mk('path', { d: 'M-68 -6L-22 -80H22L68 -6Z', fill: liq, 'fill-opacity': .3 }, g);
  path(g, 'M-18 -150V-90L-80 0H80L18 -90V-150M-28 -150H28', { stroke: COL.chalk, 'stroke-width': 4 });
  T(g, label, { y: -26, size: 30, fill: liq, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// A bacterial cell with one DNA molecule inside (dsIcon strands top/bot).
function cell(p, x, y, top, bot, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('ellipse', { rx: 86, ry: 46, fill: mix(COL.board, COL.dim, .12), stroke: COL.dim, 'stroke-width': 3 }, g);
  dsIcon(g, 0, 0, top, bot, null, { w: 100, gap: 18, sw: 7 });
  show(g, t0);
  return g;
}
function rotor(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 }), R = G(g);
  mk('circle', { r: 76, fill: CARD, stroke: COL.chalk, 'stroke-width': 4 }, R);
  [0, 90, 180, 270].forEach(a => {
    const s = G(R, { r: a });
    mk('rect', { x: 22, y: -10, width: 46, height: 20, rx: 10, fill: mix(COL.board, COL.dim, .4), stroke: COL.dim, 'stroke-width': 2.5 }, s);
  });
  mk('circle', { r: 10, fill: COL.dim }, R);
  g.R = R;
  show(g, t0);
  return g;
}
function flame(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('path', { d: 'M0 0C-34 -6 -30 -44 -4 -74C-2 -50 30 -46 24 -16C20 -2 10 2 0 0Z', fill: COL.int, stroke: COL.nat, 'stroke-width': 3 }, g);
  show(g, t0);
  return g;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Как копируется ДНК: три модели и один опыт', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Как копируется ДНК', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'три модели и один опыт', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['guess', 'Догадка Уотсона и Крика', (m) => {
    const p = panel(0), sq = 'ATGCGC', dx = 80, r = 20, opt = { dx, r, gap: 240 };
    const q = G(p, { o: 0 });
    mk('rect', { x: 160, y: 50, width: 1280, height: 92, rx: 18, fill: CARD, stroke: COL.dim, 'stroke-width': 2 }, q);
    T(q, '«по каждой из разделённых цепей можно достроить недостающую половину»', { x: 800, y: 106, size: 28, weight: 600, anchor: 'middle' });
    T(q, 'глава 3', { x: 1420, y: 176, size: 22, fill: COL.dim, anchor: 'end' });
    show(q, .2);
    // left molecule: parental top + new lower strand; right: new top + parental lower; at first the parental strands sit together
    const gL = G(p, { x: 320 }), gR = G(p, { x: -320 });
    const L = duplex(gL, sq, 280, 240, .4, { ...opt, t1: null, col: [COL.chalk, DNA] });
    const R = duplex(gR, sq, 920, 240, null, { ...opt, t1: null, col: [DNA, COL.chalk] });
    R.bot.units.forEach(u => show(u, .4, .4)); show(R.bot.end3, .4); show(R.bot.end5, .4);
    L.bonds.forEach(b => show(b, .6, .4));
    const t = m('split');
    L.bonds.forEach(b => hide(b, t, .3));
    tw(gL, { y: -30 }, t + .2, .5); tw(gR, { y: 30 }, t + .2, .5);
    tw(gL, { x: 0 }, t + .7, 1.3); tw(gR, { x: 0 }, t + .7, 1.3);
    tw(gL, { y: 0 }, t + 2, .5); tw(gR, { y: 0 }, t + 2, .5);
    const t2 = t + 2.6;
    [...sq].forEach((b, i) => {
      show(L.at(i), t2 + i * .3, .4); show(L.bonds[i], t2 + i * .3 + .2, .3);
      show(R.top.units[i], t2 + i * .3, .4); show(R.bonds[i], t2 + i * .3 + .2, .3);
    });
    [L.bot.end3, L.bot.end5, R.top.end5, R.top.end3].forEach(e => show(e, t2 + 1.6));
    say(p, 'старая', 160, 250, t + 1.6, { size: 26, fill: COL.chalk, weight: 600, anchor: 'end' });
    say(p, 'новая', 160, 490, t2, { size: 26, fill: DNA, weight: 600, anchor: 'end' });
    say(p, 'новая', 1440, 250, t2, { size: 26, fill: DNA, weight: 600, anchor: 'start' });
    say(p, 'старая', 1440, 490, t + 1.6, { size: 26, fill: COL.chalk, weight: 600, anchor: 'start' });
    pill(p, 'догадка ≠ доказательство', COL.int, 800, 590, m('doubt'), 28);
    [560, 700, 840].forEach((x, i) => pill(p, '?', COL.chalk, x, 690, m('three', .4 + i * .3), 34));
    arrowTo(p, 900, 690, 980, 690, COL.dim, m('one'));
    pill(p, 'один опыт', DNA, 1090, 690, m('one', .3), 30);
  }],
  ['models', 'Три модели', (m) => {
    const p = panel(0), X = [300, 800, 1300], W = { w: 160 };
    const lg = G(p, { o: 0 });
    path(lg, 'M90 70H150', { stroke: COL.chalk, 'stroke-width': 8, 'stroke-linecap': 'butt' });
    path(lg, 'M90 112H150', { stroke: DNA, 'stroke-width': 8, 'stroke-linecap': 'butt' });
    T(lg, 'старая (родительская) цепь', { x: 168, y: 78, size: 24, fill: COL.chalk, weight: 600 });
    T(lg, 'новая цепь', { x: 168, y: 120, size: 24, fill: DNA, weight: 600 });
    show(lg, .2);
    dsIcon(p, 800, 110, O4, O4, .3, W);
    say(p, 'родительская молекула', 800, 170, .5, { size: 24, fill: COL.dim, weight: 600 });
    say(p, 'одна → две', 1060, 120, .9, { size: 28, weight: 700, anchor: 'start' });
    const copy = (x, t) => { const c = dsIcon(p, 800, 110, O4, O4, t, W); tw(c, { x, y: 380 }, t + .3, 1.1); c.px = x; c.py = 380; return c; };
    const sub = (i, a, b, t) => { say(p, a, X[i], 572, t, { size: 24, weight: 600 }); say(p, b, X[i], 604, t + .2, { size: 24, weight: 600 }); };
    // conservative
    say(p, MODELS[0], X[0], 270, m('cons'), { size: 32, weight: 700 });
    copy(X[0], m('cons', .2));
    dsIcon(p, X[0], 480, N4, N4, m('consnew'), W);
    sub(0, 'одна целиком старая,', 'другая целиком новая', m('consnew', 1));
    // semiconservative: the copy's lower strand slides down and each old strand gets a new partner
    say(p, MODELS[1], X[1], 270, m('semi'), { size: 32, weight: 700 });
    const s = copy(X[1], m('semi', .2));
