<script>
'use strict';
const CHAPTER = { number: 11, title: 'Старт в oriC и вилка целиком', minutes: 13, language: 'ru', next: '../ch12/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — fork, bubble, oriMark, ringPt, catenane, dnaBRing, clampSide, duplex, enzyme) ---------- */
const NB = ' ';
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });
const line = (p, str, x, y, t0, fill = COL.chalk, size = 28, anchor = 'start', weight = 600) => say(p, str, x, y, t0, { size, fill, anchor, weight });
// a protein body (enzyme pill) shown at once inside a group that fades as a whole
const PB = (p, lab, x, y, w, h, size) => put(enzyme(p, lab, x, y, null, { w, h, size }), { o: 1 });
const DNAC = mix(PROT, COL.chalk, .5);   // DnaC: the second shade of protein pink

/* ---------- oriC as a ribbon of 245 bp (schematic positions) ----------
   Lane 1: DUE (three blocks of 13 bp) and eight DnaA boxes (solid: high affinity R1, R2, R4; dashed: low affinity), lane 2 under it: GATC ticks.
   Parts start hidden (o 0): .due, .boxes, .gat (container, ticks inside .ticks[i] hidden). .X(bp) → x. */
const BOXES = [['R1', 55, 'hi'], ['I1', 80, 'lo'], ['R5', 105, 'lo'], ['I2', 130, 'lo'], ['R2', 150, 'hi'], ['I3', 175, 'lo'], ['R3', 195, 'lo'], ['R4', 225, 'hi']];
const GATCS = [6, 30, 48, 66, 88, 112, 138, 162, 186, 208, 236];
function oriRibbon(p, x0, y, { W = 1280, h = 64 } = {}) {
  const g = G(p), k = W / 245, X = bp => x0 + bp * k;
  Object.assign(g, { X, k, x0, W, y, h });
  mk('rect', { x: x0, y: y - h / 2, width: W, height: h, rx: 16, fill: CARD, stroke: COL.dim, 'stroke-width': 3 }, g);
  g.due = G(g, { o: 0 });
  [0, 1, 2].forEach(i => mk('rect', { x: X(4 + 13 * i) + 3, y: y - h / 2 + 9, width: 13 * k - 6, height: h - 18, rx: 8, fill: mix(COL.board, COL.whole, .45), stroke: COL.whole, 'stroke-width': 3 }, g.due));
  g.boxes = G(g, { o: 0 }); g.hi = []; g.lo = [];
  BOXES.forEach(([nm, c, kind]) => {
    const e = G(g.boxes);
    e.rect = mk('rect', { x: X(c) - 4 * k, y: y - h / 2 + 9, width: 8 * k, height: h - 18, rx: 8, fill: kind === 'hi' ? mix(COL.board, COL.chalk, .5) : 'none', stroke: COL.chalk, 'stroke-width': 3, ...(kind === 'lo' ? { 'stroke-dasharray': '6 5' } : {}) }, e);
    T(e, nm, { x: X(c), y: y - h / 2 - 12, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
    e.cx = X(c); (kind === 'hi' ? g.hi : g.lo).push(e);
  });
  g.gat = G(g); g.ticks = GATCS.map(bp => put(path(G(g.gat), `M${X(bp)} ${y + h / 2 + 4}V${y + h / 2 + 34}`, { stroke: COL.int, 'stroke-width': 5, 'stroke-linecap': 'round' }).parentNode, { o: 0 }));
  return g;
}
// a DnaA molecule on a box: pink disc with A; atp: yellow ring (DnaA–ATP)
function dnaAdot(p, x, y, { atp = true, r = 17 } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: mix(COL.board, PROT, .4), stroke: atp ? COL.int : PROT, 'stroke-width': atp ? 4 : 3 }, g);
  T(g, 'A', { y: r * .38, size: r * 1.1, fill: PROT, weight: 700, anchor: 'middle' });
  return g;
}

/* ---------- a DNA stretch with a bubble: two strands y ± g between x0 and x1, opened over cx ± h by up to amp ---------- */
function openBub(p, cx, y, { x0 = 80, x1 = 880, g = 15, amp = 70, col = COL.chalk } = {}) {
  const grp = G(p), L = G(grp);
  grp.set = (h, a = amp * Math.min(1, h / 60)) => {
    L.replaceChildren();
    const off = (x, s) => (h < 1 || Math.abs(x - cx) >= h) ? s * g : s * (g + a * (1 - ((x - cx) / h) ** 2));
    [-1, 1].forEach(s => { let d = ''; for (let x = x0; x <= x1; x += 6) d += `${d ? 'L' : 'M'}${x} ${(y + off(x, s)).toFixed(1)}`; path(L, d, { stroke: col, 'stroke-width': 7, 'stroke-linejoin': 'round' }); });
    let r = ''; for (let x = x0 + 8; x < x1; x += 18) if (Math.abs(x - cx) >= h) r += `M${x} ${y - g}V${y + g}`;
    path(L, r, { stroke: COL.dim, 'stroke-width': 2.5 });
  };
  grp.set(0);
  return grp;
}

/* ---------- DnaA filament with the DNA wrapped around it (steps 1–2): an arch of DNA over a ring of ten DnaA, the DUE at the right ---------- */
const AX = 620, AB = 640, AR = 190, BX = 1260;
function archScene(p, k = 1) {
  const g = G(p), due = G(g, { o: 0 }), dna = G(g), cl = G(g);
  mk('rect', { x: BX - 150, y: AB - 34, width: 300, height: 68, rx: 20, fill: mix(COL.board, COL.whole, .4), stroke: COL.whole, 'stroke-width': 3 }, due);
  g.due = due;
  g.k = kk => {
    dna.replaceChildren();
    const d = `M80 ${AB}H${AX - AR}A${AR} ${Math.max(.1, AR * kk)} 0 0 1 ${AX + AR} ${AB}H1000`;
    path(dna, d, { stroke: COL.chalk, 'stroke-width': 25, 'stroke-linejoin': 'round' });
    path(dna, d, { stroke: COL.board, 'stroke-width': 11, 'stroke-linejoin': 'round' });
  };
  g.bub = openBub(g, BX, AB, { x0: 1000, x1: 1520, g: 9, amp: 60 });
  const cp = i => [AX + 66 * Math.cos(rad(i * 36 - 90)), 585 + 66 * Math.sin(rad(i * 36 - 90))];
  path(cl, Array.from({ length: 10 }, (_, i) => `${i ? 'L' : 'M'}${cp(i).join(' ')}`).join('') + 'Z', { stroke: PROT, 'stroke-width': 5 });
  for (let i = 0; i < 10; i++) {
    const [x, y] = cp(i);
    const e = G(cl, { x, y });
    mk('circle', { r: 19, fill: mix(COL.board, PROT, .4), stroke: COL.int, 'stroke-width': 4 }, e);
    T(e, 'A', { y: 7, size: 21, fill: PROT, weight: 700, anchor: 'middle' });
  }
  g.cl = cl;
  g.k(k);
  return g;
}

/* ---------- GATC duplex with methyl marks: duplex() plus the places of the A on each strand ---------- */
function dupGATC(p, x, y, col, { dx = 120, gap = 250, r = 24 } = {}) {
  const d = duplex(p, 'GATC', x, y, .0, { dx, gap, r, t1: .0, col, ends: true }), by = r + 46;
  d.A = { top: [d.top.xAt(1) + r + 12, y + by], bot: [d.bot.xAt(1) + r + 12, y + gap - by] };
  return d;
}
function methyl(p, [x, y], t0, label = false) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: 9, fill: '#fff', stroke: COL.board, 'stroke-width': 2 }, g);
  if (label) T(g, 'CH₃', { x: 16, y: 7, size: 21, fill: COL.chalk, weight: 700 });
  if (t0 != null) pop(g, t0);
  return g;
}

/* ---------- a table rows block on the right: stage, problem, solution, who (appear one by one) ---------- */
function tbl(p, x, y0, items) {
  let y = y0;
  return items.map(([stage, prob, sol, who]) => {
    const g = G(p, { o: 0 });
    if (stage) { T(g, stage, { x, y, size: 26, fill: COL.int, weight: 700 }); y += 34; }
    T(g, prob, { x: x + 22, y, size: 22, fill: COL.dim, weight: 500 });
    T(g, '→ ' + sol, { x: x + 22, y: y + 30, size: 24, fill: COL.chalk, weight: 700 });
    T(g, who, { x: x + 22, y: y + 58, size: 22, fill: PROT, weight: 700 });
    y += 94;
    return g;
  });
}
// the fork for the whole-fork beats
const forkPic = (p, o = {}) => fork(p, 540, 400, .3, { xEnd: 900, A: 32, P: 80, n: 5, back: 300, spread: 120, hel: 'DnaB', ...o });

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Старт в oriC и вилка целиком', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 11', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Старт в oriC и вилка целиком', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'как клетка запускает репликацию и собирает вилку', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['oric', 'oriC: одно место на кольце', (m) => {
    const p = panel(0), cx = 330, cy = 290, R = 140, rb = oriRibbon(p, 160, 690);
    const ring = mk('circle', { cx, cy, r: R, fill: 'none', stroke: COL.chalk, 'stroke-width': 9 }, p); put(ring, { o: 0 }); show(ring, .3);
    say(p, 'хромосома', cx, cy - 4, .5, { size: 30, weight: 700 });
    say(p, `≈ 4${NB}600${NB}000 п.н.`, cx, cy + 36, .8, { size: 26, fill: COL.dim });
    const [ox, oy] = ringPt(cx, cy, R, 180), d = G(p, { o: 0 });
    mk('circle', { cx: ox, cy: oy, r: 11, fill: COL.int }, d); show(d, m('ori'));
    line(p, 'oriC', ox + 40, oy + 34, m('ori'), COL.int, 36, 'start', 700);
    put(rb, { o: 0 }); show(rb, m('zoom'));
    [160, 1440].forEach(x => { const l = path(p, `M${ox} ${oy + 14}L${x} 650`, { stroke: COL.int, 'stroke-width': 3, 'stroke-dasharray': '10 8' }); put(l, { o: 0 }); show(l, m('zoom')); });
    hBracket(p, rb.x0, rb.x0 + rb.W, 750, '245 пар нуклеотидов', COL.int, m('zoom', 1), { up: false });
    const a = pill(p, 'дважды за цикл → лишняя копия части генома', NO, 1050, 210, m('why'), 28);
    const b = pill(p, 'ни разу → клетка не разделится', NO, 1050, 300, m('why', 3.6), 28);
    pill(p, 'старт — цепочка проверок', DNA, 1050, 420, m('why', 7.5), 30);
  }],
  ['sites', 'Что записано в oriC', (m) => {
    const p = panel(0), y = 470, rb = oriRibbon(p, 160, y);
    const R2 = rb.hi.map(e => dnaAdot(p, e.cx, y - 104)), L2 = rb.lo.map(e => dnaAdot(p, e.cx, y - 104));
    const hiP = pill(p, 'высокоаффинные R1, R2, R4: DnaA в АТФ- и АДФ-форме, заняты почти весь цикл', PROT, 800, 160, m('hi'), 26);
    const loP = pill(p, 'низкоаффинные: только DnaA–АТФ, и только когда его накопилось достаточно', COL.int, 800, 160, m('lo'), 26);
    put(rb, { o: 0 }); show(rb, .3);
    say(p, 'DnaA-боксы · консенсус TTATCCACA', 800, 255, m('a'), { size: 28, fill: COL.chalk, weight: 700 });
    show(rb.boxes, m('a'), .6);
    R2.forEach((e, i) => show(e, m('hi', i * .4), .4));
    L2.forEach((e, i) => show(e, m('lo', 1 + i * .5), .4));
    rb.hi.forEach(e => tw(e.rect, { c_stroke: PROT }, m('hi'), .5)); rb.lo.forEach(e => tw(e.rect, { c_stroke: COL.int }, m('lo', 1), .5));
    hide(hiP, m('lo', -.3), .3); hide(loP, m('due', -.5), .4);
    show(rb.due, m('due'), .6);
    const dueP = pill(p, 'DUE: 3 × 13 п.н., богат A и T', COL.whole, 400, 640, m('due', .4), 28);
    say(p, 'положения участков на ленте условны', 800, 800, m('a'), { size: 22, fill: COL.dim, weight: 500 });
    rb.ticks.forEach((t, i) => show(t, m('gatc', i * .25), .3));
    pill(p, 'GATC ≈ 11 сайтов: метки для Dam-метилазы', COL.int, 1050, 640, m('gatc', .4), 28);
  }],
  ['q1', 'Быстрая проверка', () => {
    const p = panel(0), y = 330, rb = oriRibbon(p, 160, y);
    put(rb.due, { o: 1 }); put(rb.boxes, { o: 1 }); rb.ticks.forEach(t => put(t, { o: 1 }));
    say(p, 'oriC · 245 п.н.', 800, 190, .2, { size: 30, fill: COL.dim, weight: 600 });
    S.picks = [{ el: rb.boxes, box: [rb.X(48), y - 62, 190 * rb.k, 96], label: 'DnaA-боксы' }, { el: rb.due, box: [rb.X(1), y - 44, 46 * rb.k, 88], label: 'DUE' },
      { el: rb.gat, box: [rb.x0, y + 38, rb.W, 44], label: 'GATC-сайты' }];
  }, { ask: done => quiz(BAND, [{
    id: 'c-due', prompt: ['Какой участок oriC расплавится первым? Нажмите на него.'],
    build: pickEls(S.picks, 1, 'DUE: он богат парами A–T, а в них всего две водородные связи, и разойтись ему легче всего.',
      i => i === 0 ? 'DnaA-боксы — места посадки белка, а не участок, который плавится.' : 'GATC-сайты — метки для Dam-метилазы, они расплавлением не занимаются.'),
  }], done) }],
  ['bonds', 'Почему плавится DUE', (m) => {
    const p = panel(0), x0 = 260, N = 39, dx = 20;
    pill(p, 'DUE: три повтора по 13 п.н. = 39 пар', COL.whole, 800, 90, .3, 28);
    const row = (y, k, col, t, lab) => {
      line(p, lab, x0 - 20, y - 52, t, col, 28, 'start', 700);
      [-34, 34].forEach(s => { const e = path(p, `M${x0} ${y + s}H${x0 + N * dx}`, { stroke: COL.chalk, 'stroke-width': 7 }, { d: 0 }); draw(e, t, 1.2); });
      let r = ''; for (let i = 0; i < N; i++) for (let j = 0; j < k; j++) r += `M${x0 + 10 + i * dx + (j - (k - 1) / 2) * 6} ${y - 26}V${y + 26}`;
      const e = path(p, r, { stroke: col, 'stroke-width': 3 }, { d: 0 }); draw(e, t + .5, 3);
    };
    row(300, 2, COL.nat, m('at'), '39 пар A–T: по 2 связи');
    const c1 = T(p, '0', { x: 1280, y: 330, size: 100, fill: COL.nat, weight: 700, anchor: 'end', o: 0 }); show(c1, m('at'));
    say(p, 'связей', 1300, 330, m('at'), { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
    prog(u => { c1.textContent = String(Math.round(78 * u)); }, m('at') + .5, 3, lin);
    colorLine(p, [[`39 × 2 = `], ['78', COL.nat]], 1200, 380, m('at', 4.4), { size: 34 });
    row(560, 3, COL.irr, m('gc'), 'пары G–C: по 3 связи');
    const c2 = T(p, '0', { x: 1280, y: 590, size: 100, fill: COL.irr, weight: 700, anchor: 'end', o: 0 }); show(c2, m('gc'));
    say(p, 'связей', 1300, 590, m('gc'), { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
    prog(u => { c2.textContent = String(Math.round(117 * u)); }, m('gc') + .5, 3, lin);
    colorLine(p, [[`39 × 3 = `], ['117', COL.irr]], 1200, 640, m('gc', 4.4), { size: 34 });
    pill(p, 'реальная прочность зависит и от стекинга соседних пар, но направление то же', COL.dim, 800, 780, m('note'), 26);
    pill(p, 'AT-богатый участок плавится первым', OK, 800, 850, m('note', 3.5), 28);
  }],
  ['gatc', 'Сколько GATC ожидалось', (m) => {
    const p = panel(0), y = 500, rb = oriRibbon(p, 160, y);
    put(rb, { o: 0 }); show(rb, .3); put(rb.due, { o: 1 }); put(rb.boxes, { o: 1 });
    colorLine(p, [[`4⁴ = `], ['256', COL.int], [' — столько пар в среднем на один сайт из 4 нуклеотидов']], 800, 200, 1.5, { size: 32 });
    colorLine(p, [[`245 / 256 ≈ `], ['1', COL.int], [' сайт ожидался бы случайно']], 800, 290, m('exp'), { size: 40 });
    show(rb.ticks[5], m('exp', 1.2), .5);
    const a = line(p, 'ожидалось ≈ 1', rb.X(112), y + 100, m('exp', 1.2), COL.int, 26, 'middle', 700);
    rb.ticks.forEach((t, i) => i !== 5 && show(t, m('all', i * .25), .3));
    hide(a, m('all'), .4);
    colorLine(p, [[`на самом деле: `], ['≈ 11', OK], [' — больше ожидаемого в 10 с лишним раз']], 800, 640, m('all', .5), { size: 38 });
    pill(p, 'не случайно: для чего — в разговоре о запрете повторного старта', DNA, 800, 760, m('why', 1.2), 28);
  }],
  ['fil', 'Шаг 1: DnaA строит филамент', (m) => {
    const p = panel(0), y = 400, rb = oriRibbon(p, 160, y), sc = G(p);
    put(rb, { o: 0 }); show(rb, .3); put(rb.due, { o: 1 }); put(rb.boxes, { o: 1 }); rb.ticks.forEach(t => put(t, { o: 1 }));
    pill(p, 'шаг 1', DNA, 800, 110, m('s1'), 30);
    const allBx = [...rb.hi, ...rb.lo].sort((a, b) => a.cx - b.cx), dots = {};
    allBx.forEach(e => { dots[e.cx] = dnaAdot(p, e.cx, y - 104); });
    rb.hi.forEach((e, i) => show(dots[e.cx], m('hi', i * .3), .4));
    const hp = pill(p, 'сильные боксы заняты', COL.chalk, 800, 190, m('hi'), 26);
    rb.lo.forEach((e, i) => show(dots[e.cx], m('lo', i * .35), .4));
    const lp = pill(p, 'слабые: когда DnaA–АТФ достаточно', COL.int, 800, 190, m('lo'), 26); hide(hp, m('lo', -.1), .3);
    const xs = allBx.map(e => e.cx);
    const ch = path(p, xs.map((x, i) => `${i ? 'L' : 'M'}${x} ${y - 104}`).join(''), { stroke: PROT, 'stroke-width': 7 }, { d: 0 }); draw(ch, m('fil'), 1.6);
    hide(lp, m('fil', -.1), .3);
    pill(p, '10–20 DnaA–АТФ → правая спиральная нить (филамент)', PROT, 800, 190, m('fil'), 28);
    // the wrap: crossfade to the arch scene
    const ar = archScene(p, 0); put(ar, { o: 0 });
    [rb, ...Object.values(dots), ch].forEach(e => hide(e, m('wrap', -.3), .5));
    show(ar, m('wrap', -.3), .5);
    prog(u => ar.k(u), m('wrap'), 2.2, io);
    pill(p, 'ДНК обвивается вокруг филамента', PROT, 700, 330, m('wrap', 1), 28);
  }],
  ['melt', 'Шаг 2: плавится DUE', (m) => {
    const p = panel(0), ar = archScene(p, 1);
    put(ar, { o: 0 }); show(ar, .3);
    pill(p, 'шаг 2', DNA, 200, 110, .3, 30);
    pill(p, 'филамент DnaA', PROT, AX, 395, .5, 26);
    line(p, 'DUE', BX, AB + 112, .5, COL.whole, 28, 'middle', 700);
    const w = line(p, 'обвивание добавляет положительный супервиток: W растёт', 800, 170, m('w'), COL.int, 32, 'middle', 700);
    colorLine(p, [['L = T + W: ', COL.chalk], ['L не меняется', COL.chalk]], 800, 250, m('ltw'), { size: 42 });
    colorLine(p, [['W ↑', COL.int], ['  →  ', COL.chalk], ['T ↓', COL.whole], ['  где-то спираль раскручивается', COL.chalk]], 800, 320, m('ltw', 6.5), { size: 34 });
    tw(ar.due, { o: 1 }, m('due'), .5);
    pulse(ar.due, m('due'), 1.0);
    hide(w, m('ltw'), .3);
    pill(p, 'отрицательная суперспирализация (гираза) помогает', DNA, 1130, 400, m('gyr'), 26);
    prog(u => ar.bub.set(95 * u), m('open'), 1.8, io);
    pill(p, 'открытый комплекс', OK, BX, 500, m('open', 1), 28);
  }],
  ['q2', 'Быстрая проверка', () => {
    const p = panel(0), b = openBub(p, 480, 500, { x0: 80, x1: 880 });
    b.set(110);
    endLab(p, '3′', 50, 480, .2); endLab(p, '5′', 910, 480, .2); endLab(p, '5′', 50, 540, .2); endLab(p, '3′', 910, 540, .2);
    say(p, 'открытый комплекс: DUE расплавлен', 480, 340, .3, { size: 30, fill: COL.dim, weight: 600 });
    PB(p, '?', 480, 410, 70, 56, 36); PB(p, '?', 480, 590, 70, 56, 36);
