'use strict';
const CHAPTER = { number: 4, title: 'Формы ДНК и необычные структуры', minutes: 13, language: 'ru', next: '../ch05/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js) ---------- */
const lerp = (a, b, q) => a + (b - a) * q;
const dec = v => (v < 0 ? '−' : '') + String(Math.round(Math.abs(v) * 10) / 10).replace('.', ',');
const polyD = pts => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L');
// A dashed frame (rect) hidden until t0.
function frameR(p, x, y, w, h, color, t0, { dash = true, fill = 'none', o = 1 } = {}) {
  const e = mk('rect', { x, y, width: w, height: h, rx: 12, fill, stroke: color, 'stroke-width': 3, ...(dash ? { 'stroke-dasharray': '9 7' } : {}) }, p);
  put(e, { o: 0 }); if (t0 != null) tw(e, { o }, t0, .5);
  return e;
}
// A helix that changes shape: helixSide redrawn in its group with options lerped from a to b (same number of pairs, centred on
// cx); .at(q) is the shape at q, for prog().
function helixMorph(p, cx, y0, pairs, a, b) {
  const g = G(p, { o: 0 });
  g.at = q => {
    const o = {};
    for (const k in a) o[k] = typeof a[k] === 'number' ? lerp(a[k], b[k], q) : a[k];
    const len = pairs * o.P / o.n;
    g.replaceChildren();
    helixSide(g, cx - len / 2, y0, len, null, o);
  };
  g.at(0);
  return g;
}
// Sugar ring seen edge-on, an "envelope": O4′ and C1′–C4′ on a flat ellipse, C2′ lifted by u2 or C3′ by u3 (0..1) out of the
// plane; C5′ with its phosphate on C4′, the 3′ phosphate on C3′, a dashed P–P line with its label. .set(u2, u3, label) redraws.
// oh: the 2′ substituent drawn, OH (ribose) or H.
function pucker(p, cx, cy, { s = 1, oh = null } = {}) {
  const g = G(p, { x: cx, y: cy, s, o: 0 });
  mk('path', { d: 'M0 -60L190 -10L110 70L-110 70L-190 -10Z', fill: COL.dim, 'fill-opacity': .14, stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '6 6' }, g);
  const L = G(g);
  g.set = (u2, u3, lab = '') => {
    L.replaceChildren();
    const A = { O: [0, -60], C1: [190, -10], C2: [110, 70 - 80 * u2], C3: [-110, 70 - 80 * u3], C4: [-190, -10] };
    const C5 = [-250, -110], P5 = [-250, -215], P3 = [-150, 190 + 25 * u2 - 75 * u3];
    const bond = (a, b, c = COL.chalk, w = 5) => path(L, `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, { stroke: c, 'stroke-width': w });
    bond(P5, P3, COL.dim, 3).setAttribute('stroke-dasharray', '8 8');
    bond(A.C4, C5); bond(C5, P5); bond(A.C3, P3);
    ['O', 'C1', 'C2', 'C3', 'C4'].forEach((k, i, ks) => bond(A[k], A[ks[(i + 1) % 5]]));
    if (oh != null) {
      bond(A.C2, [A.C2[0] + 30, A.C2[1] + 52], COL.chalk, 4);
      T(L, oh ? 'OH' : 'H', { x: A.C2[0] + 34, y: A.C2[1] + 86, size: 28, fill: oh ? RNA : COL.dim, weight: 700, anchor: 'middle' });
    }
    const up = u2 > u3 + .3 ? 'C2' : u3 > u2 + .3 ? 'C3' : '';
    const labs = { O: ['O4′', 0, -80, 'middle'], C1: ['C1′', 24, 9, 'start'], C2: ['C2′', 24, 9, 'start'], C3: ['C3′', 20, 34, 'start'], C4: ['C4′', -24, 26, 'end'] };
    for (const k in A) {
      mk('circle', { cx: A[k][0], cy: A[k][1], r: k === 'O' ? 13 : 11, fill: k === up ? DNA : k === 'O' ? COL.board : COL.chalk, stroke: k === up ? DNA : COL.chalk, 'stroke-width': 4 }, L);
      const [str, dx, dy, an] = labs[k];
      T(L, str, { x: A[k][0] + dx, y: A[k][1] + dy, size: 24, fill: k === up ? DNA : COL.dim, weight: 700, anchor: an });
    }
    T(L, 'C5′', { x: C5[0] - 22, y: C5[1] + 9, size: 24, fill: COL.dim, weight: 700, anchor: 'end' });
    [P5, P3].forEach(([x, y]) => {
      mk('circle', { cx: x, cy: y, r: 24, fill: CARD, stroke: COL.dim, 'stroke-width': 3.5 }, L);
      T(L, 'P', { x, y: y + 9, size: 26, fill: COL.chalk, weight: 700, anchor: 'middle' });
    });
    if (lab) T(L, lab, { x: (P5[0] + P3[0]) / 2 - 30, y: (P5[1] + P3[1]) / 2 + 10, size: 32, fill: DNA, weight: 700, anchor: 'end' });
  };
  return g;
}
// A vertical scale bar len px long at x from y, its label below.
function scaleBar(p, x, y, len, label, t0) {
  const g = G(p, { o: 0 });
  path(g, `M${x - 10} ${y}H${x + 10}M${x} ${y}V${y + len}M${x - 10} ${y + len}H${x + 10}`, { stroke: COL.chalk, 'stroke-width': 3 });
  T(g, label, { x, y: y + len + 34, size: 24, fill: COL.chalk, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// An arc of radius R from angle a0 to a1 (degrees, clockwise positive, 0 = right), drawn as two halves so spans up to 360° work.
const arcD = (cx, cy, R, a0, a1) => {
  const pt = a => `${(cx + R * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(cy + R * Math.sin(a * Math.PI / 180)).toFixed(1)}`;
  const sw = a1 > a0 ? 1 : 0;
  return `M${pt(a0)}A${R} ${R} 0 0 ${sw} ${pt((a0 + a1) / 2)}A${R} ${R} 0 0 ${sw} ${pt(a1)}`;
};
// A turn dial (view along the axis): pair spokes appear one per step of deg degrees (negative: counterclockwise), an arc collects
// the total turn and the counter below reads "k × lab = total°". The ring shows at tRing, the turn runs from t0 for dur.
function turnDial(p, cx, cy, R, n, deg, lab, t0, dur, tRing) {
  const ringEl = mk('circle', { cx, cy, r: R, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '6 8' }, p);
  put(ringEl, { o: 0 }); show(ringEl, tRing);
  for (let i = 0; i <= n; i++) {
    const a = (-90 + deg * i) * Math.PI / 180, b = RUNG_SEQ[i % 10], g = G(p, { o: 0 });
    path(g, `M${cx} ${cy}L${(cx + (R - 14) * Math.cos(a)).toFixed(1)} ${(cy + (R - 14) * Math.sin(a)).toFixed(1)}`, { stroke: BASE[b], 'stroke-width': 7 });
    show(g, i ? t0 + dur * i / n - .15 : tRing, .2);
    if (i < n) tw(g, { o: .3 }, t0 + dur * (i + 1) / n, .2);
  }
  const arc = path(p, '', { stroke: DNA, 'stroke-width': 8 });
  const tip = mk('circle', { r: 0, fill: DNA }, p);
  const txt = T(p, '', { x: cx, y: cy + R + 66, size: 32, weight: 700, anchor: 'middle' });
  prog(q => {
    const a = -90 + q * n * deg, k = Math.floor(q * n + 1e-6);
    arc.setAttribute('d', arcD(cx, cy, R + 16, -90, a));
    tip.setAttribute('cx', cx + (R + 16) * Math.cos(a * Math.PI / 180)); tip.setAttribute('cy', cy + (R + 16) * Math.sin(a * Math.PI / 180)); tip.setAttribute('r', 9);
    txt.textContent = `${k} × ${lab} = ${dec(k * deg)}°`;
  }, t0, dur, lin);
  return txt;
}
// A small circular arrow around (x, y): an arc and its head; ccw turns it the other way.
function turnMark(p, x, y, r, color, t0, ccw = false) {
  const g = G(p, { x, y, o: 0 }), a0 = ccw ? 60 : -150, a1 = ccw ? -210 : 120, rad = a1 * Math.PI / 180;
  path(g, arcD(0, 0, r, a0, a1), { stroke: color, 'stroke-width': 4 });
  const hx = r * Math.cos(rad), hy = r * Math.sin(rad), tx = -Math.sin(rad) * (ccw ? -1 : 1), ty = Math.cos(rad) * (ccw ? -1 : 1);
  mk('path', { d: `M${hx + tx * 12} ${hy + ty * 12}L${hx - ty * 8 - tx * 4} ${hy + tx * 8 - ty * 4}L${hx + ty * 8 - tx * 4} ${hy - tx * 8 - ty * 4}Z`, fill: color }, g);
  if (t0 != null) show(g, t0);
  return g;
}
// A flat plate of a G-quadruplex seen from the side (a rhombus), centred on (x, y).
function plate(p, x, y, { w = 190, h = 44 } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('path', { d: `M${-w} 0L0 ${-h}L${w} 0L0 ${h}Z`, fill: mix(COL.board, BASE.G, .22), stroke: BASE.G, 'stroke-width': 3 }, g);
  return g;
}
// An ion as a ringed disc with its symbol.
function ion(p, str, x, y, { r = 22 } = {}) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: CARD, stroke: COL.chalk, 'stroke-width': 3 }, g);
  T(g, str, { y: 8, size: 22, fill: COL.chalk, weight: 700, anchor: 'middle' });
  return g;
}
// Text upright inside a parent rotated by rot degrees: the text element turned back about its parent's origin.
const upright = (text, rot, c) => put(text, { r: -rot, x: c * Math.sin(rot * Math.PI / 180), y: c * Math.cos(rot * Math.PI / 180) });

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [

  ['sugar', 'Изгиб сахара', (m) => {

    // two neighbouring pairs on the right: their spacing follows the P–P distance

    const state = (u2, u3) => {

    // rise: ten steps of 3.38 Å make one pitch
