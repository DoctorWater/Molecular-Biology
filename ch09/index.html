<script>
'use strict';
const CHAPTER = { number: 9, title: 'Скользящий зажим и хеликаза', minutes: 13, language: 'ru', next: '../ch10/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — betaRing, clampSide, clampLoader, dnaBRing) ---------- */
const NB = ' ';
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
const seg1 = (p, x1, y1, x2, y2, c = COL.dim, w = 4) => path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: c, 'stroke-width': w });
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });
const cross = (p, x, y, t0, k = 1, c = NO) => {
  const g = G(p, { x, y, o: 0, s: k });
  path(g, 'M-26 -26L26 26M26 -26L-26 26', { stroke: c, 'stroke-width': 8 });
  if (t0 != null) show(g, t0, .3);
  return g;
};
function nuc(p, x, y, b, col = DNA, link = 0, r = 20) {
  const g = G(p, { x, y });
  g.link = link ? path(g, `M${-link + r} 0H${-r}`, { stroke: col, 'stroke-width': 6 }) : null;
  mk('circle', { r, fill: BASE[b] }, g);
  T(g, b, { y: r * .4, size: r * 1.05, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
const ring = (p, x, y, r = 30, c = NO) => put(mk('circle', { cx: x, cy: y, r, fill: 'none', stroke: c, 'stroke-width': 5 }, p), { o: 0 });
function counterAt(p, x, y, t0, unit, { size = 110, fill = DNA, txt = '0' } = {}) {
  const e = T(p, txt, { x, y, size, fill, weight: 700, anchor: 'end', o: 0 });
  show(e, t0);
  say(p, unit, x + 24, y, t0, { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
  return e;
}
// A one-line note in the middle of the stage that replaces the previous one.
const noteAt = (p, str, y, t0, t1, fill = COL.chalk, size = 32) => {
  const e = say(p, str, 800, y, t0, { size, fill, weight: 700 });
  if (t1 != null) hide(e, t1, .4);
  return e;
};
// A thin 2-strand chain of beads or a fork scene helper for the fork scenes of this chapter.
const FK = { xEnd: 1500, A: 40, P: 100, n: 6, back: 330, spread: 130, hel: null, tail: 110 };
const ellipseBand = (p, X, Y, r1, r2, c, o = .5) => path(p, `M${-r2} 0a${r2} ${r2} 0 1 0 ${2 * r2} 0a${r2} ${r2} 0 1 0 ${-2 * r2} 0ZM${-r1} 0a${r1} ${r1} 0 1 0 ${2 * r1} 0a${r1} ${r1} 0 1 0 ${-2 * r1} 0Z`, { fill: c, 'fill-opacity': o, 'fill-rule': 'evenodd', stroke: 'none' }, { x: X, y: Y, o: 0 });

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Скользящий зажим и хеликаза', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 9', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Скользящий зажим и хеликаза', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'два белковых кольца на вилке', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['proc', 'Процессивность', (m) => {
    const p = panel(0), x0 = 200, W = 1200, yD = 290;
    // α alone: ≈ 10 nt and it falls off
    say(p, 'α-субъединица Pol III одна', 90, 205, .3, { size: 28, fill: COL.chalk, weight: 600, anchor: 'start' });
    path(p, `M300 ${yD + 24}H1000`, { stroke: COL.chalk, 'stroke-width': 6 });
    const al = enzyme(p, 'α', 318, yD - 36, null, { w: 90, h: 56, size: 30 });
    put(al, { o: 0 }); show(al, .3);
    for (let i = 0; i < 10; i++) {
      const b = mk('circle', { cx: 330 + 28 * i, cy: yD + 4, r: 11, fill: DNA }, p);
      put(b, { o: 0 }); show(b, .8 + i * .42, .2);
      tw(al, { x: 318 + 28 * (i + 1) }, .8 + i * .42, .3);
    }
    tw(al, { y: yD + 130, o: 0, r: 25 }, 5.4, .9);
    say(p, 'отвалилась: ≈ 10 нт за посадку', 760, yD + 90, 5.6, { size: 26, fill: NO, weight: 700 });
    pill(p, 'процессивность — число нуклеотидов за одно связывание с ДНК', PROT, 800, 140, m('def'), 26);
    // the same enzyme on a 2000 nt fragment
    const y1 = 480, y2 = 780;
    say(p, 'фрагмент Оказаки: 2000 нт', x0, y1 - 40, m('bar'), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    const track = (y, t) => {
      const r = mk('rect', { x: x0, y: y - 16, width: W, height: 32, rx: 10, fill: CARD, stroke: COL.dim, 'stroke-width': 2 }, p);
      put(r, { o: 0 }); show(r, t);
      return mk('rect', { x: x0, y: y - 16, width: 0, height: 32, rx: 10, fill: DNA }, p);
    };
    const f1 = track(y1, m('bar'));
    const hop = enzyme(p, 'α', x0, y1 - 44, null, { w: 80, h: 48, size: 26 });
    put(hop, { o: 0 }); show(hop, m('bar', .5));
    colorLine(p, [['2000 / 10 = '], ['200', DNA]], 800, 560, m('cnt'), { size: 40 });
    const c = counterAt(p, 640, 660, m('cnt'), 'посадок', { size: 90 });
    prog(q => {
      const n = Math.min(200, Math.floor(q * 201));
      c.textContent = n; f1.setAttribute('width', W * n / 200);
      put(hop, { x: x0 + W * n / 200 + 20, y: y1 - 44 - 22 * Math.abs(Math.sin(q * 200 * Math.PI)) });
    }, m('cnt'), 4.2, lin);
    say(p, 'Pol III на β-кольце: > 50 000 нт', x0, y2 - 44, m('ring'), { size: 26, fill: PROT, weight: 700, anchor: 'start' });
    const f2 = track(y2, m('ring'));
    const rd = enzyme(p, 'α + β', x0, y2 - 44, null, { w: 120, h: 48, size: 24 });
    put(rd, { o: 0 }); show(rd, m('ring', .4));
    prog(q => { f2.setAttribute('width', W * q); put(rd, { x: x0 + W * q + 40 }); }, m('ring', .6), 5, io);
    pill(p, 'одна посадка вместо двухсот', OK, 800, 850, m('one'), 30);
    pill(p, 'хеликаза расплетает ДНК', PROT, 1230, 660, m('hel'), 26);
  }],
  ['ring', 'β-кольцо', (m) => {
    const p = panel(0), X = 540, Y = 480, g = betaRing(p, X, Y, .3), x0 = 940;
    pill(p, 'β-кольцо — скользящий зажим', PROT, X, 150, .5, 30);
    const bl = say(p, 'β', X + 280, Y + 12, m('dim'), { size: 36, fill: PROT, weight: 700 }), br = say(p, 'β', X - 280, Y + 12, m('dim', .3), { size: 36, fill: COL.chalk, weight: 700 });
    say(p, 'димер β₂: две одинаковые молекулы', x0, 260, m('dim'), { size: 30, weight: 700, anchor: 'start' });
    say(p, 'ген dnaN, каждая ≈ 41 кДа', x0, 304, m('dim', .8), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    g.labs.forEach((e, i) => show(e, m('dom', .3 + i * .25), .3));
    show(g.arr, m('dom', 2.2), .5);
    say(p, 'по три домена A, B, C в каждой', x0, 380, m('dom'), { size: 30, weight: 700, anchor: 'start' });
    say(p, 'голова к хвосту: 6 доменов в кольце', x0, 424, m('dom', 2.2), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    const dna = G(p, { x: X, y: Y, o: 0 });
    mk('circle', { r: 90, fill: mix(COL.board, DNA, .3), stroke: DNA, 'stroke-width': 4 }, dna);
    T(dna, 'ДНК', { y: -4, size: 36, fill: DNA, weight: 700, anchor: 'middle' });
    T(dna, '≈ 20 Å', { y: 38, size: 28, fill: COL.chalk, weight: 600, anchor: 'middle' });
    show(dna, m('size'), .6);
    hBracket(p, X - 157, X + 157, 735, 'отверстие ≈ 35 Å', COL.chalk, m('size', 2.6), { up: false });
    const gap = ellipseBand(p, X, Y, 90, 157, COL.int);
    show(gap, m('gap'), .5); pulse(gap, m('gap'), 1.04);
    [-1, 1].forEach(s => say(p, '7,5', X + s * 124, Y + 8, m('gap', .5), { size: 24, fill: COL.int, weight: 700 }));
    colorLine(p, [['(35 − 20) / 2 = '], ['7,5 Å', COL.int]], x0, 530, m('gap', 1), { size: 38, anchor: 'start' });
    say(p, 'зазор с каждой стороны', x0, 574, m('gap', 1.4), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    show(g.plus, m('slide', 1.8), .6);
    say(p, 'кольцо не сжимает спираль, а скользит', x0, 660, m('slide'), { size: 30, weight: 700, anchor: 'start' });
    say(p, '12 α-спиралей выстилки, заряд «+»:', x0, 722, m('slide', 2), { size: 26, fill: COL.int, weight: 600, anchor: 'start' });
    say(p, 'притягивают остов ДНК, но не держат', x0, 760, m('slide', 2.2), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 170, w: 1000, cls: 'side', maxH: 640 }, [{
    id: 'c-ring', prompt: ['Посчитайте.'], build: blanks(Q_RING),
  }], done) }],
  ['pocket', 'Гидрофобный карман', (m) => {
    const p = panel(0), X = 520, Y = 480, K = 1.2, g = betaRing(p, X, Y, .3, { s: K });
    const dna = G(p, { x: X, y: Y });
    mk('circle', { r: 90 * K, fill: mix(COL.board, DNA, .3), stroke: DNA, 'stroke-width': 4 }, dna);
    T(dna, 'ДНК', { y: 11, size: 40, fill: DNA, weight: 700, anchor: 'middle' });
    g.labs.forEach(e => put(e, { o: 1 }));
    const [[ax, ay], [bx, by]] = g.pkPt, P0 = [X + ax * K, Y + ay * K], P1 = [X + bx * K, Y + by * K];
    show(g.pk[0], m('pk'), .4); pulse(g.pk[0], m('pk'), 1.3);
    say(p, 'гидрофобный карман', 1180, 250, m('pk'), { size: 32, fill: COL.int, weight: 700 });
    say(p, 'снаружи, между доменами B и C', 1180, 296, m('pk', .4), { size: 26, fill: COL.dim, weight: 600 });
    const partner = (lab, tIn, tOut, x, y, w = 190) => {
      const e = enzyme(p, lab, x + 320, y, null, { w, h: 60, size: 26 });
      put(e, { o: 0 });
      tw(e, { o: 1, x }, tIn, .5, out);
      if (tOut != null) tw(e, { o: 0 }, tOut, .3);
      return e;
    };
    const px = P0[0] + 110, py = P0[1];
    partner('Pol III (α)', m('p3'), m('p1', -.2), px, py);
    partner('Pol I', m('p1'), m('lig', -.2), px, py);
    partner('лигаза', m('lig'), m('muts', -.1), px, py);
    partner('MutS', m('muts'), m('two', -.2), px, py);
    // two partners at once
    show(g.pk[1], m('two'), .4);
    const a = partner('Pol III', m('two'), null, px, py), b = enzyme(p, 'Pol IV', P1[0] - 430, P1[1], null, { w: 190, h: 60, size: 26 });
    put(b, { o: 0 }); tw(b, { o: 1, x: P1[0] - 110 }, m('two', .6), .5, out);
    say(p, 'два кармана, два партнёра', 1180, 700, m('two'), { size: 30, weight: 700 });
    say(p, 'кольцо передаёт ДНК от одного к другому', 1180, 746, m('two', 1.6), { size: 26, fill: COL.dim, weight: 600 });
  }],
  ['loader', 'Загрузчик зажима', (m) => {
    const p = panel(0), X = 560, ld = clampLoader(p, X, 360, null, { s: 1 });
    const rg = betaRing(p, X, 585, .3, { s: .5 });
    put(ld, { o: 0 }); show(ld, m('who'), .6);
    pill(p, 'загрузчик зажима (clamp loader)', PROT, X, 70, m('who'), 28);
    say(p, 'β₂ сам не раскрывается', X, 745, .6, { size: 26, fill: COL.dim, weight: 600 });
    const x0 = 940, line = (str, y, t, c = COL.chalk) => say(p, str, x0, y, t, { size: 28, fill: c, weight: 600, anchor: 'start' });
    ld.tau.forEach((e, i) => pulse(e, m('tau', i * .25), 1.25));
    line('τ ×3: моторы, связывают и гидролизуют АТФ', 250, m('tau'));
    pulse(ld.dd, m('key'), 1.1); line('δ: «ключ», размыкает кольцо', 320, m('key'));
    pulse(ld.dp, m('dp'), 1.1); line('δ′: держит δ взаперти без АТФ', 390, m('dp'));
    pulse(ld.chi, m('chi'), 1.2); line('χ связывается с SSB, ψ крепит χ к τ', 460, m('chi'));
    const closed = say(p, 'нет АТФ: клешня закрыта', x0, 600, m('closed'), { size: 32, fill: NO, weight: 700, anchor: 'start' });
    const cl2 = line('δ′ прижимает δ, и та не дотягивается до кольца', 646, m('closed', .4), COL.dim);
    hide(closed, m('atp'), .4); hide(cl2, m('atp'), .4);
    ld.atp.forEach((a, i) => { put(a, { y: a.y0 - 50 }); tw(a, { o: 1, y: a.y0 }, m('atp', i * .25), .5, out); });
    ld.open(m('atp', .9), .9);
    say(p, 'АТФ связан: клешня открыта', x0, 600, m('atp'), { size: 32, fill: OK, weight: 700, anchor: 'start' });
    say(p, 'δ′ отошла, δ свободна', x0, 646, m('atp', .4), { size: 26, fill: COL.dim, weight: 600, anchor: 'start' });
    show(rg.pk[0], m('grab'), .3);
    rg.open(m('grab', .6), 1.1, 28);
    pulse(ld.dd, m('grab'), 1.2);
    say(p, 'δ хватает мономер за карман', x0, 730, m('grab'), { size: 28, fill: COL.chalk, weight: 700, anchor: 'start' });
    say(p, 'и рвёт одну из двух границ', x0, 768, m('grab', .5), { size: 28, fill: COL.chalk, weight: 700, anchor: 'start' });
    say(p, 'кольцо раскрывается само, как пружина', x0, 814, m('grab', 1.6), { size: 26, fill: COL.int, weight: 700, anchor: 'start' });
  }],
  ['energy', 'Откуда энергия', (m) => {
    const p = panel(0), xa = 560, W = 800, y1 = 400, y2 = 560;
    say(p, 'Что раскрывает кольцо?', 800, 150, .3, { size: 38, weight: 700 });
    pill(p, 'не АТФ', NO, 800, 230, m('not'), 34);
    say(p, 'связывание δ с β', 800, 300, m('not', 1.1), { size: 34, fill: OK, weight: 700 });
    const row = (y, lab, sub, t) => {
      say(p, lab, 90, y - 6, t, { size: 28, weight: 700, anchor: 'start' });
      say(p, sub, 90, y + 30, t + .3, { size: 22, fill: COL.dim, weight: 600, anchor: 'start' });
      const tr = mk('rect', { x: xa, y: y - 18, width: W + 40, height: 36, rx: 12, fill: CARD, stroke: COL.dim, 'stroke-width': 2 }, p);
      put(tr, { o: 0 }); show(tr, t);
      return mk('rect', { x: xa, y: y - 18, width: 0, height: 36, rx: 12, fill: PROT }, p);
    };
    const b2 = row(y2, 'δ + одиночный β', 'мутант, который не образует димер', m('mut'));
    const b1 = row(y1, 'δ + кольцо β₂', 'обычный димер', m('mut', 2.4));
    prog(q => { b1.setAttribute('width', 16 * q); b2.setAttribute('width', 800 * q); }, m('x50'), 1.6, io);
    pill(p, '≥ 50 раз прочнее', PROT, 1180, 480, m('x50', 1.6), 30);
    say(p, 'длина полосы — прочность связывания', xa, 452, m('x50', 1.6), { size: 22, fill: COL.dim, weight: 600, anchor: 'start' });
    hBracket(p, xa + 16, xa + 800, 625, 'эту разницу δ тратит на разрыв границы между мономерами', COL.int, m('diff'), { up: false, size: 26 });
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 170, w: 1000, cls: 'side', maxH: 640 }, [{
    id: 'c-energy', prompt: ['Откуда берётся энергия, раскрывающая β-кольцо?'],
    build: choice(['Из связывания δ с мономером β',
      'Из гидролиза АТФ субъединицами τ',
      'Из движения δ′, когда она отходит',
      'Энергия не нужна: кольцо раскрывается само'], 0,
    'Опыт с мутантным β: δ связывается с одиночным мономером в 50 раз прочнее, чем с кольцом. Эта разница оплачивает разрыв границы.',
    [null, 'АТФ только открывает загрузчик, освобождая δ; его гидролиз позже, когда ДНК уже внутри, заставляет загрузчик отпустить кольцо.',
      'δ′ только держит δ взаперти, пока нет АТФ. Энергии на разрыв границы она не даёт.',
      'Димер очень прочный и сам не раскрывается: нужна энергия связывания δ с β.']),
  }], done) }],
  ['cycle', 'Цикл загрузки', (m) => {
    const p = panel(0), SC = .9, yT = 732, yP = 708, xj = 1150, RO = 159;
    const steps = ['τ связывают АТФ, загрузчик открывается', 'δ слезает с δ′, садится на β, размыкает кольцо', 'ищет 3′-конец праймера на матрице',
      'праймер-матрица входит в канал, в щель кольца', 'ДНК запускает гидролиз АТФ', 'загрузчик меняет форму, отпускает β', 'кольцо защёлкивается вокруг ДНК',
      'загрузчик уходит, α-субъединица садится в карман'];
    const keys = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
    const L = steps.map((s, i) => say(p, `${i + 1}. ${s}`, 70, 190 + i * 66, .3, { size: 25, fill: COL.dim, weight: 600, anchor: 'start' }));
    keys.forEach((k, i) => {
      tw(L[i], { c_fill: DNA }, m(k), .3);
      tw(L[i], { c_fill: COL.chalk }, i < 7 ? m(keys[i + 1]) : m('why'), .3);
    });
    const back = G(p), dn = G(p);
    path(dn, `M800 ${yT}H1520`, { stroke: COL.chalk, 'stroke-width': 7 });
    path(dn, `M800 ${yP}H${xj}`, { stroke: DNA, 'stroke-width': 7 });
    let rungs = ''; for (let x = 820; x < xj; x += 20) rungs += `M${x} ${yP}V${yT}`;
    path(dn, rungs, { stroke: COL.dim, 'stroke-width': 2.5 });
    endLab(dn, '5′', 770, yP + 10, .4, DNA); endLab(dn, '3′', xj - 50, yP - 30, .4, DNA);
    endLab(dn, '3′', 770, yT + 40, .4); endLab(dn, '5′', 1550, yT + 10, .4);
    const front = G(p);
    const ld = clampLoader(p, 900, 290, null, { s: SC });
    put(ld, { o: 0 }); show(ld, .3);
    const rg = clampSide(back, front, 900, 290 + RO, .3, { rx: 22, ry: 66, sw: 12 });
    const mv = (x, y, t, dur) => { tw(ld, { x, y }, t, dur); rg.mv(x, y + RO, t, dur); };
    ld.open(m('s1'), .9);
    ld.atp.forEach((a, i) => { put(a, { y: a.y0 - 50 }); tw(a, { o: 1, y: a.y0 }, m('s1', .2 + i * .25), .5, out); });
    rg.open(m('s2'), .8, 30);
    const mk3 = G(p, { o: 0 });
    path(mk3, `M${xj} 480V790`, { stroke: COL.int, 'stroke-width': 3, 'stroke-dasharray': '9 7' });
    T(mk3, 'конец праймера', { x: xj + 36, y: 812, size: 24, fill: COL.int, weight: 700, anchor: 'start' });
    show(mk3, m('s3'), .4);
    mv(xj, 290, m('s3'), 1.8);
    mv(xj, 561, m('s4'), 2.2);

    mk('circle', { r: 26, fill: mix(COL.board, PROT, .45), stroke: PROT, 'stroke-width': 3 }, tp); T(tp, 'τ', { y: 10, size: 30, fill: PROT, weight: 700, anchor: 'middle' });
    put(pol, { o: 0 }); put(lk, { o: 0 }); put(back, { o: 0 }); put(front, { o: 0 });
    fk.hooks.push(c => {
      const xr = c.x - 110, yr = fk.rail(-1, xr, c.x) - 9, px = c.x - 170, py = fk.rail(-1, px, c.x) - 17 - 84;
      rg.at(xr, yr); put(pol, { x: px, y: py });

      lk.replaceChildren();
      path(lk, `M${px + 60} ${py}L${c.x - 70 - 18} ${py - 14}M${c.x - 70 + 8} ${py - 14 + 24}L${c.x - 10} ${470 - 46}`, { stroke: PROT, 'stroke-width': 5 });
    });

    say(p, 'скорость расплетания', 1230, 100, .3, { size: 24, fill: COL.dim, weight: 600, anchor: 'end' });
    const ttl0 = say(p, 'DnaB сама по себе', 90, 170, .3, { size: 34, weight: 700, anchor: 'start' });
    fk.go({ x: 331 }, .3, 4.2);
    const tauT = m('tau');
    tw(pol, { o: 1 }, tauT, .5); tw(lk, { o: 1 }, tauT, .5); tw(tp, { o: 1 }, tauT, .5); tw(back, { o: 1 }, tauT, .5); tw(front, { o: 1 }, tauT, .5);
    const ttl = say(p, 'DnaB + τ', 90, 170, tauT, { size: 34, fill: PROT, weight: 700, anchor: 'start' });
    hide(ttl0, tauT, .3);
    prog(q => { cnt.textContent = Math.round(35 + 965 * q); }, tauT + .4, 1.8, io);
    fk.go({ x: 1231 }, tauT + .6, 4.5);
    pill(p, '1000 / 35 ≈ 29 раз', DNA, 800, 780, m('x29'), 34);
    pulse(tp, m('tie'), 1.4);
    say(p, 'полимераза держится за τ и не отстаёт', 800, 860, m('tie'), { size: 28, fill: OK, weight: 700 });
    const wo = m('without');
    tw(lk, { o: 0 }, wo, .4); tw(tp, { o: 0 }, wo, .4); hide(ttl, wo, .3);
    say(p, 'DnaB без τ', 90, 170, wo, { size: 34, fill: NO, weight: 700, anchor: 'start' });
    pill(p, 'без τ вилка идёт со скоростью хеликазы', NO, 800, 700, m('without'), 28);
    prog(q => { if (q > 0) cnt.textContent = Math.round(1000 - 965 * q); }, m('without'), 1.2, io);
    say(p, 'сборка реплисомы — глава 10', 1250, 780, m('ch10'), { size: 26, fill: COL.dim, weight: 600 });
