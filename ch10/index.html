<script>
'use strict';
const CHAPTER = { number: 10, title: 'Реплисома и модель тромбона', minutes: 14, language: 'ru', next: '../ch11/' };

/* ---------- chapter drawing helpers (shared ones: lib/bio.js — replisome, fork, polymerase, betaRing, clampSide, clampLoader) ---------- */
const NB = ' ';
const endLab = (p, str, x, y, t0, fill = COL.chalk) => say(p, str, x, y, t0, { size: 30, weight: 700, fill });
const line = (p, str, x, y, t0, fill = COL.chalk, size = 28, anchor = 'start', weight = 600) => say(p, str, x, y, t0, { size, fill, anchor, weight });
// a protein body (enzyme pill) shown at once inside a group that fades as a whole
const PB = (p, lab, x, y, w, h, size) => put(enzyme(p, lab, x, y, null, { w, h, size }), { o: 1 });
const seg1 = (p, x1, y1, x2, y2, c = PROT, w = 5) => path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: c, 'stroke-width': w });
const secs = v => v.toFixed(1).replace('.', ',');
function counterAt(p, x, y, t0, unit, { size = 110, fill = DNA, txt = '0' } = {}) {
  const e = T(p, txt, { x, y, size, fill, weight: 700, anchor: 'end', o: 0 });
  show(e, t0);
  say(p, unit, x + 24, y, t0, { size: 30, fill: COL.dim, anchor: 'start', weight: 600 });
  return e;
}

/* ---------- the trombone scene (this chapter) ----------
   The fork stands still at (TX, TY) (replisome in lib/bio.js). The lagging polymerase sits at J = (NJ, YB); the loop of template with the
   growing fragment (template grey, new strand amber, RNA primer lilac) hangs between J and A. Older fragments (amber, a lilac primer
   at the 5′ end on the right) lie to the left of J in the group LS; during a cycle LS slides right (the template is pulled through the
   polymerase), and after the collapse it shifts left by one period. */
const TX = 1100, TY = 330, YB = TY + 110, NJ = TX - 540, NA = TX - 200, FW = 300, KF = 5;
const lsX = (c, q) => NJ - 280 - FW * (c + 2) + 260 * q;   // fragment c + 1 (previous) has its 5′ end 280 px left of J at q = 0, 20 px at q = 1
const leadAt = (c, q) => 700 - 200 * (c + q);
const sAt = q => ({ d: .03 + .96 * q, fd: .5 * q, pr: 1, o: 1 });
const POLY = YB - 62;   // y of the lagging polymerase when seated

function trom(p, c = 0, { ring = false, seated = false, q = 0, started = true } = {}) {
  const rs = replisome(p, TX, TY, null, { xEnd: 1580, railB: NJ, lead: Math.max(120, leadAt(c, q)) });
  put(rs.spare, { o: .5 });
  put(rs.lagRing.bk, { o: ring ? 1 : 0 }); put(rs.lagRing.fr, { o: ring ? 1 : 0 });
  if (!seated) put(rs.lag, { o: .35 });
  const LS = G(p), Lb = G(LS), Ln = G(LS), Lf = G(LS), yF = YB + 17, frag = [], junc = [];
  for (let k = 0; k < KF; k++) {
    const g = G(Ln, { o: k <= c + 1 ? 1 : 0 });
    path(g, `M${FW * k + 6} ${yF}H${FW * (k + 1)}`, { stroke: DNA, 'stroke-width': 8 });
    let r = ''; for (let x = FW * (k + 1) - 14; x > FW * k + 10; x -= 15) r += `M${x} ${YB}V${yF}`;
    path(g, r, { stroke: COL.dim, 'stroke-width': 2.5 });
    g.pr = path(g, `M${FW * (k + 1) - 26} ${yF}H${FW * (k + 1)}`, { stroke: k <= c ? DNA : RNA, 'stroke-width': 10 });
    frag.push(g);
  }
  for (let k = 1; k < KF; k++) {
    const o = k <= c + 1 ? 1 : 0, x = FW * k, y = YB + 9;
    junc.push({
      bk: path(Lb, `M${x} ${y - 30}A14 30 0 0 0 ${x} ${y + 30}`, { stroke: mix(COL.board, PROT, .55), 'stroke-width': 9 }, { o }),
      fr: path(Lf, `M${x} ${y - 30}A14 30 0 0 1 ${x} ${y + 30}`, { stroke: PROT, 'stroke-width': 9 }, { o }),
    });
  }
  put(LS, { x: lsX(c, q) });
  const lp = G(p);
  lp.at = ({ d, fd, pr, o }) => {
    lp.replaceChildren(); put(lp, { o });
    const N = 70, x1 = NJ - 60 * d, x2 = NA + 60 * d, y1 = YB + 430 * d, pts = [], cum = [0];
    for (let i = 0; i <= N; i++) {
      const u = i / N, w = 1 - u;
      pts.push([w ** 3 * NJ + 3 * w * w * u * x1 + 3 * w * u * u * x2 + u ** 3 * NA, w ** 3 * YB + 3 * w * w * u * y1 + 3 * w * u * u * y1 + u ** 3 * YB]);
      if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const L = cum[N];
    const at = s => {
      s = Math.max(0, Math.min(L, s)); let i = 1; while (i < N && cum[i] < s) i++;
      const f = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1), [ax, ay] = pts[i - 1], [bx, by] = pts[i], tx = bx - ax, ty = by - ay, n = Math.hypot(tx, ty) || 1;
      return [ax + tx * f, ay + ty * f, -ty / n, tx / n];
    };
    const seg = (a, b, off) => {
      let s = ''; const n = Math.max(2, Math.ceil((b - a) / 8));
      for (let i = 0; i <= n; i++) { const [x, y, nx, ny] = at(a + (b - a) * i / n); s += `${i ? 'L' : 'M'}${(x + nx * off).toFixed(1)} ${(y + ny * off).toFixed(1)}`; }
      return s;
    };
    path(lp, seg(0, L, 0), { stroke: COL.chalk, 'stroke-width': 8, 'stroke-linejoin': 'round' });
    const Ld = fd * L, Lp = pr * 26;
    if (Ld > 2) {
      path(lp, seg(0, Ld, 17), { stroke: DNA, 'stroke-width': 8, 'stroke-linejoin': 'round' });
      let r = ''; for (let s = 8; s < Ld; s += 15) { const [x, y, nx, ny] = at(s); r += `M${x.toFixed(1)} ${y.toFixed(1)}L${(x + nx * 17).toFixed(1)} ${(y + ny * 17).toFixed(1)}`; }
      path(lp, r, { stroke: COL.dim, 'stroke-width': 2.5 });
    }
    if (Lp > 2) path(lp, seg(Ld, Math.min(L, Ld + Lp), 17), { stroke: RNA, 'stroke-width': 10, 'stroke-linejoin': 'round' });
  };
  lp.at(started ? sAt(q) : { d: .03, fd: 0, pr: 0, o: 1 });
  const lpTo = (s0, s1, t, dur, ease = io) => prog(u => lp.at(Object.fromEntries(Object.keys(s0).map(k => [k, s0[k] + (s1[k] - s0[k]) * u]))), t, dur, ease);
  return {
    rs, LS, lp, frag, junc, lpTo,
    grow(t, dur, q0, q1, cc = c) {
      prog(u => { const qq = q0 + (q1 - q0) * u; put(LS, { x: lsX(cc, qq) }); lp.at(sAt(qq)); }, t, dur, lin);
      rs.fk.go({ lead: Math.max(120, leadAt(cc, q1)) }, t, dur);
    },
    prime(t) { lpTo({ d: .03, fd: 0, pr: 0, o: 1 }, { d: .03, fd: 0, pr: 1, o: 1 }, t, .5); },
    ringOn(t, dur = 1.4) {
      const g = rs.lagRing;
      tw(g.bk, { x: NJ - 90, y: YB + 90, o: 0 }, t - .02, .02); tw(g.fr, { x: NJ - 90, y: YB + 120, o: 0 }, t - .02, .02);
      g.show(t, .4); g.mv(NJ, YB + 9, t + .2, dur - .5); g.open(t + .3, .5, 30); g.close(t + dur - .3, .4);
    },
    seat(t) { tw(rs.lag, { o: 1 }, t, .6, out); },
    flash(t, x = NJ - 20, y = YB + 12) {
      const f = G(p, { x, y, o: 0 }); mk('circle', { r: 16, fill: 'none', stroke: COL.int, 'stroke-width': 6 }, f);
      tw(f, { o: 1 }, t, .1); tw(f, { s: 3.4, o: 0 }, t + .1, .7, out);
    },
    release(t, cc = c) {
      tw(rs.lag, { y: POLY - 34, o: .5 }, t, .6, out);
      hide(rs.lagRing.bk, t + .3, .3); hide(rs.lagRing.fr, t + .3, .3);
      show(junc[cc + 1].bk, t + .3, .3); show(junc[cc + 1].fr, t + .3, .3);
    },
    collapse(t, cc = c) {
      lpTo({ d: .99, fd: .5, pr: 1, o: 1 }, { d: .03, fd: .85, pr: 1, o: 1 }, t, 1.1);
      tw(lp, { o: 0 }, t + 1.1, .4); show(frag[cc + 2], t + 1.1, .4);
    },
    shift(t, cc = c, dur = 1.4) { tw(LS, { x: lsX(cc + 1, 0) }, t, dur); },
  };
}

// numbered steps of the trombone cycle at the right bottom; highlight(i, t) lights step i and dims the previous ones
const STEPS = ['DnaG ставит праймер 10–12 нт', 'загрузчик надевает β', 'полимераза садится на β', 'матрица тянется, петля растёт', 'упор в предыдущий фрагмент',
  'отпускает β — петля схлопывается', 'Pol I убирает праймер', 'лигаза сшивает фрагменты', 'цикл повторяется'];
function legend(p, t0) {
  [[COL.chalk, 'матрица (старая цепь)'], [DNA, 'новая цепь'], [RNA, 'РНК-праймер']].forEach(([c, str], i) => {
    const y = 770 + i * 40, sw = path(p, `M70 ${y}H116`, { stroke: c, 'stroke-width': 9 }, { o: 0 });
    show(sw, t0); line(p, str, 134, y + 8, t0, COL.dim, 24);
  });
}
function stepList(p, t0) {
  const L = STEPS.map((s, i) => say(p, `${i + 1}. ${s}`, 1130, 560 + i * 38, t0, { size: 23, fill: COL.dim, anchor: 'start', weight: 600 }));
  return (i, t, last = false) => { tw(L[i], { c_fill: DNA }, t, .3); if (i && !last) tw(L[i - 1], { c_fill: COL.chalk }, t, .3); };
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Реплисома и модель тромбона', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Репликация ДНК у прокариот» · Глава 10', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Реплисома и модель тромбона', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'как две полимеразы работают на одной вилке', 800, 540, m('sub'), { size: 36, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['holo', 'Холофермент Pol III', (m) => {
    // the puzzle: two polymerases on one fork
    const p0 = panel(0), fk = fork(p0, 760, 380, .3, { xEnd: 1400, A: 36, P: 90, n: 6, back: 330, spread: 130, hel: 'DnaB', lead: 220, fr: [[560, 330, 12]] });
    const yT = fk.rail(-1, 400, 760), yB = fk.rail(1, 400, 760);
    endLab(p0, '3′', 80, yT + 10, .5); endLab(p0, '5′', 80, yB + 10, .5);
    const a1 = arrowTo(p0, 520, yT - 80, 700, yT - 80, OK, m('parts', -12));
    line(p0, 'лидирующая: вперёд, за хеликазой', 610, yT - 108, m('parts', -12), OK, 26, 'middle', 700);
    const a2 = arrowTo(p0, 560, yB + 90, 300, yB + 90, NO, m('parts', -9));
    line(p0, 'отстающая: по правилу 5′→3′ назад, от вилки', 430, yB + 134, m('parts', -9), NO, 26, 'middle', 700);
    pill(p0, 'обе полимеразы остаются у вилки', DNA, 800, 790, m('parts', -5), 30);
    line(p0, '≈ 1000 нт/с', 1230, 250, m('parts', -3), COL.chalk, 30, 'middle', 700);
    // the machine
    const p = panel(m('parts', -.2)), subs = ['α', 'ε', 'θ', 'τ', 'γ', 'δ', 'δ′', 'χ', 'ψ', 'β'], grp = [0, 0, 0, 2, 2, 2, 2, 2, 2, 1];
    pill(p, 'холофермент Pol III: «холо» — целый', PROT, 800, 70, m('parts', 1), 28);
    const chips = subs.map((s, i) => {
      const g = G(p, { x: 295 + i * 112, y: 170, o: 0 }), r = mk('rect', { x: -42, y: -32, width: 84, height: 64, rx: 18, fill: CARD, stroke: COL.dim, 'stroke-width': 3 }, g);
      T(g, s, { y: 13, size: 38, fill: COL.chalk, weight: 700, anchor: 'middle' });
      tw(g, { o: 1 }, m('l' + i, -.1), .3);
      tw(r, { c_stroke: PROT }, m(['core', 'beta', 'ld'][grp[i]]), .4);
      return g;
    });
    say(p, '10 типов субъединиц', 800, 250, m('ten'), { size: 26, fill: COL.dim, weight: 600 });
    const cx = [330, 800, 1270], Y = 500, hd = (str, x, t) => pill(p, str, PROT, x, 330, t, 28);
    // core
    const core = G(p, { o: 0 });
    seg1(core, 330, Y + 22, 255, Y + 100); seg1(core, 330, Y + 22, 405, Y + 100);
    PB(core, 'α', 330, Y - 30, 170, 100, 48); PB(core, 'ε', 250, Y + 120, 110, 70, 38); PB(core, 'θ', 410, Y + 120, 90, 62, 34);
    show(core, m('core'), .5);
    hd('коровое ядро (core)', cx[0], m('core'));
    line(p, 'синтезирует ДНК', cx[0], 700, m('core', .8), COL.chalk, 28, 'middle');
    line(p, 'и исправляет ошибки', cx[0], 738, m('core', 1.2), COL.chalk, 28, 'middle');
    // clamp
    const br = betaRing(p, cx[1], Y, null, { s: .42 });
    put(br, { o: 0 }); show(br, m('beta'), .5);
    const dn = G(p, { x: cx[1], y: Y, o: 0 });
    mk('circle', { r: 36, fill: mix(COL.board, DNA, .3), stroke: DNA, 'stroke-width': 3 }, dn); T(dn, 'ДНК', { y: 8, size: 22, fill: DNA, weight: 700, anchor: 'middle' });
    show(dn, m('beta', .3), .5);
    hd('скользящий зажим β₂', cx[1], m('beta'));
    line(p, 'держит полимеразу на матрице', cx[1], 700, m('beta', .8), COL.chalk, 28, 'middle');
    line(p, '(глава 9)', cx[1], 738, m('beta', 1.2), COL.dim, 26, 'middle');
    // loader
    const ld = clampLoader(p, cx[2], 560, null, { s: .85 });
    put(ld, { o: 0 }); show(ld, m('ld'), .5);
    hd('загрузчик зажима', cx[2], m('ld'));
    line(p, 'сажает β на ДНК', cx[2], 700, m('ld', .8), COL.chalk, 28, 'middle');
    line(p, 'и связывает части вилки', cx[2], 738, m('ld', 1.2), COL.chalk, 28, 'middle');
    // the replisome
    const row = (str, x, t, col = PROT) => pill(p, str, col, x, 840, t, 26);
    row('холофермент', 190, m('rep')); line(p, '+', 340, 850, m('rep', .4), COL.dim, 34, 'middle');
    row('DnaB (хеликаза)', 540, m('rep', .4)); line(p, '+', 720, 850, m('rep', .8), COL.dim, 34, 'middle');
    row('DnaG (праймаза)', 900, m('rep', .8)); line(p, '+', 1080, 850, m('rep', 1.2), COL.dim, 34, 'middle');
    row('SSB', 1180, m('rep', 1.2)); line(p, '=', 1280, 850, m('rep', 1.8), COL.dim, 34, 'middle');
    row('реплисома', 1430, m('rep', 1.8), DNA);
  }],
  ['core', 'Коровое ядро', (m) => {
    const p = panel(0);
    const fr = mk('rect', { x: 1010, y: 170, width: 500, height: 380, rx: 28, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, p);
    put(fr, { o: 0 }); show(fr, .3);
    say(p, 'коровое ядро (core)', 1260, 215, .3, { size: 26, fill: COL.dim, weight: 600 });
    const nd = G(p, { o: 0 });
    seg1(nd, 1260, 395, 1130, 430); seg1(nd, 1260, 395, 1390, 430);
    const N = [['α', 1260, 320, 230, 120, 60], ['ε', 1130, 480, 150, 90, 46], ['θ', 1390, 480, 110, 76, 40]].map(([l, x, y, w, h, s]) => PB(nd, l, x, y, w, h, s));
    show(nd, .3);
    const rows = [['α', 'dnaE · 130 кДа', 'полимераза: наращивает цепь 5′→3′', 'a', 260], ['ε', 'dnaQ · 27 кДа', '3′→5′-экзонуклеаза: вырезает ошибочный нуклеотид', 'e', 400],
      ['θ', 'holE · ≈ 10 кДа', 'стимулирует корректорскую работу ε', 't', 540]];
    rows.forEach(([s, gene, role, mk_, y], i) => {
      const g = G(p, { x: 200, y, o: 0 });
      mk('circle', { r: 44, fill: mix(COL.board, PROT, .35), stroke: PROT, 'stroke-width': 3 }, g);
      T(g, s, { y: 15, size: 46, fill: PROT, weight: 700, anchor: 'middle' });
      show(g, m(mk_), .4);
      line(p, `${s} · ${gene}`, 290, y - 8, m(mk_), COL.chalk, 32, 'start', 700);
      line(p, role, 290, y + 34, m(mk_, .4), COL.dim, 26);
      pulse(N[i], m(mk_), 1.15);
    });
    pill(p, 'α одна: ≈ 10 нт за посадку, и соскальзывает', NO, 560, 740, m('alone'), 28);
    pill(p, 'α + β-кольцо: десятки тысяч нт', OK, 560, 820, m('alone', 2), 28);
  }],
  ['q1', 'Быстрая проверка', () => {
    const p = panel(0);
    say(p, 'коровое ядро Pol III', 800, 250, .2, { size: 30, fill: COL.dim, weight: 600 });
    const items = [['α', 480, 430, 300, 170, 70], ['ε', 830, 430, 230, 150, 60], ['θ', 1110, 430, 160, 110, 48]].map(([l, x, y, w, h, s]) => PB(p, l, x, y, w, h, s));
    items.forEach(e => show(e, .3));
    S.picks = [[330, 335, 300, 190, 'α'], [710, 345, 240, 170, 'ε'], [1020, 365, 180, 130, 'θ']].map(([x, y, w, h, label], i) => ({ el: items[i], box: [x, y, w, h], label }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-core', prompt: ['Какая субъединица корового ядра исправляет ошибочно вставленные нуклеотиды? Нажмите на неё.'],
    build: pickEls(S.picks, 1, 'ε — 3′→5′-экзонуклеаза корового ядра: она вырезает неверный нуклеотид.',
      i => i === 0 ? 'α — полимераза: она наращивает цепь, а исправляет ошибки другая субъединица.' : 'θ только стимулирует корректорскую работу ε, сама ошибки не исправляет.'),
  }], done) }],
  ['errors', 'Сколько ошибок даёт корректура', (m) => {
    const p = panel(0), x0 = 260, W = 1100;
    pill(p, 'без корректуры: 1 ошибка на 10⁵ нт', NO, 520, 90, m('rate'), 28);
    pill(p, 'с ε: 1 ошибка на 10⁷ нт', OK, 1130, 90, m('rate', 2.4), 28);
    const bar = (y, t) => { const r = mk('rect', { x: x0, y: y - 20, width: W, height: 40, rx: 12, fill: CARD, stroke: COL.dim, 'stroke-width': 2 }, p); put(r, { o: 0 }); show(r, t); return r; };
    say(p, 'новая цепь дочерней хромосомы: ≈ 4 600 000 нт', 800, 195, m('gen'), { size: 28, fill: COL.dim, weight: 600 });
    bar(280, m('gen'));
    line(p, 'без ε', x0 - 20, 290, m('gen'), NO, 26, 'end', 700);
    for (let i = 0; i < 46; i++) {
      const x = x0 + 16 + ((i * .61803398875) % 1) * (W - 32), t = mk('rect', { x: x - 2.5, y: 252, width: 5, height: 56, rx: 2, fill: NO }, p);
      put(t, { o: 0 }); show(t, m('no', .2 + i * .05), .15);
    }
    colorLine(p, [[`4${NB}600${NB}000 × 10⁻⁵ = `], ['46', NO], [' ошибок']], 800, 385, m('no', .4), { size: 38 });
    bar(500, m('yes')); bar(560, m('yes'));
    line(p, 'с ε: хромосома 1', x0 - 20, 510, m('yes'), OK, 26, 'end', 700); line(p, 'хромосома 2', x0 - 20, 570, m('yes'), OK, 26, 'end', 700);
    const t1 = mk('rect', { x: x0 + 430, y: 472, width: 5, height: 56, rx: 2, fill: NO }, p); put(t1, { o: 0 }); show(t1, m('yes', 1.8), .3);
    colorLine(p, [[`4${NB}600${NB}000 × 10⁻⁷ ≈ `], ['0,5', OK], [' ошибки']], 800, 655, m('yes', .4), { size: 38 });
    pill(p, 'одна ошибка примерно на каждую вторую дочернюю хромосому', OK, 800, 745, m('yes', 3.2), 28);
    line(p, 'остальное доделывает пострепликативная репарация (глава 8)', 800, 835, m('rest'), COL.dim, 26, 'middle');
